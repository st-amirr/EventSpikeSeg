name: eventspikeseg-fpga

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  image: eventspikeseg-fpga:py311-bookworm
  platform: linux/amd64
  working_dir: /workspace
  environment:
    PYTHONPATH: /workspace/src
    PYTEST_ADDOPTS: -p no:cacheprovider
    RUFF_CACHE_DIR: /tmp/ruff-cache
    PYTHONUNBUFFERED: "1"
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ./artifacts
      target: /workspace/artifacts

x-ddd17: &ddd17
  <<: *app
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ./artifacts
      target: /workspace/artifacts
    - type: bind
      # Embedded host dataset folder; do not point this at a parent "search" directory.
      source: C:/Users/stamir/Desktop/Dataset/DDD17
      target: /datasets/DDD17
      read_only: true

services:
  inspect-datasets:
    <<: *ddd17
    command: ["sh", "-lc", "echo 'Mounted DDD17:' && find /datasets/DDD17 -maxdepth 2 -type d -print | sort | head -100"]

  test:
    <<: *app
    command: ["python", "-m", "pytest", "-q"]

  lint:
    <<: *app
    command: ["python", "-m", "ruff", "check", "src", "tests"]

  inspect-ddd17:
    <<: *ddd17
    command: ["python", "-m", "eventscnn.train", "inspect", "--root", "/datasets/DDD17"]

  train-ddd17-smoke:
    <<: *ddd17
    command:
      ["python", "-m", "eventscnn.train", "single", "--root", "/datasets/DDD17",
       "--architecture", "v10_fpga_hybrid",
       "--suite", "final", "--seed", "17",
       "--epochs", "1", "--batch-size", "1",
       "--time-steps", "4",
       "--height", "32",
       "--width", "32",
       "--train-samples", "2", "--validation-samples", "2", "--checkpoint-dir", "artifacts/checkpoints"]

  train-ddd17:
    <<: *ddd17
    command:
      ["python", "-m", "eventscnn.train", "single", "--root", "/datasets/DDD17",
       "--architecture", "v10_fpga_hybrid",
       "--suite", "final", "--seed", "17",
       "--epochs", "70", "--batch-size", "14",
       "--time-steps", "15",
       "--height", "64", "--width", "64", "--train-samples", "0",
       "--validation-samples", "0", "--learning-rate", "0.002",
       "--checkpoint-dir", "artifacts/checkpoints"]

  benchmark-top-ten:
    <<: *ddd17
    command:
      ["python", "-m", "eventscnn.train", "benchmark", "--root", "/datasets/DDD17",
       "--suite", "top-ten", "--seed", "17",
       "--epochs", "8",
       "--batch-size", "14", "--time-steps", "15",
       "--height", "64", "--width", "64",
       "--train-samples", "2048",
       "--validation-samples", "512",
       "--learning-rate", "0.002",
       "--output-dir", "artifacts/ablation/top_ten"]

  benchmark-top-five:
    <<: *ddd17
    command:
      ["python", "-m", "eventscnn.train", "benchmark", "--root", "/datasets/DDD17",
       "--suite", "top-five", "--seed", "17",
       "--epochs", "8",
       "--batch-size", "14", "--time-steps", "15",
       "--height", "64", "--width", "64",
       "--train-samples", "2048",
       "--validation-samples", "512",
       "--learning-rate", "0.002",
       "--output-dir", "artifacts/ablation/top_five"]

  benchmark-ddd17:
    <<: *ddd17
    command:
      ["python", "-m", "eventscnn.train", "benchmark", "--root", "/datasets/DDD17",
       "--suite", "top-five", "--seed", "17",
       "--epochs", "8",
       "--batch-size", "14", "--time-steps", "15",
       "--height", "64", "--width", "64",
       "--train-samples", "2048",
       "--validation-samples", "512",
       "--learning-rate", "0.002",
       "--output-dir", "artifacts/ablation/top_five"]


  promote-winner:
    <<: *app
    command:
      ["python", "-m", "eventscnn.train", "promote", "--summary", "artifacts/ablation/top_five/summary.json",
       "--destination", "artifacts/checkpoints/ddd17_best.pt"]

  eval-ddd17:
    <<: *ddd17
    command:
      ["python", "-m", "eventscnn.evaluate", "--root", "/datasets/DDD17",
       "--checkpoint", "artifacts/checkpoints/ddd17_best.pt",
       "--split", "test", "--batch-size", "14",
       "--visualizations", "8", "--visualization-dir", "artifacts/Validation"]
