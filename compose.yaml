name: eventspikeseg

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  image: eventspikeseg:torch2.2.2-cuda11.8
  platform: linux/amd64
  working_dir: /workspace
  environment:
    PYTHONPATH: /workspace/src
    PYTEST_ADDOPTS: -p no:cacheprovider
    RUFF_CACHE_DIR: /tmp/ruff-cache
    PYTHONUNBUFFERED: "1"
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ./artifacts
      target: /workspace/artifacts

x-ddd17: &ddd17
  <<: *app
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ./artifacts
      target: /workspace/artifacts
    - type: bind
      # Embedded host dataset folder; do not point this at a parent "search" directory.
      source: C:/Users/stamir/Desktop/Dataset/DDD17
      target: /datasets/DDD17
      read_only: true

services:
  inspect-datasets:
    <<: *ddd17
    command: ["sh", "-lc", "echo 'Mounted DDD17:' && find /datasets/DDD17 -maxdepth 2 -type d -print | sort | head -100"]

  test:
    <<: *app
    command: ["python", "-m", "pytest", "-q"]

  lint:
    <<: *app
    command: ["python", "-m", "ruff", "check", "src", "tests"]

  inspect-ddd17:
    <<: *ddd17
    command: ["python", "-m", "eventspikeseg.train", "inspect", "--root", "/datasets/DDD17"]

  train-ddd17-smoke:
    <<: *ddd17
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      ["python", "-m", "eventspikeseg.train", "single", "--root", "/datasets/DDD17",
       "--architecture", "EventSpikeSeg",
       "--device", "cuda", "--amp",
       "--suite", "final", "--seed", "17",
       "--epochs", "1", "--batch-size", "1",
       "--time-steps", "4",
       "--height", "32",
       "--width", "32",
       "--train-samples", "2", "--checkpoint-dir", "artifacts/checkpoints"]

  # Pre-expansion ~140k final model.
  train-ddd17-140k:
    <<: *ddd17
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    command:
      ["python", "-m", "eventspikeseg.train", "single", "--root", "/datasets/DDD17",
       "--architecture", "EventSpikeSeg140k",
      #  "--device", "cuda", "--amp",
       "--height", "185", "--width", "320",
       "--suite", "final", "--seed", "17",
       "--epochs", "80", "--batch-size", "1",
       "--accumulate-steps", "4",
       "--time-steps", "10",
       "--train-samples", "0.5",
       "--validation-fraction", "0.10",
       "--learning-rate", "0.0015",
       "--checkpoint-every", "1",
       "--load", "artifacts/checkpoints/EventSpikeSeg140k_seed17_epoch005.pt",
       "--checkpoint-dir", "artifacts/checkpoints"]

  # Canonical expanded ~238k final model.
  train-ddd17:
    <<: *ddd17
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    command:
      ["python", "-m", "eventspikeseg.train", "single", "--root", "/datasets/DDD17",
       "--architecture", "EventSpikeSeg",
      #  "--device", "cuda", "--amp",
       "--height", "185", "--width", "320",
       "--suite", "final", "--seed", "17",
       "--epochs", "70", "--batch-size", "1",
       "--accumulate-steps", "4",
       "--time-steps", "10",
       "--train-samples", "0.8",
       "--validation-fraction", "0.10",
       "--learning-rate", "0.001",
       "--checkpoint-every", "1",
      #  "--load", "artifacts/checkpoints/EventSpikeSeg_seed17_last.pt",
       "--checkpoint-dir", "artifacts/checkpoints"]

  benchmark-top-ten:
    <<: *ddd17
    command:
      ["python", "-m", "eventspikeseg.train", "benchmark", "--root", "/datasets/DDD17",
       "--suite", "top-ten", "--seed", "17",
       "--epochs", "10",
       "--batch-size", "4", "--time-steps", "20",
       "--height", "64", "--width", "64",
       "--train-samples", "2048",
       "--learning-rate", "0.002",
       "--output-dir", "artifacts/ablation/top_ten"]

  benchmark-top-five:
    <<: *ddd17
    command:
      ["python", "-m", "eventspikeseg.train", "benchmark", "--root", "/datasets/DDD17",
       "--suite", "top-five", "--seed", "17",
       "--epochs", "8",
       "--batch-size", "14", "--time-steps", "15",
       "--height", "64", "--width", "64",
       "--train-samples", "2048",
       "--learning-rate", "0.002",
       "--output-dir", "artifacts/ablation/top_five"]

  benchmark-top-three:
    <<: *ddd17
    command:
      ["python", "-m", "eventspikeseg.train", "benchmark", "--root", "/datasets/DDD17",
       "--suite", "top-three", "--seed", "17",
       "--epochs", "8",
       "--batch-size", "14", "--time-steps", "15",
       "--height", "64", "--width", "64",
       "--train-samples", "2048",
       "--learning-rate", "0.002",
       "--output-dir", "artifacts/ablation/top_three"]


  promote-top-three-winner:
    <<: *app
    command:
      ["python", "-m", "eventspikeseg.train", "promote", "--summary", "artifacts/ablation/top_three/summary.json",
       "--destination", "artifacts/checkpoints/top_three_winner.pt"]

  eval-ddd17:
    <<: *ddd17
    command:
      ["python", "-m", "eventspikeseg.evaluate", "--root", "/datasets/DDD17",
       "--checkpoint", "artifacts/checkpoints/EventSpikeSeg_seed17.pt",
       "--split", "test", "--batch-size", "1",
       "--visualizations", "8", "--visualization-dir", "artifacts/Validation"]
