name: eventspikeseg

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  image: eventspikeseg:torch2.2.2-cuda11.8
  platform: linux/amd64
  working_dir: /workspace
  environment:
    PYTHONPATH: /workspace/src
    PYTEST_ADDOPTS: -p no:cacheprovider
    RUFF_CACHE_DIR: /tmp/ruff-cache
    PYTHONUNBUFFERED: "1"
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ./artifacts
      target: /workspace/artifacts

x-ddd17: &ddd17
  <<: *app
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ./artifacts
      target: /workspace/artifacts
    - type: bind
      source: C:/Users/stamir/Desktop/Dataset/DDD17
      target: /datasets/DDD17

x-dsec: &dsec
  <<: *app
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ./artifacts
      target: /workspace/artifacts
    - type: bind
      source: C:/Users/stamir/Desktop/Dataset/DSEC
      target: /datasets/DSEC

services:
  test:
    <<: *app
    command: ["python", "-m", "pytest", "-q"]

  lint:
    <<: *app
    command: ["python", "-m", "ruff", "check", "src", "tests"]

  inspect-ddd17:
    <<: *ddd17
    command:
      ["python", "-m", "eventspikeseg.data", "inspect",
       "--root", "/datasets/DDD17"]

  inspect-dsec:
    <<: *dsec
    command:
      ["python", "-m", "eventspikeseg.train", "inspect",
       "--dataset", "dsec", "--root", "/datasets/DSEC"]

  train-ddd17-smoke:
    <<: *ddd17
    gpus: all
    command:
      ["python", "-m", "eventspikeseg.train", "single",
       "--root", "/datasets/DDD17",
       "--architecture", "EventSpikeSeg140k", "--suite", "final",
       "--input-mode", "timestamp-events",
       "--device", "auto", "--amp",
       "--seed", "17", "--epochs", "1", "--batch-size", "1",
       "--height", "32", "--width", "32", "--internal-updates", "10",
       "--train-samples", "2", "--validation-fraction", "0.10",
       "--checkpoint-dir", "artifacts/checkpoints"]

  # Canonical EventSpikeSeg140k (~140k) with timestamp-scheduled continuous input.
  train-ddd17:
    <<: *ddd17
    # gpus: all
    command:
      ["python", "-m", "eventspikeseg.train", "single",
       "--root", "/datasets/DDD17",
       "--architecture", "EventSpikeSeg140k", "--suite", "final",
       "--input-mode", "timestamp-events",
      #  "--device", "auto", "--amp",
       "--height", "185", "--width", "320",
       "--seed", "17", "--epochs", "80", "--batch-size", "1",
       "--accumulate-steps", "2", "--internal-updates", "8",
       # Add "--no-continuous-state" here only for the stateless-record ablation.
       "--train-samples", "0.7", "--validation-fraction", "0.10",
       "--learning-rate", "0.001", "--checkpoint-every", "1",
       "--load", "artifacts/checkpoints/EventSpikeSeg140k_seed17_epoch015.pt",
       "--checkpoint-dir", "artifacts/checkpoints"]

  # Canonical EventSpikeSeg140k with an 11-class head and exact DSEC raw-event clocks.
  train-dsec:
    <<: *dsec
    gpus: all
    command:
      ["python", "-m", "eventspikeseg.train", "single",
       "--dataset", "dsec", "--root", "/datasets/DSEC",
       "--architecture", "EventSpikeSeg140k", "--suite", "final",
       "--input-mode", "raw-events",
       # FP16 backward is unsafe with asynchronous temporal replay: gradients
       # become non-finite before AdamW can perform its first update.
       "--device", "auto",
       "--height", "440", "--width", "640",
      #  "--height", "185", "--width", "320",
       "--seed", "17", "--epochs", "80", "--batch-size", "1","--accumulate-steps", "2",
       "--internal-updates", "10", "--sequential-chunks", "5",
       "--train-samples", "0.5", "--validation-fraction", "0.10",
       "--learning-rate", "0.001", "--checkpoint-every", "1",
       "--checkpoint-dir", "artifacts/checkpointsV3/dsec"]

  # Expanded DSEC comparison using count-preserving clocks and full-window loss.
  train-dsec-xl:
    <<: *dsec
    gpus: all
    command:
      ["python", "-m", "eventspikeseg.train", "single",
       "--dataset", "dsec", "--root", "/datasets/DSEC",
       "--architecture", "EventSpikeSegXL", "--suite", "final",
       "--input-mode", "raw-events",
       # Keep the replayed surrogate-gradient graph in FP32 (see train-dsec).
       "--device", "auto",
      #  "--height", "275", "--width", "400", ## Original size is 640 × 440
       "--height", "241", "--width", "351", ## Original size is 640 × 440
       "--seed", "17", "--epochs", "80", "--batch-size", "1","--accumulate-steps", "2",
       "--internal-updates", "10", "--sequential-chunks", "10",
       "--train-samples", "0.5", "--validation-fraction", "0.10",
       "--learning-rate", "0.0005", "--checkpoint-every", "1",
       "--checkpoint-dir", "artifacts/checkpointsV3/dsec"]

  # Optional expanded EventSpikeSegXL comparison model.
  train-ddd17-xl:
    <<: *ddd17
    gpus: all
    command:
      ["python", "-m", "eventspikeseg.train", "single",
       "--root", "/datasets/DDD17",
       "--architecture", "EventSpikeSegXL", "--suite", "final",
       "--input-mode", "timestamp-events",
       "--device", "auto", "--amp",
       "--height", "185", "--width", "320",
       "--seed", "17", "--epochs", "70", "--batch-size", "1",
       "--accumulate-steps", "4", "--internal-updates", "10",
       "--train-samples", "0", "--validation-fraction", "0.10",
       "--learning-rate", "0.001", "--checkpoint-every", "1",
       "--checkpoint-dir", "artifacts/checkpoints"]
  benchmark-top-ten:
      <<: *ddd17
      command:
        ["python", "-m", "eventspikeseg.train", "benchmark", "--root", "/datasets/DDD17",
        "--suite", "top-ten", "--seed", "17",
        "--epochs", "10",
        "--batch-size", "4", "--time-steps", "20",
        "--height", "64", "--width", "64",
        "--train-samples", "2048",
        "--learning-rate", "0.002",
        "--output-dir", "artifacts/ablation/top_ten"]

  benchmark-top-five:
    <<: *ddd17
    command:
      ["python", "-m", "eventspikeseg.train", "benchmark", "--root", "/datasets/DDD17",
      "--suite", "top-five", "--seed", "17",
      "--epochs", "8",
      "--batch-size", "14",
      "--height", "64", "--width", "64",
      "--train-samples", "2048",
      "--learning-rate", "0.002",
      "--output-dir", "artifacts/ablation/top_five"]

  benchmark-top-three:
    <<: *ddd17
    command:
      ["python", "-m", "eventspikeseg.train", "benchmark", "--root", "/datasets/DDD17",
      "--suite", "top-three", "--seed", "17",
      "--epochs", "8",
      "--batch-size", "14",
      "--height", "64", "--width", "64",
      "--train-samples", "2048",
      "--learning-rate", "0.002",
      "--output-dir", "artifacts/ablation/top_three"]


  promote-top-three-winner:
      <<: *app
      command:
        ["python", "-m", "eventspikeseg.train", "promote", "--summary", "artifacts/ablation/top_three/summary.json",
        "--destination", "artifacts/checkpoints/top_three_winner.pt"]
