name: eventspikeseg

x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  image: eventspikeseg:torch2.2.2-cuda11.8
  platform: linux/amd64
  working_dir: /workspace
  environment:
    PYTHONPATH: /workspace/src
    PYTEST_ADDOPTS: -p no:cacheprovider
    RUFF_CACHE_DIR: /tmp/ruff-cache
    PYTHONUNBUFFERED: "1"
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ./artifacts
      target: /workspace/artifacts

x-ddd17: &ddd17
  <<: *app
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ./artifacts
      target: /workspace/artifacts
    - type: bind
      source: C:/Users/stamir/Desktop/Dataset/DDD17
      target: /datasets/DDD17

services:
  test:
    <<: *app
    command: ["python", "-m", "pytest", "-q"]

  lint:
    <<: *app
    command: ["python", "-m", "ruff", "check", "src", "tests"]

  inspect-ddd17:
    <<: *ddd17
    command:
      ["python", "-m", "eventspikeseg.data", "inspect",
       "--root", "/datasets/DDD17"]

  train-ddd17-smoke:
    <<: *ddd17
    gpus: all
    command:
      ["python", "-m", "eventspikeseg.train", "single",
       "--root", "/datasets/DDD17",
       "--architecture", "EventSpikeSeg140k", "--suite", "final",
       "--input-mode", "timestamp-events",
       "--device", "auto", "--amp",
       "--seed", "17", "--epochs", "1", "--batch-size", "1",
       "--height", "32", "--width", "32", "--internal-updates", "10",
       "--train-samples", "2", "--validation-fraction", "0.10",
       "--checkpoint-dir", "artifacts/checkpoints"]

  # Lighter final candidate with timestamp-scheduled continuous input.
  train-ddd17-140k:
    <<: *ddd17
    # gpus: all
    command:
      ["python", "-m", "eventspikeseg.train", "single",
       "--root", "/datasets/DDD17",
       "--architecture", "EventSpikeSeg140k", "--suite", "final",
       "--input-mode", "timestamp-events",
      #  "--device", "auto", "--amp",
       "--height", "185", "--width", "320",
       "--seed", "17", "--epochs", "80", "--batch-size", "1",
       "--accumulate-steps", "2", "--internal-updates", "10",
       "--train-samples", "0.5", "--validation-fraction", "0.10",
       "--learning-rate", "0.0015", "--checkpoint-every", "1",
       "--checkpoint-dir", "artifacts/checkpoints"]

  # Canonical expanded final model with timestamp-scheduled continuous input.
  train-ddd17:
    <<: *ddd17
    gpus: all
    command:
      ["python", "-m", "eventspikeseg.train", "single",
       "--root", "/datasets/DDD17",
       "--architecture", "EventSpikeSeg", "--suite", "final",
       "--input-mode", "timestamp-events",
       "--device", "auto", "--amp",
       "--height", "185", "--width", "320",
       "--seed", "17", "--epochs", "70", "--batch-size", "1",
       "--accumulate-steps", "4", "--internal-updates", "10",
       "--train-samples", "0", "--validation-fraction", "0.10",
       "--learning-rate", "0.001", "--checkpoint-every", "1",
       "--checkpoint-dir", "artifacts/checkpoints"]
  benchmark-top-ten:
      <<: *ddd17
      command:
        ["python", "-m", "eventspikeseg.train", "benchmark", "--root", "/datasets/DDD17",
        "--suite", "top-ten", "--seed", "17",
        "--epochs", "10",
        "--batch-size", "4", "--time-steps", "20",
        "--height", "64", "--width", "64",
        "--train-samples", "2048",
        "--learning-rate", "0.002",
        "--output-dir", "artifacts/ablation/top_ten"]

  benchmark-top-five:
    <<: *ddd17
    command:
      ["python", "-m", "eventspikeseg.train", "benchmark", "--root", "/datasets/DDD17",
      "--suite", "top-five", "--seed", "17",
      "--epochs", "8",
      "--batch-size", "14",
      "--height", "64", "--width", "64",
      "--train-samples", "2048",
      "--learning-rate", "0.002",
      "--output-dir", "artifacts/ablation/top_five"]

  benchmark-top-three:
    <<: *ddd17
    command:
      ["python", "-m", "eventspikeseg.train", "benchmark", "--root", "/datasets/DDD17",
      "--suite", "top-three", "--seed", "17",
      "--epochs", "8",
      "--batch-size", "14",
      "--height", "64", "--width", "64",
      "--train-samples", "2048",
      "--learning-rate", "0.002",
      "--output-dir", "artifacts/ablation/top_three"]


  promote-top-three-winner:
      <<: *app
      command:
        ["python", "-m", "eventspikeseg.train", "promote", "--summary", "artifacts/ablation/top_three/summary.json",
        "--destination", "artifacts/checkpoints/top_three_winner.pt"]
