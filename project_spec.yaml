    - "f_inst competition unit"
    - "Feature-map homeostasis counters"
    - "Proposal clustering"
    - "ROI event gate"
    - "Classification and tracking output interface"
  avoid:
    - "Flattening convolution into a large fully connected matrix"
    - "Deeply modifying every fully connected Spiker+ assumption"
    - "Building a replacement for PyTorch training"
  proposed_repository:
    training:
