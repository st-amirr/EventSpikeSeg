    - Alessandro Savino
    - Stefano Di Carlo
    year: 2024
    venue: IEEE Transactions on Emerging Topics in Computing
    doi: 10.1109/TETC.2024.3511676
    role: Candidate reusable FPGA-SNN framework and design inspiration
    project_takeaway: Its fixed-point LIF arithmetic, power-of-two leakage, configurable reset behavior, HDL generation,
      and verification methodology should be evaluated for selective reuse against the frozen EventSCNN equivalence contract.
    url: https://github.com/smilies-polito/Spiker
  - id: zhang2022_stnet
    title: Spiking Transformers for Event-Based Single Object Tracking
    authors:
    - Jiqing Zhang et al.
