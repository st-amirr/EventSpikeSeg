document:
  title: "Hardware-Oriented Event-Camera Spiking CNN for Region Proposal, Classification, and Tracking"
  short_name: "EventSCNN-FPGA"
  version: "0.1.0"
  status: "research_design_draft"
  created_date: "2026-08-02"
  intended_uses:
    - "Software and FPGA implementation specification"
    - "Research planning and experiment tracking"
    - "Foundation for a future journal or conference article"
    - "Interface contract between SpikingJelly training and an extended Spiker+-derived FPGA backend"
  central_interpretation: >-
    The network is discrete-time at the algorithm level and is trained using temporal
    event-count tensors, but the FPGA executes convolution sparsely by reading spike
    addresses and adding shared kernel weights only for active spikes. Exact continuous
    timestamp decay is intentionally outside the first implementation.

researcher_context:
  background:
    - "MEng graduate in Electronic Engineering, Digital Systems"
    - "FPGA-based real-time semantic segmentation for autonomous-vehicle imagery"
    - "Adapted LMIINet to CGRA4ML on a Xilinx ZCU104"
    - "Experience with 8-bit quantization-aware training and fixed-point optimization"
    - "Experience with VHDL, FPGA synthesis/simulation, Python, C/C++, microcontrollers, sensors, and embedded systems"
    - "Approximately 18 months of embedded-system experience"
  research_direction:
    - "Move from dense frame-based image processing toward neuromorphic and event-based perception"
    - "Develop a spike-native vision pipeline whose hardware operations are dominated by additions, comparisons, shifts, address generation, and memory access"
    - "Produce a credible research article and demonstrator for future PhD applications in neuromorphic vision and hardware-software co-design"
  fixed_constraints:
    - "Use event-only DAVIS input initially; do not use APS intensity frames"
    - "Use genuine stateful spiking convolutional layers"
    - "Training may use dense PyTorch convolution on a PC"
    - "FPGA inference must exploit sparsity through conditional weight additions"
    - "Exact event-by-event continuous-time decay is not required"
    - "FPGA is the first hardware target; dedicated neuromorphic hardware is a later path"

decision_history:
  - step: 1
    issue: "Continuous-time event processing"
    decision: "Not required for version 1"
    reason: "The main goal is matrix multiplier-minimized FPGA inference"
  - step: 2
    issue: "SpikingJelly NCHW/TNCHW representation"
    decision: "Accepted"
    reason: >-
      Dense software convolution over a sparse spike tensor is mathematically equivalent
      to summing the shared-kernel contributions of active spike addresses. The FPGA can
      implement only those additions.
  - step: 3
    issue: "Custom training framework"
    decision: "Do not build one"
    reason: "SpikingJelly and PyTorch already provide training, automatic differentiation, datasets, and optimization"
  - step: 4
    issue: "Direct SpikingJelly-to-Spiker+ conversion"
    decision: "Not currently assumed to work automatically"
    reason: >-
      A DAVIS-oriented shared-kernel convolution backend, custom cross-filter inhibition,
      adaptive thresholds, proposal logic, and tracking are not available as a complete
      existing Spiker+ path.
  - step: 5
    issue: "Extend Spiker+ or start from zero"
    decision: "Build a clean convolutional backend while reusing selected Spiker+ components and methods"
    reuse:
      - "Fixed-point neuron arithmetic"
      - "Threshold and reset concepts"
      - "Power-of-two leak approximation"
      - "Quantization methodology"
      - "VHDL generation utilities and verification structure"
    implement_new:
      - "Spatial event routing"
      - "Shared-kernel convolution scheduling"
      - "Feature-map state memory"
      - "f_inst and f_long logic"
      - "Region proposal, ROI, classification, and tracking interfaces"

research_problem:
  problem_statement: >-
    Event cameras generate sparse asynchronous brightness-change events, but trainable
    deep-SNN frameworks typically execute convolution as dense tensor operations. FPGA
    SNN generators provide efficient neuron implementations but do not directly provide
    a DAVIS-oriented event-addressed convolutional pipeline with region proposals,
    custom competition/homeostasis, classification, and tracking.
  primary_question: >-
    Can a convolutional SNN trained in SpikingJelly be mapped to a functionally equivalent
    FPGA architecture that replaces dense convolutional multiplication with sparse
    event-triggered kernel-weight accumulation while retaining useful competitive and
    adaptive spiking dynamics?
  secondary_questions:
    - "What accuracy is lost after weight, state, threshold, and decay quantization?"
    - "Does f_inst-style competition improve precision, feature diversity, and spike sparsity?"
    - "Does f_long/T_thresh-style homeostasis justify its hardware overhead?"
    - "Which event-bin duration gives the best accuracy-latency-throughput trade-off?"
    - "Can the pipeline remain useful for tracking and classification with substantially fewer synaptic operations than dense convolution?"
  working_hypotheses:
    - "Sparse spike-address accumulation reduces arithmetic approximately in proportion to activity"
    - "Stride-downsampled feature maps make DAVIS-resolution neuron-state storage practical on a ZCU104-class FPGA"
    - "Feature-map-level homeostasis captures much of the filter-diversity benefit of per-neuron adaptive thresholds with much lower memory cost"
    - "Three spiking convolution layers are sufficient for a first single-object demonstrator"

literature_review:
  lineage_summary:
    - "DAVIS established low-latency sparse ON/OFF event output at practical image resolutions"
    - "The 2019 SNN region-proposal paper demonstrated refractory filtering, local LIF convolution, and clustering on DAVIS traffic recordings"
    - "The 2021 trajectory-prediction paper demonstrated a three-layer convolutional SNN with STDP, instantaneous inhibition, adaptive thresholds, motion-selective filters, and a supervised readout"
    - "SpikingJelly provides a practical trainable framework for convolutional SNNs, event datasets, surrogate gradients, and optional STDP"
    - "Spiker+ provides a reference path for compact fixed-point FPGA SNN accelerators and automatic VHDL generation"
    - "Modern SNN trackers confirm that event-only or event-centered SNN tracking is an active research direction, but many use transformer or hybrid structures that are less suitable for the first accumulator-centric FPGA design"
  key_works:
    - id: "berner2013_sparse_sensor"
      title: "A 240x180 10mW 12us latency sparse-output vision sensor for mobile applications"
      authors: ["R. Berner", "C. Brandli", "M. Yang", "S.-C. Liu", "T. Delbruck"]
      year: 2013
      venue: "Symposium on VLSI Circuits"
      role: "Sensor lineage and justification for native polarity events"
      project_takeaway: "Preserve ON/OFF event addresses through the input hardware"
      url: "https://www.research-collection.ethz.ch/handle/20.500.11850/78978"
    - id: "acharya2019_rpn"
      title: "Spiking Neural Network based Region Proposal Networks for Neuromorphic Vision Sensors"
      authors: ["Jyotibdha Acharya", "Vandana Padala", "Arindam Basu"]
      year: 2019
      venue: "IEEE ISCAS"
      doi: "10.1109/ISCAS.2019.8702651"
      role: "Basis for local event-activity proposals and spatial clustering"
      project_takeaway: "Add learned features, classification, and temporal tracking to the proposal concept"
      url: "https://arxiv.org/abs/1902.09864"
    - id: "debat2021_trajectory"
      title: "Event-Based Trajectory Prediction Using Spiking Neural Networks"
      authors: ["Guillaume Debat", "Tushar Chauhan", "Benoit R. Cottereau", "Timothee Masquelier", "Michel Paindavoine", "Robin Baures"]
      year: 2021
      venue: "Frontiers in Computational Neuroscience"
      doi: "10.3389/fncom.2021.658764"
      role: "Basis for three SNN layers, STDP experiments, f_inst, f_long, T_thresh, and motion-selective filters"
      project_takeaway: "Redesign the concepts for supervised tracking and FPGA-efficient state storage"
      url: "https://www.frontiersin.org/journals/computational-neuroscience/articles/10.3389/fncom.2021.658764/full"
    - id: "fang2023_spikingjelly"
      title: "SpikingJelly: An open-source machine learning infrastructure platform for spike-based intelligence"
      authors: ["Wei Fang et al."]
      year: 2023
      venue: "Science Advances"
      doi: "10.1126/sciadv.adi1480"
      role: "Primary software framework"
      project_takeaway: "Use a constrained hardware-compatible subset and custom neuron/competition modules"
      url: "https://github.com/fangwei123456/spikingjelly"
    - id: "carpegna2024_spiker_plus"
      title: "Spiker+: a framework for the generation of efficient Spiking Neural Networks FPGA accelerators for inference at the edge"
      authors: ["Alessio Carpegna", "Alessandro Savino", "Stefano Di Carlo"]
      year: 2024
      venue: "IEEE Transactions on Emerging Topics in Computing"
      doi: "10.1109/TETC.2024.3511676"
      role: "Reference and partial implementation base for FPGA SNN hardware"
      project_takeaway: "Reuse lower-level hardware methods; add a separate spatial sparse-convolution backend"
      url: "https://github.com/smilies-polito/Spiker"
    - id: "zhang2022_stnet"
      title: "Spiking Transformers for Event-Based Single Object Tracking"
      authors: ["Jiqing Zhang et al."]
      year: 2022
      venue: "CVPR"
      role: "Accuracy reference for event-based SNN tracking"
      project_takeaway: "Use for comparison, not as the initial FPGA architecture"
      url: "https://openaccess.thecvf.com/content/CVPR2022/html/Zhang_Spiking_Transformers_for_Event-Based_Single_Object_Tracking_CVPR_2022_paper.html"
    - id: "ji2023_sctn"
      title: "SCTN: Event-based object tracking with energy-efficient deep convolutional neural networks"
      authors: ["M. Ji et al."]
      year: 2023
      venue: "Frontiers in Neuroscience"
      role: "Convolutional SNN tracking reference"
      project_takeaway: "Supports supervised discriminative training rather than exclusive reliance on STDP"
      url: "https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2023.1123698/full"
    - id: "wang2024_spikemot"
      title: "SpikeMOT: Event-Based Multi-Object Tracking With Sparse Motion Features"
      authors: ["Song Wang", "Zhu Wang", "Can Li", "Xiaojuan Qi", "Hayden Kwok-Hay So"]
      year: 2024
      venue: "IEEE TPAMI"
      role: "Reference for sparse motion features and eventual multi-object extension"
      project_takeaway: "Begin with single-object tracking, then add detection refresh and identity association"
      url: "https://arxiv.org/abs/2309.16987"
    - id: "shan2026_sdtrack"
      title: "SDTrack: A Baseline for Event-based Tracking via Spiking Neural Networks"
      authors: ["Yimeng Shan et al."]
      year: 2026
      venue: "CVPR"
      role: "Contemporary fully spike-driven tracking reference"
      project_takeaway: "Compare accuracy while emphasizing the simpler hardware-oriented convolutional design"
      url: "https://openaccess.thecvf.com/content/CVPR2026/html/Shan_SDTrack_A_Baseline_for_Event-based_Tracking_via_Spiking_Neural_Networks_CVPR_2026_paper.html"
  identified_gap: >-
    The literature separately provides event sensors, SNN proposals, motion-selective
    STDP networks, trainable SNN frameworks, modern trackers, and FPGA SNN generators.
    The intended contribution integrates these into a reproducible train-to-hardware
    path for sparse shared-kernel FPGA convolution with custom competition and
    homeostasis, region proposals, classification, and tracking.

