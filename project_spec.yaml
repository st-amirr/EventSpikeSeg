risks_and_mitigations:
- risk: Three layers may be too small for robust classification
  mitigation: Keep depth and widths parameterized; evaluate a fourth layer after validating hardware
- risk: Static objects produce insufficient events
  mitigation: Target moving-object tasks first and use rolling temporal context
- risk: Event bursts exceed FPGA throughput
  mitigation: Use Conv1 stride, PE scaling, FIFO sizing, optional filtering, and ROI gating
- risk: Per-neuron f_long doubles state memory
  mitigation: Use per-feature-map homeostasis by default
- risk: A BRAM-only mapping prevents fit even when sufficient LUTRAM is available
  mitigation: Use the documented hybrid placement policy, tile temporary accumulators, and compare synthesis reports for
    BRAM-heavy and balanced mappings without changing numerical behavior
- risk: SpikingJelly and RTL operation order differ
  mitigation: Freeze a custom hardware-compatible neuron before final training
- risk: Quantization reduces accuracy
  mitigation: Use QAT and report the accuracy-resource Pareto frontier
- risk: Pixel attention becomes fragmented or too dense
  mitigation: Use event-supported targets, a local 3x3 head, Dice/rate losses, centroid supervision, and report both pixel
    and derived-component metrics before hardware integration
- risk: The project-specific FPGA backend grows into an overly broad hardware framework or duplicates suitable existing IP
  mitigation: Implement only the operations required by the selected network, evaluate compatible framework components
    such as Spiker+ before duplicating them, keep a frozen model schema, and validate one layer before integration.
novelty:
  primary_candidates:
  - SpikingJelly-to-FPGA flow for shared-kernel convolution implemented as sparse event-addressed weight accumulation
  - Unified event-SNN proposal, multiclass classification, and tracking pipeline
  - Hardware-efficient f_inst cross-filter competition
  - Hardware-efficient f_long/T_thresh feature-map homeostasis
  - Bit-exact VHDL-2008 FPGA backend for competitive and adaptive convolutional SNNs with evidence-based framework reuse
  strongest_positioning: 'Hardware-algorithm co-design for event-camera tracking: trainable competitive and adaptive
    spiking convolution layers mapped to a multiplier-minimized sparse FPGA architecture.'
  claims_requiring_measurement:
  - Energy reduction relative to dense alternatives
  - Accuracy improvement from f_inst or f_long
  - Efficiency advantage over previous FPGA SNN accelerators
  - Real-time operation under representative event-rate distributions
  claims_to_avoid_without_evidence:
  - Fully asynchronous hardware
  - Biological equivalence
  - State-of-the-art accuracy
  - Zero multiplication in the complete system
  - Guaranteed energy benefit based only on operation counts
