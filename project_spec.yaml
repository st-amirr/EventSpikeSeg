  - id: berner2013_sparse_sensor
    title: A 240x180 10mW 12us latency sparse-output vision sensor for mobile applications
    authors:
    - R. Berner
    - C. Brandli
    - M. Yang
    - S.-C. Liu
    - T. Delbruck
    year: 2013
    venue: Symposium on VLSI Circuits
    role: Sensor lineage and justification for native polarity events
    project_takeaway: Preserve ON/OFF event addresses through the input hardware
    url: https://www.research-collection.ethz.ch/handle/20.500.11850/78978
  - id: acharya2019_rpn
    title: Spiking Neural Network based Region Proposal Networks for Neuromorphic Vision Sensors
    authors:
    - Jyotibdha Acharya
    - Vandana Padala
    - Arindam Basu
    year: 2019
    venue: IEEE ISCAS
    doi: 10.1109/ISCAS.2019.8702651
    role: Basis for local event-activity proposals and spatial clustering
    project_takeaway: Add learned features, classification, and temporal tracking to the proposal concept
    url: https://arxiv.org/abs/1902.09864
  - id: debat2021_trajectory
    title: Event-Based Trajectory Prediction Using Spiking Neural Networks
    authors:
    - Guillaume Debat
    - Tushar Chauhan
    - Benoit R. Cottereau
    - Timothee Masquelier
    - Michel Paindavoine
    - Robin Baures
    year: 2021
    venue: Frontiers in Computational Neuroscience
    doi: 10.3389/fncom.2021.658764
    role: Basis for three SNN layers, STDP experiments, f_inst, f_long, T_thresh, and motion-selective filters
    project_takeaway: Redesign the concepts for supervised tracking and FPGA-efficient state storage
    url: https://www.frontiersin.org/journals/computational-neuroscience/articles/10.3389/fncom.2021.658764/full
  - id: fang2023_spikingjelly
    title: 'SpikingJelly: An open-source machine learning infrastructure platform for spike-based intelligence'
    authors:
    - Wei Fang et al.
    year: 2023
    venue: Science Advances
    doi: 10.1126/sciadv.adi1480
