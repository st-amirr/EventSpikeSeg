    - "Hardware-efficient f_long/T_thresh feature-map homeostasis"
    - "Spiker+-derived convolutional backend with bit-exact export and verification"
  strongest_positioning: >-
    Hardware-algorithm co-design for event-camera tracking: trainable competitive and
    adaptive spiking convolution layers mapped to a multiplier-minimized sparse FPGA architecture.
  claims_requiring_measurement:
