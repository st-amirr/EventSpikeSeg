implementation_plan:
  phase_0:
    name: "Literature and requirements"
    deliverables: ["literature table", "frozen equations", "dataset choice", "equivalence contract"]
    exit: "All state, ordering, reset, competition, and quantization semantics are unambiguous"
  phase_1:
    name: "SpikingJelly baseline"
    deliverables: ["three-layer model", "event binning", "proposal head", "classifier", "single-object tracker"]
    exit: "Stable training and meaningful task performance"
  phase_2:
    name: "Custom dynamics"
    deliverables: ["f_inst", "f_long/T_thresh", "STDP experiment", "sparsity/diversity ablations"]
    exit: "Selected dynamics with quantified benefit and cost"
  phase_3:
    name: "Quantized reference"
    deliverables: ["integer exporter", "bit-accurate simulator", "golden vectors"]
    exit: "Deterministic acceptable quantized accuracy"
  phase_4:
    name: "Single-layer FPGA"
    deliverables: ["FIFO", "kernel ROM", "address generator", "state RAM", "LIF", "f_inst", "f_long"]
    exit: "One layer exactly matches the golden model"
  phase_5:
    name: "Multilayer FPGA"
    deliverables: ["three-layer routing", "proposal clustering", "classifier", "tracker interface"]
    exit: "Recorded sequences run end-to-end without mismatch"
  phase_6:
    name: "Live demonstration and article"
    deliverables: ["live DAVIS demo", "resource/power results", "ablations", "paper figures and tables"]
    exit: "Claims are supported by accuracy, sparsity, latency, throughput, and power measurements"

risks_and_mitigations:
  - risk: "Three layers may be too small for robust classification"
    mitigation: "Keep depth and widths parameterized; evaluate a fourth layer after validating hardware"
  - risk: "Static objects produce insufficient events"
    mitigation: "Target moving-object tasks first and use rolling temporal context"
  - risk: "Event bursts exceed FPGA throughput"
    mitigation: "Use Conv1 stride, PE scaling, FIFO sizing, optional filtering, and ROI gating"
  - risk: "Per-neuron f_long doubles state memory"
    mitigation: "Use per-feature-map homeostasis by default"
  - risk: "SpikingJelly and RTL operation order differ"
    mitigation: "Freeze a custom hardware-compatible neuron before final training"
  - risk: "Quantization reduces accuracy"
    mitigation: "Use QAT and report the accuracy-resource Pareto frontier"
  - risk: "Proposal clustering becomes too expensive"
    mitigation: "Use low-resolution objectness and simple connected components"
  - risk: "Spiker+ extension becomes difficult"
    mitigation: "Keep a separate convolution backend and treat Spiker+ as reusable infrastructure"

novelty:
  primary_candidates:
    - "SpikingJelly-to-FPGA flow for shared-kernel convolution implemented as sparse event-addressed weight accumulation"
    - "Unified event-SNN proposal, classification, and tracking pipeline"
