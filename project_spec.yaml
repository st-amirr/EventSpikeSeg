project:
  name: EventSpikeSeg-FPGA
  task: event-camera semantic segmentation
  dataset: Ev-SegNet semantic extension of DDD17
input:
  stored_shape: [N, 6, H, W]
  model_shape: [T, N, 6, H, W]
  representation:
    - polarity histogram pair
    - normalized timestamp mean pair
    - normalized timestamp standard-deviation pair
  encoding: repeat fixed six-channel current over internal SNN timesteps
  warning: not raw chronological event bins
classes:
  names: [flat, construction+sky, object, nature, human, vehicle]
  ignore_index: 255
search:
  variants: 10
  seed: 17
  primary_metric: validation_mIoU
  tie_breakers: [parameter_count, output_spike_rate]
  finalize_after_seeds: 3
hardware:
  target: sparse fixed-point FPGA inference
  preferred:
    - depthwise_pointwise_convolution
    - additive_skip_connections
    - nearest_neighbor_upsampling
    - foldable_channel_affine
    - integer_lif
    - adaptive_threshold
  ablations:
    - batch_normalization
    - gap_sigmoid_channel_gate
    - multiscale_dilation
    - auxiliary_head
