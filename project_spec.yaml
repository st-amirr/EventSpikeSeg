fpga_execution:
  algorithmic_model: "discrete_time_spiking_network"
  physical_model: "clocked_sparse_event_address_processing"
  synaptic_operation:
    equation: "I_j[t] += W_ji for every active presynaptic spike i"
    multiplication: "not_required_for_binary_hidden_spikes"
    first_layer_counts: "Repeated sensor events cause repeated weight additions"
  per_timestep_pipeline:
    - "Buffer DAVIS events for timestep t"
    - "Generate affected Conv1 addresses and read shared weights"
    - "Accumulate Conv1 currents"
    - "At the Conv1 barrier, process active neurons: leak, current, threshold, f_inst, spike, reset, f_long"
    - "Route Conv1 spike addresses through Conv2"
    - "Route Conv2 spike addresses through Conv3"
    - "Update objectness, proposals, classification, and tracking"
    - "Advance to timestep t+1"
  active_state_management:
    selected: "active_neuron_list"
    alternatives:
      - name: "full_neuron_sweep"
        benefit: "Simple exact semantics"
        cost: "High memory bandwidth"
      - name: "active_neuron_list"
        benefit: "Updates only neurons with nonzero state or input"
        cost: "Queue and duplicate-management logic"
      - name: "lazy_decay_with_last_update_step"
        benefit: "Maximum sparsity"
        cost: "More complex beta^delta approximation"
  parallelism:
    processing_elements: [1, 4, 8, 16]
    strategies:
      - "Parallel output channels"
      - "Parallel kernel offsets"
      - "Bank state RAM to avoid write conflicts"
    double_buffering: "Use ping-pong event FIFOs"
  throughput:
    additions_per_input_spike: "ceil(Kh/Sh) * ceil(Kw/Sw) * Cout"
    deadline: "processing_cycles_per_timestep <= bin_duration * FPGA_clock_frequency, otherwise FIFO buffering is required"
    reporting: "Report average, 99th percentile, and worst-observed event loads"

fpga_target:
  board: "Xilinx_ZCU104"
  initial_clock_target_mhz: 100
  reasons:
    - "Matches prior user experience"
    - "Provides substantial BRAM/URAM"
    - "Allows ARM-side control, replay, logging, and early software tracking"
  interfaces:
    offline_first: "DDR_or_host_stream_of_timestamped_events"
    live_later: "USB_or_AER_bridge_to_AXI_Stream"
    control: "AXI_Lite"
    outputs: "AXI_Stream_or_memory_mapped_proposals_classes_tracks"
  resource_priorities:
    - "BRAM/URAM capacity and banking"
    - "Memory port conflicts"
    - "LUT adders and comparators"
    - "FIFO capacity"
    - "Minimal or zero DSP use in the spiking backbone"
    - "Clock enable during inactive periods"

datasets:
  progression:
    - stage: 1
      dataset: "synthetic_moving_shapes_or_ball"
      purpose: "Verify motion selectivity, dynamics, routing, and RTL equivalence"
    - stage: 2
      dataset: "MEVDT"
      sensor: "DAVIS240C"
      task: "vehicle detection, classification, and tracking"
      reason: "Direct sensor/resolution match with boxes, classes, and track IDs"
      url: "https://arxiv.org/abs/2407.20446"
    - stage: 3
      dataset: "FE240hz"
      task: "high-frequency single-object tracking"
      reason: "Used by established event-tracking literature"
    - stage: 4
      dataset: "DSEC-MOT"
      task: "future multi-object tracking"
      reason: "Real traffic with occlusion and identity challenges"
      url: "https://neuromorphicsystems.github.io/land/dsec-mot"
    - stage: 5
      dataset: "custom_DAVIS_recordings"
      task: "live FPGA demonstration"
      reason: "Needed for real event bursts, noise, latency, and power"
  split_policy:
    - "Split by complete sequence, not random temporal windows"
    - "Prevent adjacent windows from one trajectory appearing in train and test"
    - "Report class, speed, lighting, event rate, and occlusion distributions"

evaluation:
