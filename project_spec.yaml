document:
  title: Hardware-Oriented Event-Camera Spiking CNN for Pixel Attention, Classification, and Tracking
  short_name: EventSCNN-FPGA
  version: 0.7.0
  status: mevdt_sequence_validation_and_multiseed_evaluation_in_progress
  created_date: '2026-08-02'
  intended_uses:
  - Software and FPGA implementation specification
  - Research planning and experiment tracking
  - Foundation for a future journal or conference article
  - Interface contract between SpikingJelly training, the bit-accurate reference model, and a VHDL-2008 FPGA backend
  central_interpretation: The network is discrete-time at the algorithm level and is trained using temporal event-count
    tensors, but the FPGA executes convolution sparsely by reading spike addresses and adding shared kernel weights
    only for active spikes. The FPGA backend is project-specific VHDL-2008 and may selectively reuse compatible
    framework components after equivalence and architectural-fit validation.
decision_history:
- step: 1
  issue: Continuous-time event processing
  decision: Not required for version 1
  reason: The goal is multiplier-minimized FPGA inference using discrete SNN timesteps, not exact biological timing
    or per-event continuous-time decay.
- step: 2
  issue: SpikingJelly NCHW/TNCHW representation
  decision: Accepted
  reason: Dense software convolution over a sparse spike tensor is mathematically equivalent to summing the shared-kernel
    contributions of active spike addresses. The FPGA can execute only those additions.
- step: 3
  issue: Custom training framework
  decision: Do not build one
  reason: SpikingJelly and PyTorch already provide automatic differentiation, surrogate-gradient training, dataset
    handling, temporal execution, and optimization.
- step: 4
  issue: FPGA implementation framework
  decision: Use a project-specific VHDL-2008 backend with selective framework reuse
  reason: The required design contains shared-kernel event-addressed convolution, feature-map state memories, custom
    f_inst competition, f_long/T_thresh homeostasis, pixel attention, classification, and centroid tracking.
    Custom VHDL remains necessary for unsupported operations, but compatible framework components should be reused
    when they preserve the frozen arithmetic and interfaces and demonstrably reduce implementation or verification risk.
- step: 5
  issue: Use of prior FPGA-SNN frameworks
  decision: Evaluate for selective adoption; neither require nor prohibit integration
  reason: Spiker+ demonstrates fixed-point LIF arithmetic, power-of-two leakage, configurable reset behavior, VHDL
    generation, and resource-aware acceleration. Spiker+ or another framework may be adapted for components that match
    the EventSCNN contracts. Reject or replace framework components when they flatten convolution, alter operation order,
    prevent custom dynamics or pixel-attention interfaces, or add more integration cost than a focused VHDL implementation.
- step: 6
  issue: Dataset selection
  decision: Use MEVDT as the primary training, validation, tracking, and hardware-replay dataset
  reason: MEVDT is locally available and provides native DAVIS240C 240x180 events, vehicle boxes, track IDs, and
    authoritative splits for executable end-to-end evidence at the exact FPGA model resolution.
- step: 7
  issue: MEVDT classification scope
  decision: Define the primary learned task as vehicle-versus-background classification with single-vehicle tracking
  reason: The available MEVDT annotations support an executable binary classification and tracking contract. Do not claim
    unsupported multiclass accuracy; any later general-object extension is a separate future milestone.
- step: 8
  issue: Filled-box objectness and box ROI inference underperform on sparse MEVDT events
  decision: Use event-supported pixel attention, predicted-attention classification, and centroid tracking as the primary path
  reason: Active event pixels inside annotations align supervision with the input modality. A local 3x3 spiking head preserves
    spatial detail, while weighted pooling and centroid moments avoid requiring a bounding-box ROI during inference. Boxes
    remain supervision and evaluation metadata; legacy box utilities remain comparison baselines.
- step: 9
  issue: Analog linear classification readout remained after the spiking attention head
  decision: Replace it with bias-free class synapses and independent hardware-compatible LIF output neurons
  reason: The requested learned path is fully spike-driven. Predicted attention gates Conv3 spikes at every timestep;
    weighted spike additions drive class LIF neurons; emitted class spike counts determine the class. Independent output
    neurons avoid the non-background spike starvation observed when f_inst lateral competition was applied across classes.
- step: 10
  issue: A BRAM-only state and buffer mapping can prevent fit on BRAM-constrained FPGAs
  decision: Require synthesis-guided hybrid BRAM, distributed LUTRAM, and register allocation
  reason: Large deep convolution membrane arrays suit BRAM, while small high-access-rate attention state, shared weights,
    short FIFOs, address queues, scratch tiles, and lookup tables can use LUTRAM without consuming scarce BRAM blocks.
    Tiny channel/class state belongs in registers. Physical placement may change only if bit-exact behavior is preserved.
- step: 11
  issue: Future general-object development
  decision: Use EventVOT only as a later target-conditioned general-object development path
  reason: EventVOT is a publicly described event-only visual object tracking dataset with diverse object categories and
    raw events. It is deferred until the MEVDT protocol is sound because it requires target-conditioned single-object
    tracking and a documented 1280x720 to 240x180 transform.
- step: 12
  issue: Earlier bounded MEVDT results reused official test frames for development
  decision: Freeze a deterministic scene-stratified sequence-level validation partition inside the official train split
  reason: Architecture, thresholds, checkpoints, and ablations must be selected on validation sequences only. Evaluate
    complete sequences chronologically, repeat training with at least three seeds, and touch the official test split only
    after selecting the final configuration.
research_problem:
  problem_statement: Event cameras generate sparse asynchronous brightness-change events, but trainable deep-SNN frameworks
    typically execute convolution as dense tensor operations. FPGA SNN generators provide efficient neuron implementations
    but do not directly provide a DAVIS-oriented event-addressed convolutional pipeline with region proposals, custom
    competition/homeostasis, classification, and tracking.
  primary_question: Can a convolutional SNN trained in SpikingJelly be mapped to a functionally equivalent FPGA architecture
    that replaces dense convolutional multiplication with sparse event-triggered kernel-weight accumulation while
    retaining useful competitive and adaptive spiking dynamics?
  secondary_questions:
  - What accuracy is lost after weight, state, threshold, and decay quantization?
  - Does f_inst-style competition improve precision, feature diversity, and spike sparsity?
  - Does f_long/T_thresh-style homeostasis justify its hardware overhead?
  - Which event-bin duration gives the best accuracy-latency-throughput trade-off?
  - Can the pipeline remain useful for tracking and classification with substantially fewer synaptic operations than
    dense convolution?
  working_hypotheses:
  - Sparse spike-address accumulation reduces arithmetic approximately in proportion to activity
  - Stride-downsampled feature maps make DAVIS-resolution neuron-state storage practical on a ZCU104-class FPGA
  - Feature-map-level homeostasis captures much of the filter-diversity benefit of per-neuron adaptive thresholds
    with much lower memory cost
  - Three spiking convolution layers are sufficient for a first single-object demonstrator
literature_review:
  lineage_summary:
  - DAVIS established low-latency sparse ON/OFF event output at practical image resolutions.
  - The 2019 SNN region-proposal paper demonstrated refractory filtering, local LIF convolution, and clustering on
    DAVIS traffic recordings.
  - The 2021 trajectory-prediction paper demonstrated a three-layer convolutional SNN with STDP, instantaneous inhibition,
    adaptive thresholds, motion-selective filters, and a supervised readout.
  - SpikingJelly provides the selected trainable framework for convolutional SNNs, event datasets, surrogate gradients,
    and optional STDP.
  - 'Spiker+ is a candidate source of reusable VHDL and generation methodology: adopt compatible pieces only after
    bit-exact and architectural-fit validation, while implementing unsupported EventSCNN features in custom VHDL.'
  - Modern event-based SNN trackers confirm that event-only tracking is active, but many use transformer-scale or
    hybrid structures that are less suitable for the first multiplier-minimized FPGA design.
