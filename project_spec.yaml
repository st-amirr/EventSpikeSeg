open_decisions:
- priority: high
  item: Exact custom LIF update order
  recommended_default: Leak previous membrane, add full timestep current, compare adaptive threshold, apply f_inst,
    emit spike, subtract threshold, update f_long.
- priority: high
  item: f_long decay implementation
  recommended_default: Triangular or countdown adaptation per feature map for the first FPGA.
- priority: high
  item: EventVOT target conditioning and official split integration
  recommended_default: Encode the annotated first-frame target without a box ROI at inference, preserve official splits,
    and validate the raw-event coordinate transform on a tiny fixture before full training.
- priority: medium
  item: Pixel-attention decoding
  recommended_default: Use predicted half-resolution attention directly for pooling and centroid tracking; derive boxes
    with connected components only for comparison metrics.
- priority: medium
  item: Live camera
  recommended_default: Recorded MEVDT and later EventVOT development; DAVIS346 AER live hardware if accessible.
- priority: medium
  item: Tracker placement
  recommended_default: Zynq PS first, programmable logic after the SCNN datapath is stable.
source_notes:
