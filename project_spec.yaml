  - id: ji2023_sctn
    title: 'SCTN: Event-based object tracking with energy-efficient deep convolutional neural networks'
    authors:
    - M. Ji et al.
    year: 2023
    venue: Frontiers in Neuroscience
    role: Convolutional SNN tracking reference
    project_takeaway: Supports supervised discriminative training rather than exclusive reliance on STDP
    url: https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2023.1123698/full
  - id: wang2024_spikemot
    title: 'SpikeMOT: Event-Based Multi-Object Tracking With Sparse Motion Features'
    authors:
    - Song Wang
    - Zhu Wang
    - Can Li
    - Xiaojuan Qi
    - Hayden Kwok-Hay So
    year: 2024
    venue: IEEE TPAMI
    role: Reference for sparse motion features and eventual multi-object extension
    project_takeaway: Begin with single-object tracking, then add detection refresh and identity association
    url: https://arxiv.org/abs/2309.16987
  - id: shan2026_sdtrack
    title: 'SDTrack: A Baseline for Event-based Tracking via Spiking Neural Networks'
    authors:
    - Yimeng Shan et al.
    year: 2026
    venue: CVPR
    role: Contemporary fully spike-driven tracking reference
    project_takeaway: Compare accuracy while emphasizing the simpler hardware-oriented convolutional design
    url: https://openaccess.thecvf.com/content/CVPR2026/html/Shan_SDTrack_A_Baseline_for_Event-based_Tracking_via_Spiking_Neural_Networks_CVPR_2026_paper.html
  identified_gap: The literature separately provides event sensors, SNN proposals, motion-selective STDP networks,
    trainable SNN frameworks, modern trackers, and FPGA SNN generators. The intended contribution integrates these
    into a reproducible train-to-hardware path for sparse shared-kernel FPGA convolution with custom competition and
    homeostasis, event-supported pixel attention, classification, and tracking.
scope:
  version_1_in_scope:
  - Event-only DAVIS input
  - Canonical 240x180 model resolution
  - Two polarity channels
  - Fixed-duration discrete timesteps
  - Three trainable spiking convolution layers
  - Hardware-compatible LIF neurons
  - f_inst-inspired cross-filter competition
  - f_long/T_thresh-inspired adaptive-threshold homeostasis
  - Single-object acquisition, multiclass classification, and tracking from attended pixels
  - Spiking event-supported pixel-attention map with optional derived spatial proposals
  - SpikingJelly training and quantization-aware fine-tuning
  - Bit-accurate Python reference
  - Project-specific VHDL-2008 FPGA backend with optional selective reuse of compatible framework components
  - ZCU104 FPGA inference
  - MEVDT primary training, validation, tracking evaluation, and native-resolution FPGA replay
  version_1_out_of_scope:
  - Exact continuous-time decay from every DAVIS timestamp
  - Clockless asynchronous FPGA logic
  - APS frame fusion
  - Transformer attention
  - Full multi-object re-identification
  - On-chip backpropagation
  - Automatic conversion of arbitrary SpikingJelly modules
  - Mandatory dependency on an external FPGA or neuromorphic hardware generator
  - A general replacement for PyTorch or SpikingJelly
  future_scope:
  - DAVIS346 AER live input
  - Dynamic ROI remapping and full-frame reacquisition
  - Multi-object tracking
  - Online local learning
  - NIR export for standard supported layers
  - Comparison with prior FPGA SNN accelerators and dedicated neuromorphic systems such as Speck, Loihi, or SpiNNaker
sensor_and_input:
  canonical_model_input:
    event_resolution_wh:
    - 240
    - 180
    tensor_shape_chw:
    - 2
    - 180
    - 240
    polarity_channels:
      0: OFF_negative_contrast
      1: ON_positive_contrast
    selection_reasons:
    - Matches the native resolution of MEVDT and the DAVIS240C hardware-validation path.
    - Matches the resolution used by the 2019 SNN region-proposal paper.
    - Provides a manageable logical-neuron and FPGA state-memory footprint.
    - Preserves useful spatial detail for moving-object proposals, classification, and tracking.
  supported_event_sources:
  - source: MEVDT DAVIS240C events
    native_resolution_wh:
    - 240
    - 180
    input_mapping: none
    role: native-resolution FPGA and traffic validation
  - source: live DAVIS346 AER camera
    native_resolution_wh:
    - 346
    - 260
    input_mapping: coordinate remap to 240x180 in software or input-interface hardware
    role: future live demonstration
  raw_event_fields:
  - timestamp
  - x
  - y
  - polarity
  aps_frames_used: false
  optional_input_filters:
  - name: per_pixel_refractory_filter
    purpose: Suppress rapid repeated noise events
    initial_value_us: 100
    enabled_in_first_fpga: false
  - name: background_activity_filter
    purpose: Reject isolated events without nearby spatiotemporal support
    enabled_in_first_fpga: false
    reason: First establish the raw event-network baseline.
temporal_representation:
  name: polarity_event_count_tensor
  single_step_layout: NCHW
  multi_step_layout: TNCHW
  baseline_bin_duration_us: 1000
  candidate_bin_duration_us:
  - 500
  - 1000
  - 2000
  - 5000
  baseline_training_window_steps: 50
  baseline_context_duration_ms: 50
  rolling_inference: true
  binning_rule: Each DAVIS event contributes one count at its polarity, y, x coordinate in the current timestep. Multiple
    events at the same coordinate produce an integer count.
  hardware_equivalence: The FPGA does not materialize or convolve the count tensor. Processing every event address
    as one kernel-weight addition implements the same count accumulation.
  end_of_timestep_barrier:
    required: true
    ordered_actions:
    - Accumulate every event assigned to timestep t
    - Apply neuron state update and leak
    - Compare thresholds
    - Apply f_inst competition
    - Emit spikes and reset
    - Update f_long/T_thresh homeostasis
    - Pass output spike addresses to the next layer for timestep t
    - Advance to timestep t+1 only after every layer completes
model:
  framework: SpikingJelly_activation_based
  training_step_mode: m
  inference_reference_step_mode: s
  architecture_name: ThreeLayerCompetitiveAdaptiveEventSCNN
  aggregate:
    logical_spiking_neurons: 226802
    membrane_state_kib_at_16_bits: 442.973
    trainable_weight_count: 6296
    weight_storage_kib_at_8_bits: 6.148
    interpretation: The backbone is state-memory dominated rather than weight-memory dominated
  layers:
  - name: conv1_proposal_features
    type: event_conv_lif
    input_shape_chw:
    - 2
    - 180
    - 240
    output_shape_chw:
    - 8
    - 90
    - 120
    convolution:
      in_channels: 2
      out_channels: 8
      kernel_size:
      - 5
      - 5
      stride:
      - 2
      - 2
      padding:
      - 2
      - 2
      bias: false
      weight_sharing: true
      weight_bits: 8
      weight_count: 400
      maximum_output_locations_per_input_event_per_output_channel: 9
      maximum_weight_additions_per_input_event: 72
    neuron:
      model: hardware_compatible_lif
      equation: V[t] = beta * V[t-1] + I[t]
      beta_parameterization: beta = 1 - 2^(-beta_shift)
      beta_shift_initial: 4
      beta_initial: 0.9375
      threshold_training_initial: 0.25
      threshold_integer_initial: 64
      reset: subtractive
      membrane_bits: 16
      accumulator_bits: 24
    state_memory:
      logical_neurons: 86400
      membrane_kib_at_16_bits: 168.75
  - name: conv2_motion_features
    type: event_conv_lif
    input_shape_chw:
    - 8
    - 90
    - 120
    output_shape_chw:
    - 16
    - 45
    - 60
    convolution:
      in_channels: 8
      out_channels: 16
      kernel_size:
      - 3
      - 3
      stride:
      - 2
      - 2
      padding:
      - 1
      - 1
      bias: false
      weight_sharing: true
      weight_bits: 8
      weight_count: 1152
      maximum_output_locations_per_input_event_per_output_channel: 4
      maximum_weight_additions_per_input_event: 64
    neuron:
      model: hardware_compatible_lif
      equation: V[t] = beta * V[t-1] + I[t]
      beta_shift_initial: 4
      threshold_integer_initial: 64
      reset: subtractive
      membrane_bits: 16
      accumulator_bits: 24
    state_memory:
      logical_neurons: 43200
      membrane_kib_at_16_bits: 84.375
  - name: conv3_semantic_tracking_features
    type: event_conv_lif
    input_shape_chw:
    - 16
    - 45
    - 60
    output_shape_chw:
    - 32
    - 45
    - 60
    convolution:
      in_channels: 16
      out_channels: 32
      kernel_size:
      - 3
      - 3
      stride:
      - 1
      - 1
      padding:
      - 1
      - 1
      bias: false
      weight_sharing: true
      weight_bits: 8
      weight_count: 4608
      maximum_output_locations_per_input_event_per_output_channel: 9
      maximum_weight_additions_per_input_event: 288
    neuron:
      model: hardware_compatible_lif
      equation: V[t] = beta * V[t-1] + I[t]
      beta_shift_initial: 4
      threshold_integer_initial: 64
      reset: subtractive
      membrane_bits: 16
      accumulator_bits: 24
    state_memory:
      logical_neurons: 86400
      membrane_kib_at_16_bits: 168.75
  pixel_attention_head:
    feature_source: conv1_proposal_features
    selected_method: bias_free_3x3_spiking_pixel_attention
    output_shape_chw: [1, 90, 120]
    activity_window_steps_initial: 50
    supervision: Event-active pixels inside annotated boxes, reduced by OR pooling and locally dilated
    processing:
    - Accumulate attention spikes over the decision window
    - Use the predicted map directly for classification pooling and centroid moments
    - Optionally threshold and cluster the map to derive comparison boxes for legacy metrics
    rationale: Preserve event-supported spatial evidence without making a bounding-box ROI part of inference
    state_memory:
      logical_neurons: 10800
      membrane_kib_at_16_bits: 21.094
      preferred_physical_memory_candidate: distributed_LUTRAM_due_to_small_shallow_high_access_map
  classification_head:
    feature_source: conv3_semantic_tracking_features
    reduction: Per-timestep predicted-attention gating of feature spikes after max/OR resolution matching, followed by
      integer spike-count accumulation per channel
    classifier: bias-free class synapses followed by independent hardware-compatible LIF output neurons
    synaptic_current_scale:
      operation: arithmetic right shift by 5 after class-synapse accumulation
      divisor: 32
      reason: Keep per-timestep class currents near the LIF threshold and prevent both outputs saturating at the temporal spike ceiling.
    class_count: dataset_dependent
    decoding: emitted class-spike count argmax; silence ties resolve deterministically to background class zero
    analog_readout_allowed: false
    output_dynamics:
      f_inst_enabled: false
      f_long_enabled: false
      reason: Classes integrate independently; competition is applied only by the final deterministic spike-count argmax.
  tracking_head:
    initial_task: single_object_tracking
    state:
    - x
    - y
    - spread_x
    - spread_y
    - vx
    - vy
    - confidence
    - class_id
    measurement: weighted centroid and spread of predicted attention plus class confidence
    evaluation_box_decoder:
      width: clamp(4 * spread_x, 2, 240)
      height: clamp(4 * spread_y, 2, 180)
      selection_evidence: Retained pending a decoder scale that improves HOTA across all repaired seeds
    motion_model: fixed_point_alpha_beta_filter
    association: centroid distance plus class consistency
    roi_policy:
      enabled_after_acquisition: false
      reason: Inference remains box-free; attention pixels are the selector.
    implementation_order: Validate on Zynq PS first; move to PL after SCNN stability
custom_spiking_dynamics:
  lif:
    equation: V[t] = beta * V[t-1] + I[t]
    beta_constraint: beta = 1 - 2^(-q)
    initial_q: 4
    leak_hardware: V - arithmetic_shift_right(V, q)
    threshold: theta_base + theta_adapt
    reset: subtractive
    bias: false
    no_bias_reason: A bias forces updates without spikes and weakens sparse execution
  f_inst:
    concept: Immediate competition among channels at one spatial coordinate
    article_lineage: Instantaneous inhibition in the 2021 trajectory-prediction paper
    selected_training_rule:
    - Compute candidate membrane and spikes for all channels at a coordinate
    - Select the channel with the highest membrane above threshold
    - Allow only the winner to emit
    - Optionally decrement losing membranes by f_inst times theta_base
    hardware_rule: top_1_gate_with_configurable_competitor_decrement
    initial_strength_relative_to_threshold: 0.25
    ablation_values:
    - 0.0
    - 0.125
    - 0.25
    - 0.5
    expected_effects:
    - More diverse feature maps
    - Lower hidden spike rate
    - Fewer duplicate proposals
    - Possible precision gain with potential recall loss
  f_long_and_T_thresh:
    concept: Slow homeostatic threshold adaptation for overactive filters
    article_lineage: Long-term threshold modulation in the 2021 trajectory-prediction paper
    selected_hardware_efficient_rule:
      scope: per_output_feature_map
      state: A[channel]
      statistic: one activity event when any neuron in the channel spikes during the timestep
      threshold: theta_effective[channel] = theta_base + A[channel]
      update: A = max(0, A - decay) + f_long * channel_any_spike
      T_thresh_interpretation: Controls return time toward zero
      first_decay_implementation: linear_countdown_or_triangular
      initial_duration_steps: 32
      initial_increment_relative_to_threshold: 0.0625
      initial_decay_relative_to_threshold: 0.03125
    paper_fidelity_ablation:
      scope: per_neuron
      shape: inverted-V threshold modulation
      purpose: Determine whether accuracy benefit justifies threshold-state memory
training:
  primary_method: supervised_surrogate_gradient
  rationale: Tracking, pixel attention, localization, and classification need task-level losses
  optional_conv1_pretraining:
    method: STDP
    framework: SpikingJelly STDPLearner
    purposes:
    - Learn edge and motion filters
    - Compare local learning with end-to-end training
    - Test whether STDP improves sparsity or label efficiency
  sequence:
  - Prepare raw events and sequence-level annotations
  - Create fixed-duration polarity event-count tensors
  - Run the MEVDT vehicle/background baseline with a frozen sequence-disjoint validation partition
  - Train a floating-point baseline without f_inst/f_long
  - Add f_inst and measure accuracy, proposal precision/recall, feature diversity, and sparsity
  - Add f_long/T_thresh and measure utilization and robustness
  - Train pixel-attention, predicted-attention classification, and centroid temporal losses
  - Apply quantization-aware training
  - Export integer weights and neuron parameters
  - Validate the bit-accurate event-scatter model
  - Generate and verify RTL
  experiment_protocol:
    current_dataset: MEVDT
    partition: deterministic scene-stratified complete-sequence validation split from the official train split
    validation_fraction: 0.2
    partition_seed: 20260804
    model_seeds: [17, 101, 2026]
    evaluation_order: chronological_complete_sequences
    selection_split: validation_only
    final_reporting_split: official_test_after_configuration_selection
    required_metrics:
    - tracking_success_AUC
    - center_precision_at_20_pixels
    - HOTA
    - MOTA
    - IDF1
    - classification_F1
    - pixel_attention_IoU
    capacity_ablation_gate: Run only after the three-seed baseline and diagnose the deficient metric.
    targeted_capacity_order:
    - Fuse Conv1 spatial spikes with Conv2/Conv3 semantic spikes in the attention head.
    - Add a small depthwise-separable spiking refinement block.
    - Add temporal attention supervision across adjacent labeled samples.
    - Add a fourth downsampled Conv-LIF layer only if semantic classification remains deficient.
  losses:
    pixel_attention:
      type: positive_weighted_rate_error_plus_dice_on_event_supported_pixels
      initial_weight: 1.0
      current_positive_pixel_multiplier: 32.0
      target_dilation_pixels_at_half_resolution: 1
      temporal_reduction: clamp_sum_to_window_spike_presence
    attention_centroid:
      type: normalized_squared_centroid_error_to_annotated_target_center
      initial_weight: 0.25
    classification:
      type: cross_entropy_on_spike_counts_or_membrane_logits
      initial_weight: 1.0
    temporal_consistency:
      type: smooth_L1_on_attention_centroid_displacement_and_velocity
      initial_weight: 0.25
    spike_rate_regularization:
      type: layerwise_excess_mean_spike_rate_above_0.05
      initial_weight: 0.001
    filter_balance_regularization:
      type: channel_utilization_variance_or_KL_penalty
      initial_weight: 0.001
  surrogate_gradient:
    initial: ATan_or_fast_sigmoid
    inference_hardware_effect: none
  optimizer:
    initial: AdamW
    learning_rate: 0.001
    weight_decay: 0.0001
    scheduler: cosine_or_reduce_on_plateau
  state_reset:
    between_independent_sequences: true
    within_continuous_tracking_sequence: false
quantization:
  objective: Match an addition/shift/comparison-based FPGA datapath
  initial_formats:
    weights: signed_int8
    membrane: signed_int16
    current_accumulator: signed_int24
    base_threshold: int16
    adaptive_threshold: uint16
    spike: 1_bit
    coordinate_x: uint8_or_uint9
    coordinate_y: uint8
    timestep: uint16_or_uint32
  rules:
  - No convolution bias
  - Use power-of-two-compatible decay
  - Fold BatchNorm into weights and thresholds or omit it
  - Use saturating arithmetic
  - Freeze rounding, clipping, and overflow behavior
  experiments:
    weight_bits:
    - 4
    - 6
    - 8
    membrane_bits:
    - 12
    - 16
    - 20
    accumulator_guard_bits: sweep
    process:
    - Post-training quantization baseline
    - Quantization-aware fine-tuning
    - Bit-exact export and replay
spikingjelly_contract:
  allowed_initial_operations:
  - Conv2d
  - Custom hardware-compatible LIF
  - Custom f_inst module
  - Custom f_long/T_thresh module
  - Sum or average spike-count pooling
  - 1x1 convolution
  - 3x3 bias-free convolution for local pixel attention
  - Integer-ratio max/OR pooling for attention resolution matching
  - Attention-weighted sum and centroid moments
  - Bias-free class synapses and hardware-compatible LIF output neurons
  deferred_operations:
  - Standalone inference BatchNorm
  - General feature max pooling
  - Transformer or dot-product attention
  - Dilated convolution
  - Transposed convolution
  - Unconstrained floating-point adaptive dynamics
  - Arbitrary per-neuron trainable tau
  export_artifacts:
  - model_spec.yaml
  - quantized_weights.npz
  - quantized_parameters.json
  - golden_input_event_bins.npz
  - golden_layer_spikes.npz
  - golden_outputs.json
  equivalence_requirement: Bit-accurate Python, RTL simulation, and FPGA output must match exported golden tests
custom_fpga_backend_strategy:
  decision: Build a project-specific VHDL-2008 convolutional SNN backend and selectively reuse compatible framework components
  design_principles:
  - Binary presynaptic spikes select whether a stored weight is added; the convolutional backbone avoids activation-by-weight
    multipliers.
  - Store shared kernels once rather than expanding convolution into a fully connected matrix.
  - Store large deep logical-neuron state arrays in BRAM/URAM, place suitable small high-access structures in distributed
    LUTRAM, retain tiny state in registers, and time-multiplex a configurable number of processing elements.
  - Use power-of-two-compatible membrane decay so leakage is implemented with additions and shifts.
  - Preserve exact discrete-timestep ordering between SpikingJelly, the fixed-point reference, RTL simulation, and
    FPGA execution.
  - Keep event routing, neuron dynamics, inhibition, pixel attention, classification, and tracking as separable
    verified modules.
  memory_mapping_policy:
    status: documented_for_future_implementation_not_yet_synthesized
    objective: Balance BRAM capacity against LUT availability, memory-port demand, routing, and timing.
    bram_default_candidates:
    - Conv1 membrane state
    - Conv2 membrane state
    - Conv3 membrane state
    - Any deep full-layer current or spike buffer that cannot be safely tiled
    lutram_default_candidates:
    - Pixel-attention membrane state
    - Quantized shared-kernel and class-synapse weights when port structure is suitable
    - Short event FIFOs and touched-address queues
    - Small tiled current accumulators
    - Address, threshold, and control lookup tables
    register_default_candidates:
    - Class-neuron membrane state
    - Per-channel f_long/T_thresh state
    - Counters, pipeline state, and small arbitration state
    selection_rules:
    - Prefer LUTRAM for shallow or small memories needing low-latency frequent access.
    - Prefer BRAM for deep arrays where LUT cost and routing would dominate.
    - Account for read/write ports, banking, replication, packing loss, and timing rather than comparing raw bits alone.
    - Permit a synthesis result to override a default candidate when the measured tradeoff is documented.
    - Preserve the exported address layout, widths, saturation, update ordering, and bit-exact golden outputs.
    required_reports:
    - Per-memory logical dimensions and inferred primitive
    - BRAM36 and BRAM18 usage
    - LUTRAM bits and LUT count
    - Replication or banking required for ports
    - Packing efficiency and unused capacity
    - Post-synthesis timing and post-route fit
  framework_reuse_policy:
    candidate_framework: Spiker+
    advantages_observed:
    - Fixed-point LIF implementation
    - Configurable threshold and reset behavior
    - Power-of-two leakage approximations
    - Resource-aware FPGA SNN design
    - Automated HDL-generation and verification methodology
    potential_use: Reuse or adapt compatible VHDL neuron, arithmetic, generation, or verification components when doing
      so preserves shared-kernel event-addressed convolution and the frozen software/integer/VHDL operation order.
    rejection_conditions:
    - Convolution is flattened into fully connected matrices
    - Exact f_inst or f_long/T_thresh behavior cannot be represented
    - Attention, classification, tracking, or event-routing interfaces cannot be integrated cleanly
    - Bit-exact equivalence cannot be demonstrated
    - Adaptation costs more than a focused project-specific VHDL implementation
    decision_process: Record evaluated version, components, compatibility evidence, integration cost, and adopt/reject
      outcome in docs/DECISIONS.md before making it a project dependency.
    current_evaluation:
      reviewed_date: '2026-08-03'
      evidence:
      - Official Spiker+ repository documents Python-driven VHDL accelerator generation, quantization, and neuron libraries.
      - The Spiker+ paper states that the current architecture targets fully connected and recurrent fully connected networks.
      - EventSCNN requires sparse shared-kernel convolution, event-to-output address generation, f_inst, f_long/T_thresh,
        pixel attention, attention-weighted classification, and centroid-tracking interfaces.
      outcome: Do not add Spiker+ as a required dependency for the current convolutional backend because adapting its
        fully connected architecture would not reduce total implementation risk. Re-evaluate isolated VHDL neuron,
        arithmetic, quantization, or test-generation components before duplicating equivalent future work.
      version_policy: No version is pinned while the framework is not a dependency; pin an exact release or commit before reuse.
  components_to_implement:
  - hardware-neutral model schema and exporter from SpikingJelly
  - bit-accurate fixed-point event-scatter reference model
  - DAVIS/event-bin input interface
  - spike-address FIFO
  - shared-kernel ROM
  - input-spike-to-output-address generator
  - membrane/current state RAM
  - synthesis-guided BRAM/LUTRAM/register memory mapper and per-memory placement manifest
  - active-neuron list or touched-address queue
  - layer timestep controller
  - hardware-compatible LIF processing element
  - f_inst competition unit
  - feature-map homeostasis and adaptive-threshold unit
  - pixel-attention accumulation, OR pooling, and centroid-moment units
  - optional attention-map clustering for comparison metrics
  - classification head
  - tracking-state interface
  - golden-vector and cocotb verification environment
  implementation_languages:
    training_and_export: Python with PyTorch and SpikingJelly
    bit_accurate_reference: Python initially; optional C++ acceleration later
    hardware: VHDL-2008 only
    verification: cocotb plus GHDL for portable simulation, followed by vendor simulation
  repository_structure:
    training:
    - models/
    - custom_neurons/
    - losses/
    - datasets/
    - quantization/
    intermediate_representation:
    - ir/model_schema.py
    - ir/export_from_spikingjelly.py
    - ir/validate_model.py
    reference:
    - reference/float_model.py
    - reference/fixed_point_model.py
    - reference/event_scatter_conv.py
    hardware:
    - rtl/event_input/
    - rtl/event_conv/
    - rtl/neuron/
    - rtl/inhibition/
    - rtl/homeostasis/
    - rtl/proposal/
    - rtl/tracking/
    - rtl/top/
    verification:
    - verification/cocotb/
    - verification/golden_vectors/
    - verification/assertions/
fpga_execution:
  algorithmic_model: discrete_time_spiking_network
  physical_model: clocked_sparse_event_address_processing
  synaptic_operation:
    equation: I_j[t] += W_ji for every active presynaptic spike i
    multiplication: not_required_for_binary_hidden_spikes
    first_layer_counts: Repeated sensor events cause repeated weight additions
  per_timestep_pipeline:
  - Buffer DAVIS events for timestep t
  - Generate affected Conv1 addresses and read shared weights
  - Accumulate Conv1 currents
  - 'At the Conv1 barrier, process active neurons: leak, current, threshold, f_inst, spike, reset, f_long'
  - Route Conv1 spike addresses through Conv2
  - Route Conv2 spike addresses through Conv3
  - Update pixel attention, attention-weighted classification, and centroid tracking
  - Advance to timestep t+1
  active_state_management:
    selected: active_neuron_list
    alternatives:
    - name: full_neuron_sweep
      benefit: Simple exact semantics
      cost: High memory bandwidth
    - name: active_neuron_list
      benefit: Updates only neurons with nonzero state or input
      cost: Queue and duplicate-management logic
    - name: lazy_decay_with_last_update_step
      benefit: Maximum sparsity
      cost: More complex beta^delta approximation
  parallelism:
    processing_elements:
    - 1
    - 4
    - 8
    - 16
    strategies:
    - Parallel output channels
    - Parallel kernel offsets
    - Bank state RAM to avoid write conflicts
    double_buffering: Use ping-pong event FIFOs
  throughput:
    additions_per_input_spike: ceil(Kh/Sh) * ceil(Kw/Sw) * Cout
    deadline: processing_cycles_per_timestep <= bin_duration * FPGA_clock_frequency, otherwise FIFO buffering is required
    reporting: Report average, 99th percentile, and worst-observed event loads
fpga_target:
  board: Xilinx_ZCU104
  initial_clock_target_mhz: 100
  reasons:
  - Matches prior user experience
  - Provides substantial BRAM/URAM
  - Allows ARM-side control, replay, logging, and early software tracking
  interfaces:
    offline_first: DDR_or_host_stream_of_timestamped_events
    live_later: USB_or_AER_bridge_to_AXI_Stream
    control: AXI_Lite
    outputs: AXI_Stream_or_memory_mapped_proposals_classes_tracks
  resource_priorities:
  - BRAM/URAM capacity and banking
  - Balanced use of distributed LUTRAM for appropriate small high-bandwidth memories
  - LUTRAM port replication and routing cost
  - Memory port conflicts
  - LUT adders and comparators
  - FIFO capacity
  - Minimal or zero DSP use in the spiking backbone
  - Clock enable during inactive periods
datasets:
  selection_rationale: MEVDT is the sole primary executable dataset because it supports training, sequence-level
    validation, tracking metrics, and exact-resolution DAVIS240C FPGA replay. EventVOT is a deferred future extension.
  primary_training_and_hardware_validation:
    name: MEVDT
    role: Native-resolution FPGA replay, traffic proposals, vehicle tracking, throughput, FIFO, latency, and power
      evaluation
    sensor: DAVIS240C
    native_resolution_wh:
    - 240
    - 180
    model_resolution_wh:
    - 240
    - 180
    sequence_count: 63
    approximate_event_count: 5000000
    approximate_box_annotation_count: 10000
    unique_vehicle_trajectory_count: 85
    annotations:
    - bounding boxes
    - track IDs
    - COCO format
    - MOTChallenge format
    - higher-rate interpolated tracking annotations
    tasks:
    - vehicle pixel attention and optional derived proposals
    - single-vehicle attention-centroid tracking evaluation
    - native-resolution FPGA replay
    - event-rate burst characterization
    - latency, FIFO occupancy, throughput, and power measurement
    classification_scope: vehicle versus background or a single general vehicle class
    current_software_baseline_role: Primary real-data training, complete-sequence validation, and final held-out evaluation
    sequence_event_format:
      file: sequences/{split}/{scene}/{sequence}/{sequence}_events.csv
      columns: [ts, x, y, p]
      timestamp_unit: nanoseconds
      conversion: Filter exact nanosecond window, then convert to relative integer microseconds
    detection_label_format: class_id x_min y_min x_max y_max in absolute 240x180 coordinates
    authoritative_split_index: data_splits/MEVDT_org_rate_{train,test}.csv
    limitations:
    - Supports vehicle-versus-background classification rather than general multiclass recognition
    - Static roadside camera and limited scene diversity
    - Some visible non-vehicle objects may be unlabeled
    source_urls:
    - https://arxiv.org/abs/2407.20446
    - https://sar-lab.net/?page_id=858
    validation_protocol:
      source_split: official train
      unit: complete sequence
      stratification: scene
      fraction: 0.2
      partition_seed: 20260804
      frozen_in_checkpoint: true
      chronological_evaluation: true
      official_test_policy: final evaluation only after validation-based model selection
  future_general_object_dataset:
    name: EventVOT
    role: Later event-only general-object single-object tracking and target-conditioned classification development
    status: deferred_not_downloaded
    native_resolution_wh: [1280, 720]
    model_resolution_wh: [240, 180]
    coordinate_remap:
      method: aspect_preserving_resize_then_vertical_pad
      resized_resolution_wh: [240, 135]
      vertical_padding_pixels: [22, 23]
    published_sequence_count: 1141
    modality: raw event streams with single-object tracking annotations
    required_model_extension: target-conditioned template or first-frame target encoding
    limitations:
    - A category-agnostic tracker still needs explicit target conditioning when several objects are active.
    - Resolution conversion and raw-event parsing require fixture validation before full download use.
    - Do not infer EventVOT performance from MEVDT vehicle results.
    source_url: https://eventvot.github.io/
  development_sanity_dataset:
    name: synthetic moving shapes or ball events
    role: Debug routing, neuron equations, proposal behavior, fixed-point equivalence, and RTL before full dataset
      training
    tasks:
    - known-direction motion
    - known-speed motion
    - controlled event density
    - border and overlap cases
  future_multi_object_benchmark:
    name: DSEC-MOT
    role: Future extension after the first single-object and native-resolution FPGA pipeline is stable
    native_resolution_wh:
    - 640
    - 480
    tasks:
    - multi-object tracking
    - occlusion
    - identity association
    - traffic-scene generalization
    reason_deferred: Its resolution and multi-object association complexity would make it difficult to isolate errors
      in the first SNN and FPGA implementation.
    source_url: https://neuromorphicsystems.github.io/land/dsec-mot
  custom_live_recordings:
    role: Final live demonstrator and real sensor-noise/event-burst characterization
    preferred_sensor: DAVIS346 AER if available, otherwise another accessible DAVIS camera
    required_annotations:
    - manual or semi-automatic target boxes
    - target class
    - sequence-level lighting and motion notes
  split_policy:
  - Split by complete recording sequence, not random temporal windows.
  - Prevent adjacent windows from one trajectory from appearing in both training and testing.
  - Use an explicit validation split for architecture and threshold selection.
  - Report target class, target size, speed, lighting, event rate, camera motion, and occlusion distributions.
  - Keep all FPGA power and throughput recordings separate from training data.
