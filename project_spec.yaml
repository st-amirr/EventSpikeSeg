    project_takeaway: Use a constrained hardware-compatible subset and custom neuron/competition modules
    url: https://github.com/fangwei123456/spikingjelly
  - id: carpegna2024_spiker_plus
    title: 'Spiker+: a framework for the generation of efficient Spiking Neural Networks FPGA accelerators for inference
      at the edge'
    authors:
