name: eventspikeseg-implementation

x-cpu-verification: &cpu-verification
  build:
    context: .
    dockerfile: docker/app/dockerfile_ASIC
  image: eventspikeseg:torch2.2.2-cpu-verification
  platform: linux/amd64
  working_dir: /workspace
  environment:
    PYTHONPATH: /workspace/src
    PYTEST_ADDOPTS: -p no:cacheprovider
    RUFF_CACHE_DIR: /tmp/ruff-cache
    PYTHONUNBUFFERED: "1"
  volumes:
    - type: bind
      source: .
      target: /workspace
      read_only: true
    - type: bind
      source: ./artifacts
      target: /workspace/artifacts

services:
  test:
    <<: *cpu-verification
    command: ["python", "-m", "pytest", "-q"]

  lint:
    <<: *cpu-verification
    command: ["python", "-m", "ruff", "check", "src", "tests", "scripts", "verification"]

  rtl:
    <<: *cpu-verification
    command: ["python", "scripts/run_rtl_tests.py"]

  synthesis:
    <<: *cpu-verification
    command: ["bash", "asic/scripts/check_synthesis.sh"]

  ppa:
    image: openroad/orfs@sha256:d995618be9f2bcdfa5538b885123463070dfbf178bea1818716d4652fe0fa380
    platform: linux/amd64
    working_dir: /OpenROAD-flow-scripts/flow
    environment:
      ORFS_ROOT: /OpenROAD-flow-scripts
      ASIC_ORFS_WORK_HOME: /workspace/artifacts/orfs_work
      ASIC_ORFS_DESIGN_CONFIG: /workspace/asic/orfs_asap7_checkpoint_config.mk
      ASIC_ORFS_WEIGHT_DIR: /workspace/artifacts/asic_rtl_replay_smoke_v4_6class/weights
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ./artifacts
        target: /workspace/artifacts
    command: ["bash", "/workspace/asic/scripts/run_orfs.sh"]
