[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventscnn-fpga"
version = "0.1.0"
description = "Hardware-oriented event-camera spiking CNN reference implementation"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "numpy>=1.24,<2.0",
  "PyYAML>=6.0,<7",
  "scipy>=1.10,<1.14",
  "torch>=2.0,<2.3",
  "spikingjelly==0.0.0.0.14",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "ruff>=0.5,<0.10",
]
rtl = [
  "cocotb>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
