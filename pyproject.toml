[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventspikeseg"
version = "0.2.0"
description = "Lightweight event-camera spiking semantic segmentation for FPGA research"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "numpy>=1.24,<2.0",
  "torch>=2.0,<2.3",
  "spikingjelly==0.0.0.0.14",
  "Pillow>=10,<12",
  "h5py>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.5,<0.10"]
rtl = ["cocotb>=1.8,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
