document:
  title: Digital Neuromorphic ASIC Event-Camera Spiking Neural Network for Semantic Segmentation
  short_name: EventSpikeSeg-ASIC
  version: 2.1.0
  status: native_SystemVerilog_ASIC_static_DAG_actor_integration
  created_date: '2026-08-06'
  supersedes:
  - EventSCNN-FPGA region-proposal, classification, and tracking specification v0.2
  - minimal semantic-segmentation project_spec.yaml created during repository cleanup
  intended_uses:
  - Executable software and custom digital-neuromorphic ASIC implementation specification
  - Source of truth for architecture search and experiment tracking
  - Interface contract between SpikingJelly/PyTorch training and custom SystemVerilog ASIC deployment
  - Foundation for an article on lightweight event-based SNN semantic segmentation with sparse digital ASIC
    inference
  central_interpretation: >-
    One dataset item is one 50 ms Ev-SegNet interval, never a stack of adjacent files.
    Histogram channels carry polarity activity; per-polarity normalized timestamp mean
    and standard deviation schedule weighted synaptic arrivals at the model input. The
    PLIF network executes ten 5 ms hardware-clock updates inside that physical interval
    and retains neuron state into the next consecutive record. It resets at sequence or
    frame-index gaps. The manifest is authoritative for stream order. New checkpoints
    use ddd17-timestamp-v3 and fingerprint the manifest, split, representation, physical
    interval, and event-clock contract. DDD17 requires no HDF5 input. DSEC instead
    slices and rectifies exact raw events, then schedules each 50 ms semantic interval
    into the same ten fixed 5 ms updates used during training. Deployment preserves
    those semantic epochs but uses autonomous event actors: an upstream completion token
    causes each actor to commit every resident destination exactly once, emit spikes, and
    forward completion. It is not immediate thresholding after each signed contribution.
  preservation_policy:
    retained_from_previous_specification:
    - Hardware-compatible LIF equations and power-of-two leakage
    - Peer-membrane cross-channel inhibition
    - Triangular threshold adaptation
    - Sparse shared-kernel event-address accumulation
    - Fixed-point formats, saturation, and bit-accurate equivalence requirements
    - Native synthesizable SystemVerilog actor interfaces
    - SpikingJelly surrogate-gradient training strategy
    - Synthetic fixtures, golden vectors, and staged hardware verification
    - Synthesis-guided BRAM/LUTRAM/register memory mapping
    - Measured-only reporting policy
    - Spiker+ as related work and implementation inspiration, not a dependency
    replaced_by_current_project:
    - Region proposal head
    - Global vehicle/background classification head
    - Bounding-box spread decoder
    - Attention-centroid tracking
    - MEVDT as the active training dataset
    - FE108 and DSEC-MOT as active milestones
    historical_material_location: [legacy_tracking_context, legacy_fpga_history]

project_goal:
  primary_goal: >-
    Design, train, compare, quantize, and eventually deploy a lightweight fully spiking
    semantic-segmentation network for event-camera data, with an architecture chosen for
    sparse digital neuromorphic ASIC inference rather than GPU efficiency alone.
  primary_research_question: >-
    Which combination of lightweight convolution, multi-scale context, normalization,
    skip fusion, recurrent spiking dynamics, and auxiliary supervision provides the best
    DDD17/DSEC semantic-segmentation accuracy while retaining a clear mapping to fixed-point PLIF state and event-driven
    synaptic updates?
  hardware_research_question: >-
    Can the selected PLIF model be mapped to a custom ASIC in which every permanent actor owns its shared tap weights and
    direct-indexed membrane array, while autonomous spike/completion-token traffic preserves exact trained epochs and avoids
    inter-layer state fetches?
  secondary_questions:
  - How many internal SNN timesteps are necessary before mIoU saturates?
  - Does depthwise-pointwise convolution preserve accuracy while reducing parameters and synaptic additions?
  - Does multi-scale dilation justify its addressing and buffering cost?
  - Does a foldable per-channel affine gain provide most of BatchNorm's benefit without batch-statistic 
    dependence?
  - Does GAP/sigmoid channel gating improve accuracy enough to justify non-spiking global reduction and 
    multiplication?
  - Do adaptive thresholds improve firing balance and multi-seed stability?
  - Is one encoder skip sufficient, or are two additive skips required for boundaries and small classes?
  - What accuracy is lost after weight, membrane, threshold, and accumulator quantization?
  - Which operations dominate resident-state cells, synapse logic, event routing, clock load, and ASIC energy?
  - Which non-local operations require dedicated reduction/control logic or a hardware-aware replacement?
  working_hypotheses:
  - Depthwise-pointwise blocks greatly reduce parameters and weight memory but require pointwise channel 
    mixing.
  - Additive skips recover spatial detail with less memory and bandwidth than concatenation.
  - A shallow decoder is sufficient for sparse event statistics and is preferable to a symmetric U-Net.
  - Per-channel affine scaling will be more robust and hardware-friendly than inference-time BatchNorm.
  - Four to eight internal timesteps may preserve most accuracy while reducing temporal compute versus twenty 
    steps.
  - Adaptive feature-map thresholds can reduce dominant channels with very small state overhead.
  - Sparse hardware cost will correlate more strongly with measured spike rate than with dense FLOP counts.

framework:
  training_stack:
    language: Python
    tensor_library: PyTorch
    snn_framework: SpikingJelly_activation_based
    use_in_current_code:
    - SpikingJelly ATan surrogate gradient when installed
    - Custom HardwareLIF for exact leak, threshold, reset, peer inhibition, and threshold-adaptation behavior
    - SpikingJelly activation_based Conv2d as the active spike-driven synaptic kernel
    - PyTorch nearest-neighbor interpolation for non-learned decoder routing
    requirement: SpikingJelly is mandatory for model construction; there is no conventional Conv2d fallback.
  custom_framework_decision:
    decision: Do not build a custom autograd or training framework.
    reason: PyTorch and SpikingJelly already provide optimization, surrogate gradients, temporal execution, 
      and data loading.
  hardware_backend:
    primary_type: custom_SystemVerilog_digital_neuromorphic_ASIC
    primary_target: technology_agnostic_actor_array_with_register_or_latch_resident_PLIF_state
    primary_goal: >-
      Instantiate all 25 trained PLIF populations permanently as nodes in the fixed EventSpikeSeg140k v8 DAG, not as a
      linear 25-stage pipeline. A convolution actor uses parallel kernel-tap projection cells and one canonical
      current/membrane state per postsynaptic channel and spatial address. Weighted spike events accumulate locally.
      Completion tokens fork with every fanout path and rendezvous at residual/skip/concat joins before downstream commit;
      no layer is loaded or reconfigured at runtime.
    software_reference: SpikingJelly_float_plus_bit_exact_integer_reference
    implementation_flow: [integer_reference, SystemVerilog_RTL, Icarus_cocotb_simulation,
        Yosys_technology_mapping, OpenROAD_place_route_and_parasitics, activity_based_OpenSTA_power]
    open_PPA_platform:
      name: ASAP7
      purpose: reproducible_predictive_7nm_logic_PPA_and_scaling_research
      limitation: predictive_nonmanufacturable_and_not_tapeout_signoff
    manufacturable_tile_platform:
      name: SKY130RAM
      purpose: open_actor_tile_and_SRAM_macro_validation
      limitation: 130nm_is_not_dense_enough_for_economical_full_native_resolution_state
    full_model_tapeout_gate: accessible_22nm_or_better_foundry_PDK_plus_successful_full_resident_graph_place_route
  spiker_plus:
    implementation_status: literature_and_design_inspiration_only
    retained_takeaways:
    - Fixed-point LIF arithmetic
    - Power-of-two leakage
    - Parameterized synthesizable RTL generation concepts
    - Structured software/RTL verification
    - Resource-aware accelerator design
    prohibited_claim: The project must not claim to use, extend, or depend on Spiker+ unless that decision is 
      later implemented and documented.

active_dataset:
  name: DDD17_semantic_segmentation_Ev-SegNet_codification
  source_project: Ev-SegNet
  source_url: https://github.com/Shathe/Ev-SegNet
  task: six_class_semantic_segmentation
  root_inside_container: /datasets/DDD17
  expected_modality_first_layout:
    events:
      train: /datasets/DDD17/events/train
      test: /datasets/DDD17/events/test
    labels:
      train: /datasets/DDD17/labels/train
      test: /datasets/DDD17/labels/test
    ignored_visualization_data:
    - event_images
    - images
  accepted_alternate_layout:
  - /datasets/DDD17/train/events
  - /datasets/DDD17/train/labels
  - /datasets/DDD17/test/events
  - /datasets/DDD17/test/labels
  stored_sample:
    expected_shape: [6, H, W]
    batched_shape: [N, 6, H, W]
    dtype: floating_point_or_numeric_npy
    channels:
    - polarity_0_histogram
    - polarity_1_histogram
    - polarity_0_normalized_timestamp_mean
    - polarity_0_normalized_timestamp_standard_deviation
    - polarity_1_normalized_timestamp_mean
    - polarity_1_normalized_timestamp_standard_deviation
    warning: >-
      These channels are summary statistics of an event interval. They must not be
      reinterpreted as three chronological two-polarity timesteps.
  labels:
    ignore_index: 255
    class_count: 6
    class_mapping:
      0: flat
      1: construction_and_sky
      2: object
      3: nature
      4: human
      5: vehicle
  split_policy:
    provided_splits: [train, test]
    validation: sequence_disjoint_or_single_sequence_contiguous_holdout
    default_validation_fraction: 0.1
    seed_controls_split: true
    official_test_policy: Reserve the provided test records for final reporting after architecture selection.
    leakage_prevention: >-
      Hold out complete sequence_id groups when more than one exists. With one sequence,
      hold out one contiguous block. The resulting frame gap is a mandatory PLIF reset.
  discovery_requirements:
  - Do not recursively enumerate unrelated folders such as event_images.
  - Use bounded directory checks and os.scandir for large Windows bind mounts.
  - Pair event and label lists deterministically using the dataset's established sorted ordering.
  - Report event count, label count, selected folders, and mismatch errors explicitly.
  - Training must fail clearly when events/train exists without labels/train.
  current_input_limitation: >-
    The installed archive contains per-pixel histogram count plus timestamp mean and
    standard deviation, not every original event tuple. Exact individual arrival times
    cannot be recovered. The input scheduler therefore uses a deterministic three-arrival
    moment approximation at mean and mean plus/minus standard deviation while conserving
    each pixel/polarity histogram activity.

