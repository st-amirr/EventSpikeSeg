quantization:





  objective: Match the addition, multiplication, comparison, saturation, and address-generation ASIC datapath.





  active_formats:





    weights: signed_int24_Q7_16





    membrane: signed_int24_Q7_16





    current_accumulator: signed_int32_Q15_16





    beta: unsigned_int24_UQ1_23





