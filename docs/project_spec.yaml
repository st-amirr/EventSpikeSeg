    procedure:





    - Rectify and route each raw camera event in timestamp order as it arrives; do not materialize a dense input tensor or preload a complete 5 ms bin.





    - Each input event is losslessly multicast to the fixed ingress actors `detail_stem` and `stem`; each branch immediately triggers only its connected static-weight additions.





    - At each 5 ms boundary, inject a completion token after the final raw event assigned to that semantic epoch.





    - Each actor routes valid nonzero static-synapse contributions directly into the resident combined int32 Q15.16 accumulator/state element of each postsynaptic channel/spatial PLIF.





    - On the upstream completion token, clamp and threshold/reset every accumulator in parallel, apply retinotopic inhibition/adaptation atomically, then pre-apply one learned-beta step so that the same element is ready for the next fixed 5 ms bin.





    - Retain the pre-leaked combined accumulator and enabled compact adaptation state in the PLIF population and emit the resulting spike bitmap through fixed downstream synapses.





    - Accumulate signed final class current across prediction_window_bins and emit argmax when the window 





      completes; default is ten bins / 50 ms.





