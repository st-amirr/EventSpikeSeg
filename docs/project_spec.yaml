    accounting:
    - VDD energy includes standing bias during each stated window. It is not always total internal dissipation.
    - Positive terminal imports may include reactive charging; signed net terminal energy includes changes of stored
      energy.
    - Very small hold/off currents depend on model/gmin/numerical tolerances. MIM zero model leakage is not a silicon
      leakage guarantee.
    - Do not sum overlapping core/submodule/bank/whole-tile rows or multiply shared cores/readers by logical membrane
      count.
    - Independent ideal-source measurements isolate one physical module; unmeasured native-driven/current-master
      ports are identified in their detailed reports.
    - Fast nominal runs use KLU/reltol1e-4/vntol1e-7 and adaptive maximum step. Failed/timeout attempts are preserved
      and excluded.
