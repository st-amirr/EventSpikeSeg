    committed_markdown_snapshot: docs/documentation_history/article_markdown_HEAD_4fd2e5e93257_20261014T155300Z.zip
    pending_tracked_markdown_deletions: []
    useful_historical_topics:
    - topic: Technology selection
      article_use: Methods rationale
      finding: Historical ASAP7 model compatibility and unavailable physical verification decks explain the exploration
        of other PDKs. Earlier MOSCAP retention failures are prototype-specific; final layout uses GF180MCU.
      source: HEAD:docs/ARCHITECTURE.md, ASAP7 analog readiness and Model-to-circuit contract sections
      scope: Historical tool/model evidence; not a current foundry comparison or a final GF180 result.
    - topic: State inventory and area
      article_use: Architecture and discussion
      finding: Storage scales with spatial state count, not the 140k weight count. An older 7x7 micrometre plate
        extrapolation gave 1517.824 mm2 for 30,976,000 membrane plates alone; access circuitry, adaptation and routing
        are additional.
      source: HEAD:docs/ARCHITECTURE.md, Full-inventory architecture capacity evidence
      scope: Historical capacitor geometry extrapolation, not the final 5x5 MIM design or delivered GDS die area.
    - topic: Analog precision and noise
      article_use: Limitations or supplementary experiments
      finding: Selected-frame float software replays showed strong degradation with independent state noise; scaling
        and companding changed sensitivity. Training dtype or Q7.16 export does not establish analog precision.
      source: HEAD:docs/ARCHITECTURE.md, Linear state-noise tolerance screen; HEAD:docs/RESULTS.md
      scope: Software sensitivity experiments on selected records, not physical sampled-noise measurements or full
        validation mIoU.
    - topic: Shared circuitry and pulse injection
      article_use: Circuit-method rationale
      finding: Tracking parking, autozero and shared feedback/readout circuitry were explored to control source-switching
        charge and avoid per-neuron replication of expensive analog service circuitry. Local state-dependent variation
        must not be described as total weight accuracy.
      source: HEAD:docs/ARCHITECTURE.md, Tracking parking and Leading alternative sections
      scope: Historical circuit diagnostics; final module evidence and operating boundaries take precedence.
    - topic: SNN semantics
      article_use: Model-to-hardware mapping
      finding: Presynaptic events trigger signed contributions; weights control contribution magnitude, not source
        firing frequency. Accumulate within the model bin, apply learned beta once, and preserve subtractive reset,
        adaptation and inhibition ordering. Final class readout accumulates current rather than allocating class
        PLIF neurons.
      source: HEAD:docs/ARCHITECTURE.md, Model-to-circuit contract; current docs/AGENTS.md
      scope: Use original epoch58 float semantics. Early quantized ranges and provisional ASAP7 voltage scales are
        obsolete for the final implementation.

