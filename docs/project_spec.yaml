active_top_three_accuracy_search:
  status: implemented_pending_real_ddd17_measurement
  definitions: src/eventspikeseg/top_three_models.py::TOP_THREE_PRESETS
  output_directory: artifacts/ablation/top_three
  protocol:
    seed: 17
    epochs: 8
    train_samples: 2048
    held_out_samples: 512
    resolution_hw: [64, 64]
    internal_timesteps: 15
    batch_size: 14
    learning_rate: 0.002
  design_rules:
  - Preserve binary spike transmission between learned stages.
  - Keep 3x3 spatial kernels; obtain larger receptive fields with dilation instead of early 5x5 kernels.
  - Prefer depthwise spatial convolution and 1x1 pointwise/channel mixing for FPGA efficiency.
  - Do not average parallel multi-scale spike branches; concatenate them and let a following spiking 1x1 layer
    learn the mixture.
  - Use binary channel gates or low-resolution binary coincidence masks rather than dense softmax attention.
  - Preserve shallow spatial detail separately when testing deeper semantic paths.
  - Keep auxiliary semantic supervision and residual/skip paths.
  - Do not use hidden winner-peer competition.
  contenders:
    t01_spike_pyramid_concat:
      hypothesis: Multi-receptive-field sparse evidence is being destroyed by branch averaging and additive 
        skip fusion.
      encoder_channels: [24, 48, 96]
      context:
        bottleneck_channels: 48
        depthwise_dilations: [1, 2, 4]
        merge: channel_concatenation
        selection: binary_spike_count_channel_attention
        fusion: spiking_1x1
      decoder_merge: concatenation_then_depthwise_pointwise_spiking_fusion
      parameter_count: 63147
    t02_dualpath_detail:
      hypothesis: Rare and small classes are lost during downsampling, so a narrow high-resolution spike path 
        should preserve boundaries and small semantic regions.
      semantic_encoder_channels: [16, 32, 64]
      semantic_context: depthwise_dilation_2
      high_resolution_detail_channels: 16
      final_merge: semantic_plus_shallow_plus_detail_concatenation
      selection: binary_spike_count_channel_attention
      parameter_count: 24211
    t03_deep_attention_fpn:
      hypothesis: The four-stage encoder contains useful rare-class semantics, but needs an FPN decoder and 
        low-resolution global spike interaction to retain them.
      encoder_channels: [24, 48, 96, 128]
      context: depthwise_dilation_2
      attention:
        kind: low_resolution_spike_driven_binary_mask
        attention_channels: 32
        heads: 4
        operation: q_k_binary_coincidence_plus_channel_accumulation_then_v_mask
        dense_spatial_softmax: false
      decoder: concatenative_fpn
      parameter_count: 108781
  literature_basis:
  - SLTNet shows that multi-branch depthwise/dilated event features benefit from explicit channel interaction 
    rather than isolated depthwise processing.
  - SLTNet also demonstrates spike-driven masked attention and multi-level encoder-to-decoder feature 
    restoration; the project adapts these ideas into smaller FPGA-oriented ablations rather than copying the 
    complete network.
  promotion_gate:
    incumbent_miou: 0.3130307197570801
    primary_metric: mean_iou
    inspect_per_class_iou: true
    inspect_predicted_pixel_counts: true
    inspect_layer_spike_rates: true
    prefer_fewer_parameters_when_accuracy_is_equivalent: true
    larger_budget_rerun_required: true
    required_seeds: [17, 101, 2026]
    canonical_model_file_unchanged_until_pass: true
