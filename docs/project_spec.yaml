decision_history:





- step: 1





  issue: Exact continuous-time event decay





  decision: Deferred





  reason: Initial goal is a reproducible discrete-time, multiplier-minimized FPGA design.





- step: 2





  issue: Dense software convolution versus sparse hardware execution





  decision: Accept dense PyTorch/SpikingJelly training and require a mathematically equivalent sparse 





    address-accumulation reference for hardware.





- step: 3





  issue: Custom training framework





  decision: Rejected





  reason: PyTorch and SpikingJelly provide the necessary training stack.





- step: 4





  issue: Existing FPGA SNN generator versus custom backend





  decision: Custom VHDL-2008 backend retained





  reason: Spatial convolution, segmentation maps, retinotopic neuron dynamics, memory banking, and exact 





    ordering require project-specific control.





- step: 5





  issue: Detection/tracking versus semantic segmentation





  decision: Active task changed to DDD17 six-class semantic segmentation.





  reason: Pixel-level labels permit true class-wise region learning and remove the untrained box-scale 





    decoder.





- step: 6





  issue: Raw event stream versus Ev-SegNet codification





  decision: Use six-channel codification for current architecture search; require raw-event validation later.





  reason: The downloaded dataset provides ready semantic labels and event-derived statistics but no 





    chronological T dimension.





- step: 7





  issue: Full symmetric U-Net versus lightweight decoder





  decision: Use shallow encoder-decoder with additive skips.





  reason: Lower state memory and simpler FPGA mapping while retaining spatial detail.





- step: 8





  issue: Single architecture selected by intuition versus controlled comparison





  decision: Benchmark ten predefined combinations with identical seed and training budget.





  reason: Component value must be determined experimentally.





- step: 9





  issue: Twenty internal timesteps for every architecture





  decision: Use a staged benchmark and later timestep sweep.





  reason: Internal timesteps are recurrent compute, not camera frames per second; unnecessary steps can 





    multiply runtime without adding information.





- step: 10





  issue: Delete ablation code immediately after one run





  decision: Delay deletion until higher-fidelity and multi-seed confirmation.





  reason: A single low-budget seed is insufficient to establish the canonical architecture.











- date: '2026-08-23'





  decision: replace_50ms_layer_major_FPGA_schedule_with_live_5ms_bin_major_streaming





  details: training_unchanged; ping-pong ingress; lazy touched-neuron beta^delta with 24-bit last-bin tag; 





    prediction default 10 bins; hard U<=1 target U<=0.8





