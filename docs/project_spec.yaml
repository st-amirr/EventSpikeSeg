  failure_policy:
    - Reproduce the smallest failing case.
    - Preserve each fixed defect as a regression test.
    - Never weaken assertions solely to make tests pass.
    - Report missing tools as blockers rather than claiming validation.

repository_contract:
  active_python_package: src/eventscnn
  active_source_files:
    - model.py
    - data.py
    - train.py
    - evaluate.py
    - metrics.py
    - hardware.py
    - __init__.py
  required_documents:
    - README.md
    - project_spec.yaml
    - AGENTS.md
    - docs/ARCHITECTURE.md
    - docs/DECISIONS.md
    - docs/PROGRESS.md
    - docs/BUGS.md
    - docs/RESULTS.md
  clean_repository_rules:
    - Tracking-era files must not remain in active imports or tests.
    - Retired material may be archived outside the active package but must not be executed.
    - Dataset files and large checkpoints must not be committed.
    - README commands must correspond to working Compose or CLI entry points.
    - The project specification must be updated before major architectural changes.

workflow:
  milestone_order:
    - Validate DDD17 discovery and complete training-label availability.
    - Complete a small real-data smoke training run.
    - Preserve the completed ten-architecture benchmark with seed 17.
    - Complete the structural top-five benchmark with fixed selected neuron dynamics.
    - Run the accuracy-oriented top-three benchmark using concatenative multiscale fusion, high-resolution detail preservation, and low-resolution spike-mask attention.
    - Diagnose rare-class collapse before final promotion.
    - Sweep timesteps for the leading architecture.
    - Confirm the winner with seeds 17, 101, and 2026.
    - Promote the winner to the canonical model while preserving ablation results.
    - Evaluate on the reserved DDD17 test split.
    - Add post-training quantization and QAT.
    - Build a bit-accurate integer reference.
    - Add sparse event/spike scatter reference.
    - Implement VHDL LIF and convolution primitives.
    - Integrate multilayer segmentation RTL.
    - Synthesize on ZCU104 and record measured resources, timing, power, and latency.
    - Validate raw-event input on DDD17 or DSEC-Semantic.
  architecture_cleanup_rule: >-
    The ten-preset implementation is temporary experiment infrastructure. Do not remove it
    before the winner is confirmed. After confirmation, simplify the active model to the
    winning architecture, keep benchmark results and configuration records, and remove
    only redundant runtime branches and obsolete files.
  completion_definition:
    - Implementation exists.
    - Tests cover normal and edge behavior.
    - Validation commands pass.
    - Documentation and YAML are synchronized.
    - Configuration and splits are reproducible.
    - No known silent data or tensor mismatch remains.
    - Claimed metrics are measured and recorded.

literature_review:
  current_algorithm_references:
    - id: spiking_edn
      contribution: Adaptive event encoding, searched multi-resolution encoder, spiking ASPP, and event semantic segmentation.
      project_use: Accuracy and adaptive-threshold reference; do not copy irregular NAS graph or heavy ASPP directly.
    - id: evseg_snn
      contribution: Reduced U-shaped PLIF semantic segmentation for event data.
      project_use: Evidence that sparse event input can use a shallower U-Net than RGB segmentation.
    - id: sltnet
      contribution: Lightweight depthwise/dilated blocks, GAP channel attention, additive skips, auxiliary supervision, and spike-driven global context.
      project_use: Main source of lightweight component ablations; transformer and GAP gate remain optional due to FPGA cost.
  preserved_hardware_and_neuron_references:
    - id: berner2013_sparse_sensor
      contribution: DAVIS240 sparse ON/OFF event sensor lineage.
    - id: acharya2019_rpn
      contribution: Local event activity, LIF convolution, and spatial proposal clustering.
      status: historical_tracking_context_only
    - id: debat2021_trajectory
      contribution: Three-layer convolutional SNN, f_inst, f_long/T_thresh, STDP, and motion-selective features.
      status: f_inst_and_f_long_lineage_retained
    - id: fang2023_spikingjelly
      contribution: Trainable SNN infrastructure and surrogate-gradient execution.
    - id: carpegna2024_spiker_plus
      contribution: Fixed-point FPGA SNN accelerator generation and verification concepts.
      status: related_work_only
    - id: firefly_v2
      contribution: High-throughput FPGA acceleration methods for modern SNN operations.
      status: hardware_comparison_reference
  identified_gap: >-
    Event-based SNN semantic-segmentation models exist, and generic FPGA SNN accelerators
    exist, but a lightweight event-semantic-segmentation SNN with a deliberately simple
    sparse shared-kernel FPGA mapping, bit-accurate verification, and measured end-to-end
    board results remains a meaningful integration and evaluation gap.

legacy_tracking_context:
  status: preserved_but_inactive
  previous_task: event_camera_region_proposal_vehicle_classification_and_tracking
  previous_active_dataset: MEVDT
  previous_model_elements:
    - three_layer_32_64_128_spiking_encoder
    - event_supported_attention_map
    - vehicle_background_spiking_classifier
    - deterministic_attention_to_box_decoder
    - alpha_beta_or_component_tracker
  preserved_results_policy: Historical results remain valid only for their original checkpoints and task.
  reason_for_transition: >-
    MEVDT provides boxes and tracking identities but no semantic masks. DDD17-Seg supplies
    pixel-level labels needed to train and evaluate true class-wise semantic maps.
  possible_future_reuse:
    - derive_instances_from_semantic_components
    - add_center_or_offset_head_for_instance_separation
    - associate semantic components temporally
    - validate raw_event_sparse_backend_on_MEVDT
  prohibition: Do not mix legacy tracking metrics or checkpoint assumptions into the active DDD17 semantic benchmark.

decision_history:
  - step: 1
    issue: Exact continuous-time event decay
    decision: Deferred
    reason: Initial goal is a reproducible discrete-time, multiplier-minimized FPGA design.
  - step: 2
    issue: Dense software convolution versus sparse hardware execution
    decision: Accept dense PyTorch/SpikingJelly training and require a mathematically equivalent sparse address-accumulation reference for hardware.
  - step: 3
    issue: Custom training framework
    decision: Rejected
    reason: PyTorch and SpikingJelly provide the necessary training stack.
  - step: 4
    issue: Existing FPGA SNN generator versus custom backend
    decision: Custom VHDL-2008 backend retained
    reason: Spatial convolution, segmentation maps, retinotopic neuron dynamics, memory banking, and exact ordering require project-specific control.
  - step: 5
    issue: Detection/tracking versus semantic segmentation
    decision: Active task changed to DDD17 six-class semantic segmentation.
    reason: Pixel-level labels permit true class-wise region learning and remove the untrained box-scale decoder.
  - step: 6
    issue: Raw event stream versus Ev-SegNet codification
    decision: Use six-channel codification for current architecture search; require raw-event validation later.
    reason: The downloaded dataset provides ready semantic labels and event-derived statistics but no chronological T dimension.
  - step: 7
    issue: Full symmetric U-Net versus lightweight decoder
    decision: Use shallow encoder-decoder with additive skips.
    reason: Lower state memory and simpler FPGA mapping while retaining spatial detail.
  - step: 8
    issue: Single architecture selected by intuition versus controlled comparison
    decision: Benchmark ten predefined combinations with identical seed and training budget.
    reason: Component value must be determined experimentally.
  - step: 9
    issue: Twenty internal timesteps for every architecture
    decision: Use a staged benchmark and later timestep sweep.
    reason: Internal timesteps are recurrent compute, not camera frames per second; unnecessary steps can multiply runtime without adding information.
  - step: 10
    issue: Delete ablation code immediately after one run
    decision: Delay deletion until higher-fidelity and multi-seed confirmation.
    reason: A single low-budget seed is insufficient to establish the canonical architecture.

