        conclusion: superseded_v6_record_did_not_fit_no_DDR_XC7A200T
      v8_full_sequence_occupancy:
        status: pending_measurement
        requirement: full_DSEC_sequences_with_25_PLIF_graph_streaming_5ms_bins_and_lazy_last_bin_tags
        decision_gate: worst_case_live_state_plus_queues_and_weights_must_fit_on_chip_without_DDR
      no_silent_approximation: model_or_precision_changes_require_QAT_and_accuracy_revalidation
      aligned_entry_budget_bytes:
        non_adaptive: 12
        adaptive: 16
      aligned_entry_note: 
        includes_28bit_logical_address_int16_membrane_24bit_last_bin_tag_and_optional_two_int16_adaptation_fields_plus_alignment
  arithmetic:
    common_synapse: signed_weight_lookup_and_saturating_add
    matrix_multiplier_array: none
    pointwise_layer: event_fanout_plus_weight_additions
    PLIF_decay: exported_learned_beta_repeated_delta_bins_for_each_touched_neuron
    shift_only_decay: optional_after_QAT_and_bit_accuracy_validation
    peer_membrane_inhibition: exact_cross_channel_energy_first_then_validate_cheaper_L1_or_LUT_approximation
    triangular_threshold_adaptation: counters_comparators_and_quantized_scale
  parallelism:
    per_actor_synapse_lane_sweep: [1, 2, 4, 8, 16]
    independent_actors: 25
    mechanisms: [actor_local_weight_ROM, banked_sparse_BRAM_state, selected_LUTRAM, event_FIFOs, 
        ready_valid_backpressure]
    deadline: hard_U_le_1_target_U_le_0_8_and_99th_percentile_FIFO_occupancy_bounded
    utilization:
      formula: U=C_bin/(f_clk*0.005)
      hard_max: 1.0
      target_max: 0.8
      headroom_formula: H=1/U
      hard_min: 1.0
      target_min: 1.25
