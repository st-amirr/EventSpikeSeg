project_goal:
  primary_goal: Document the trained SNN and its delivered original-float analog/mixed-signal architecture layout
    with representative per-element consumption; calibrated full-chip inference and manufacture signoff are outside
    article delivery scope.
  primary_research_question: How does the lightweight event-camera SNN perform in software, and how can its architecture
    be represented by the delivered analog/mixed-signal implementation without conflating software accuracy with
    hardware validation?
  hardware_research_question: How can signed event accumulation, resident analog membrane state and shared PLIF
    service circuitry map the model architecture to a physical mixed-signal research implementation, and what representative
    module consumption and limitations are measured?
  secondary_questions:
  - How many internal SNN timesteps are necessary before mIoU saturates?
  - Does depthwise-pointwise convolution preserve accuracy while reducing parameters and synaptic additions?
  - Does multi-scale dilation justify its addressing and buffering cost?
  - 'Does a foldable per-channel affine gain provide most of BatchNorm''s benefit without batch-statistic





    dependence?'
  - 'Does GAP/sigmoid channel gating improve accuracy enough to justify non-spiking global reduction and





    multiplication?'
  - Do adaptive thresholds improve firing balance and multi-seed stability?
  - Is one encoder skip sufficient, or are two additive skips required for boundaries and small classes?
  - What accuracy is lost after weight, membrane, threshold, and accumulator quantization?
  - Which operations dominate resident-state cells, synapse logic, event routing, clock load, and ASIC energy?
  - Which non-local operations require dedicated reduction/control logic or a hardware-aware replacement?
  working_hypotheses:
  - 'Depthwise-pointwise blocks greatly reduce parameters and weight memory but require pointwise channel





    mixing.'
  - Additive skips recover spatial detail with less memory and bandwidth than concatenation.
  - A shallow decoder is sufficient for sparse event statistics and is preferable to a symmetric U-Net.
  - Per-channel affine scaling will be more robust and hardware-friendly than inference-time BatchNorm.
  - 'Four to eight internal timesteps may preserve most accuracy while reducing temporal compute versus twenty





    steps.'
  - Adaptive feature-map thresholds can reduce dominant channels with very small state overhead.
  - Sparse hardware cost will correlate more strongly with measured spike rate than with dense FLOP counts.

framework:





  training_stack:





    language: Python





    tensor_library: PyTorch





    snn_framework: SpikingJelly_activation_based





    use_in_current_code:





    - SpikingJelly ATan surrogate gradient when installed





    - Custom HardwareLIF for exact leak, threshold, reset, peer inhibition, and threshold-adaptation behavior





    - SpikingJelly activation_based Conv2d as the active spike-driven synaptic kernel





    - PyTorch nearest-neighbor interpolation for non-learned decoder routing





    requirement: SpikingJelly is mandatory for model construction; there is no conventional Conv2d fallback.





  custom_framework_decision:





    decision: Do not build a custom autograd or training framework.





    reason: PyTorch and SpikingJelly already provide optimization, surrogate gradients, temporal execution, 





      and data loading.





  hardware_backend:





    primary_type: custom_SystemVerilog_digital_neuromorphic_ASIC





    primary_target: technology_agnostic_actor_array_with_register_or_latch_resident_PLIF_state





    primary_goal: >-





      Instantiate every trained inference PLIF population permanently as nodes in the selected fixed DAG: 25 for





      EventSpikeSeg140k or 44 for EventSpikeSegXL. Neither target is a linear pipeline. A convolution actor uses





      parallel kernel-tap projection cells and one canonical





      combined signed 32-bit Q15.16 accumulator/state per postsynaptic channel and spatial address. Weighted 24-bit Q7.16 spike events accumulate locally.





      Completion tokens fork with every fanout path and rendezvous at residual/skip/concat joins before downstream commit;





      no layer is loaded or reconfigured at runtime.





    software_reference: SpikingJelly_float_plus_bit_exact_integer_reference





    implementation_flow: [integer_reference, SystemVerilog_RTL, Icarus_cocotb_simulation,





        Yosys_technology_mapping, OpenROAD_place_route_and_parasitics, activity_based_OpenSTA_power]





    open_PPA_platform:





      name: ASAP7





      purpose: reproducible_predictive_7nm_logic_PPA_and_scaling_research





      limitation: predictive_nonmanufacturable_and_not_tapeout_signoff





    manufacturable_tile_platform:





      name: SKY130RAM





      purpose: open_actor_tile_and_SRAM_macro_validation





      limitation: 130nm_is_not_dense_enough_for_economical_full_native_resolution_state





    full_model_tapeout_gate: accessible_22nm_or_better_foundry_PDK_plus_successful_full_resident_graph_place_route





  spiker_plus:





    implementation_status: literature_and_design_inspiration_only





