  equivalence_requirement: All exported golden tests must match exactly in the integer reference and RTL simulation.

validation_and_testing:
  required_fast_tests:
    - configuration_schema
    - DDD17_modality_first_and_split_first_discovery
    - event_label_pairing_and_mismatch_detection
    - six_channel_shape_and_order
