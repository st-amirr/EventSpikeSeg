workflow:
  milestone_order:
  - Validate DDD17 discovery and complete training-label availability.
  - Complete a small real-data smoke training run.
  - Preserve the completed ten-architecture benchmark with seed 17.
  - Complete the structural top-five benchmark with fixed selected neuron dynamics.
  - Run the accuracy-oriented top-three benchmark using concatenative multiscale fusion, high-resolution 
    detail preservation, and low-resolution spike-mask attention.
  - Diagnose rare-class collapse before final promotion.
  - Sweep timesteps for the leading architecture.
  - Confirm the winner with seeds 17, 101, and 2026.
  - Promote the winner to the canonical model while preserving ablation results.
  - Evaluate on the reserved DDD17 test split.
  - Add post-training quantization and QAT.
  - Build a bit-accurate integer reference.
  - Add sparse event/spike scatter reference.
  - Implement SystemVerilog PLIF and convolution actor primitives.
  - Integrate the complete 25-actor segmentation graph.
  - Generate and verify the complete resident spike-vector graph, then record routed resources,
    timing, activity-based power, and latency on a scale-suitable ASIC platform.
  - Validate raw-event input on DDD17 or DSEC-Semantic.
  architecture_cleanup_rule: >-
    The ten-preset implementation is temporary experiment infrastructure. Do not remove it
    before the winner is confirmed. After confirmation, simplify the active model to the
    winning architecture, keep benchmark results and configuration records, and remove
    only redundant runtime branches and obsolete files.
  completion_definition:
  - Implementation exists.
  - Tests cover normal and edge behavior.
  - Validation commands pass.
  - Documentation and YAML are synchronized.
  - Configuration and splits are reproducible.
  - No known silent data or tensor mismatch remains.
  - Claimed metrics are measured and recorded.

literature_review:
  current_algorithm_references:
  - id: spiking_edn
    contribution: Adaptive event encoding, searched multi-resolution encoder, spiking ASPP, and event semantic
      segmentation.
    project_use: Accuracy and adaptive-threshold reference; do not copy irregular NAS graph or heavy ASPP 
      directly.
  - id: evseg_snn
    contribution: Reduced U-shaped PLIF semantic segmentation for event data.
    project_use: Evidence that sparse event input can use a shallower U-Net than RGB segmentation.
  - id: sltnet
    contribution: Lightweight depthwise/dilated blocks, GAP channel attention, additive skips, auxiliary 
      supervision, and spike-driven global context.
    project_use: Main source of lightweight component ablations; transformer and GAP gate remain optional due 
      to FPGA cost.
  preserved_hardware_and_neuron_references:
  - id: berner2013_sparse_sensor
    contribution: DAVIS240 sparse ON/OFF event sensor lineage.
  - id: acharya2019_rpn
    contribution: Local event activity, LIF convolution, and spatial proposal clustering.
    status: historical_tracking_context_only
  - id: debat2021_trajectory
    contribution: Three-layer convolutional SNN, instantaneous inhibition, long-term threshold adaptation, 
      STDP, and motion-selective features.
    status: inhibition_and_threshold_adaptation_lineage_retained
  - id: fang2023_spikingjelly
    contribution: Trainable SNN infrastructure and surrogate-gradient execution.
  - id: carpegna2024_spiker_plus
    contribution: Fixed-point FPGA SNN accelerator generation and verification concepts.
    status: related_work_only
  - id: firefly_v2
    contribution: High-throughput FPGA acceleration methods for modern SNN operations.
    status: hardware_comparison_reference
  identified_gap: >-
    Event-based SNN semantic-segmentation models exist, and generic FPGA SNN accelerators
    exist, but a lightweight event-semantic-segmentation SNN with a deliberately simple
    sparse shared-kernel FPGA mapping, bit-accurate verification, and measured end-to-end
    board results remains a meaningful integration and evaluation gap.

