  execution:
    physical_topology: 25_permanent_PLIF_actors_in_static_DAG_plus_one_final_current_readout
    cross_layer_compute_sharing: forbidden
    layer_reconfiguration: forbidden
    partial_reconfiguration: forbidden
    permitted_shared_infrastructure: [clock_reset, input_dispatch, final_class_readout]
    actor_owned_blocks: [static_synapses, resident_currents, resident_membranes, resident_adaptation_state, parallel_PLIF_update, mechanism_logic]
    model_level: continuous_5ms_bins_with_configurable_prediction_window_default_10_bins
    RTL_level: synchronous_clocked_elastic_pipeline
    global_neural_timestep_barrier: a_bin_retires_only_when_the_final_readout_receives_completion_after_all_required_DAG_branches_rendezvous
    FPGA_input_bins: continuous_pingpong_5ms_runtime_bins
    event_address:
    - global_bin_tag_24bit
    - polarity_or_channel
    - y
    - x
    procedure:
    - Stream rectified raw events to both fixed ingress branches during the active 5 ms bin; no dense whole-bin tensor is required.
    - Inject one tagged completion token at the 5 ms boundary. The token follows the same static DAG as spikes, forks on fanout, and rendezvous-waits at residual/skip/concat joins.
    - Accumulate static-synapse contributions directly into each destination neuron's resident current state.
    - At completion, apply one learned-beta step and one PLIF commit to every resident neuron in parallel; no state address fetch or last-bin tag is used.
    - Retain updated membrane and adaptation values locally and emit the resulting spike bitmap to statically connected downstream synapses.
    - After `final_fuse.standard` and all required branches have completed, update signed class-current state; every prediction_window_bins emit argmax and clear only class-current state.
