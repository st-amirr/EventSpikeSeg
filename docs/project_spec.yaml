round_one_measured_results:
  date: '2026-08-06'
  seed: 17
  epochs: 10
  train_samples: 2048
  held_out_samples: 512
  resolution_hw: [64, 64]
  internal_timesteps: 20
  batch_size: 4
  source_summary: artifacts/ablation/summary.json
  ranking_by_mIoU:
    - {rank: 1, architecture: v10_fpga_hybrid, mIoU: 0.3130307198, parameters: 44016, spike_rate: 0.1411708792}
    - {rank: 2, architecture: v03_dw_dilated, mIoU: 0.2970095277, parameters: 40824, spike_rate: 0.1125130773}
    - {rank: 3, architecture: v02_dw_light, mIoU: 0.2849613726, parameters: 30744, spike_rate: 0.1305065870}
    - {rank: 4, architecture: v08_dw_multiscale_aux, mIoU: 0.2591362894, parameters: 44016, spike_rate: 0.1050513466}
    - {rank: 5, architecture: v04_dw_multiscale, mIoU: 0.2444102764, parameters: 42552, spike_rate: 0.1188160578}
  incumbent:
    architecture: v10_fpga_hybrid
    pixel_accuracy: 0.7870869637
    per_class_iou:
      flat: 0.6082547903
      construction_plus_sky: 0.8021190763
      object: 0.0
      nature: 0.1509719491
      human: 0.0
      vehicle: 0.3168385327
  interpretation:
    - v10 is the structural incumbent, not a satisfactory final six-class model.
    - v03 shows that one dilated block can outperform heavier parallel multiscale context.
    - v02 is the most parameter-efficient leading structure.
    - v08 supports retaining auxiliary supervision as a contender component.
    - BatchNorm lowered training loss but did not improve held-out mIoU in this run.
  open_problem: Object and human classes collapsed to zero IoU and require data/prediction diagnostics.

mechanism_screen_measured_results:
  date: '2026-08-07'
  purpose: Select neuron/inhibition dynamics before varying architecture.
  protocol:
    seed: 17
    epochs: 5
    train_samples: 256
    held_out_samples: 128
    resolution_hw: [64, 64]
    internal_timesteps: 8
  source_summary: artifacts/ablation/top_five/summary.json
  ranking_by_mIoU:
    - {rank: 1, architecture: f05_v02_light_peer_membrane_inhibition, mIoU: 0.1990700960, parameters: 33455, spike_rate: 0.0616127253}
    - {rank: 2, architecture: f02_v10_plif_threshold_adaptation, mIoU: 0.1459280401, parameters: 46422, spike_rate: 0.0469515721}
    - {rank: 3, architecture: f01_v10_plif_threshold_wta, mIoU: 0.1402056664, parameters: 46392, spike_rate: 0.0456547340}
    - {rank: 4, architecture: f04_v03_dilated_threshold_adaptation, mIoU: 0.1366340071, parameters: 42830, spike_rate: 0.0512948520}
    - {rank: 5, architecture: f03_v10_plif_winner_peer_inhibition, mIoU: 0.1232914403, parameters: 46437, spike_rate: 0.0415132840}
  selected_dynamics:
    neuron: PLIF
    learnable_base_threshold: true
    normalization: affine_channel_scale
    residual_paths: true
    auxiliary_supervision: true
    hidden_inhibition:
      kind: peer_membrane
      scope: stem
      inhibition_strength_init: 0.20
    threshold_adaptation:
      kind: triangular_threshold
      scope: encoder_and_context
      strength_init: 0.20
      adaptation_duration_init: 5.0
    output_class_wta: true
  evidence:
    - triangular threshold adaptation slightly improved the controlled v10 comparison over PLIF plus learned threshold alone.
    - winner_peer hidden inhibition caused severe encoder spike starvation and is excluded from the active five.
    - stem-only peer_membrane inhibition preserved deeper activity and produced the highest mIoU.
    - the winner learned inhibition strength 0.2082, threshold-adaptation strength 0.1879, and adaptation duration 5.196, close to initialization.
  limitation: This was a low-budget mechanism screen and is not directly comparable to the full-budget 0.3130 incumbent for promotion.

