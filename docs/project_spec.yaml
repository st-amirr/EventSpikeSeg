analog_continuation_2026_10_03: >-





  Static geometry full-float MOS weight encoding is still an experiment. The original segmented DC-restarted result is invalid for state carry. With UIC, direct-bank off-state load moves a 100um state pair by 2.90mV before the first event; series access reduces this to 34nV. One polarity-reversed isolated event with 5x device width matches within 1.81%, but multi-event deck is outside PDK width limits and no retention/fan-in/layout qualification exists. Continue in analog full-float mode; require valid SPICE completion, isolated-access transfer grid, retention, then ordered float sequence before layout.





  Follow-up: in-range isolated-TG geometry sweep delivers only20-34pct of target float event charge; wider TG improves charge but shifts common mode. Five-times raw transistor width exceeds PDK model range. Full360-branch netlist is killed by bounded Docker memory and33-branch sim timestep-underflows, so no full-sequence or layout acceptance. Next implement a convergent isolated switch driver or physical weight source for the shared calibrated injector.





  Pulse-width follow-up: sampled1ns after 10.5/30/52.5ns isolated events, charge is0.230/0.217/0.202mV vs+0.683mV target; longer pulse worsens charge slightly, so measurement delay does not explain underdrive. Continue analog physical weight-source exploration, no layout promotion.











  Shared analog bias R-2R event delivery: TT-trimmed 12-bit ideal-R ladder with PDK TGs and extracted injector devices gives event-charge error -2.3..-3.2% TT, -4.6..-6.0% SS, -1.4..-2.0% FF. Bias DAC only; no learned weight quantization or QAT. Physical resistor ratio, mismatch, noise and full-float replay remain open.





