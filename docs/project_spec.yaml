      experiments.

input_and_time:
  loader_interface:
    item_shape: [6, H, W]
    batch_shape: [1, 6, H, W]
    deployment_batch: 1
    record_duration_us: 50000
    shuffle: false
    state_policy: retain_across_consecutive_records_reset_at_sequence_or_frame_gap
    fraction_policy:
      ddd17: deterministic_contiguous_stream_segment_per_epoch
      dsec: deterministic_contiguous_segment_from_every_training_sequence_per_epoch
  decoded_channel_contract:
  - polarity_0_activity
  - polarity_1_activity
  - polarity_0_normalized_timestamp_mean
  - polarity_1_normalized_timestamp_mean
  - polarity_0_normalized_timestamp_standard_deviation
  - polarity_1_normalized_timestamp_standard_deviation
  input_scheduler:
    default_internal_updates: 10
    default_event_clock_us: 5000
    configurability: internal_updates_must_divide_50000_us_exactly
    arrival_approximation:
    - {offset: mean, activity_fraction: 0.50}
    - {offset: mean_minus_std, activity_fraction: 0.25}
    - {offset: mean_plus_std, activity_fraction: 0.25}
    invariant: scheduled_synaptic_activity_equals_histogram_activity
    note: clock_updates_are_hardware_time_within_one_record_not_stacked_dataset_files
  dsec_fixed_time_divisions:
    purpose: shared_training_and_ASIC_runtime_time_contract
    duration_us: 50000_divided_by_internal_updates
    default_divisions: 10
    invariants:
    - preserve_source_event_order
    - preserve_total_linear_event_multiplicity
    - event_density_never_changes_update_count
    - carry_fixed_physical_elapsed_microseconds
    - normalize_logits_and_rates_by_elapsed_physical_time
    - ASIC_runtime_preserves_all_ten_chronological_5ms_updates
    - default_prediction_window_is_ten_5ms_bins_50ms
    - hardware_compute_schedule_is_bin_major_end_to_end
  training_state:
    truncated_bptt_boundary: one_50ms_record
    after_backward: detach_autograd_history_but_retain_numeric_neuron_state
    dsec_sequential_chunks:
      cli_default: 1
      compose_profile: 10
      behavior: no_grad_full_record_then_replay_chunks_with_one_objective_output_gradients
      state_snapshot: host_RAM_to_avoid_duplicate_GPU_neuron_state
      invariant: one_semantic_objective_per_complete_50ms_record
    reset_conditions: [epoch_start, validation_start, sequence_change, frame_index_gap]
  forbidden:
  - repeated_static_samples
  - stacking_adjacent_numpy_records_as_one_model_input
  - shuffled_stream_records
  - state_carry_across_sequence_boundaries_or_frame_gaps
  - treating_timestamp_statistics_as_independent_image_channels_in_the_stem
  checkpoint_contract:
    version: ddd17-timestamp-v3
    recurrent_runtime_state_saved: false
    recurrent_runtime_state_reason: checkpoints_store_trainable_and_optimizer_state_only_not_data_dependent_membranes_or_adaptation_tensors
    fingerprint_fields:
    - manifest_digest
    - exact_record_membership
    - input_mode
    - integration_window_us
    - internal_updates
    - event_clock_us
    - timing_mode
    - stateful_stream
    legacy_policy: reject_all_older_input_protocol_checkpoints
  dsec_streaming_runtime_execution:
    input_bin_us: 5000
    input_bin_rate_hz: 200
    training_prediction_window_bins: 10
    default_prediction_period_us: 50000
    default_prediction_rate_hz: 20
    schedule: autonomous_actor_dataflow_with_ordered_5ms_completion_tokens
    ingress: timestamp_ordered_raw_event_stream_plus_5ms_epoch_marker_no_dense_bin_load
    procedure:
    - Rectify and route each raw camera event in timestamp order as it arrives; do not materialize a dense input tensor or preload a complete 5 ms bin.
    - Each input event is losslessly multicast to the fixed ingress actors `detail_stem` and `stem`; each branch immediately triggers only its connected static-weight additions.
    - At each 5 ms boundary, inject a completion token after the final raw event assigned to that semantic epoch.
    - Each actor routes valid nonzero static-synapse contributions directly into the resident current element of each postsynaptic channel/spatial PLIF.
    - On the upstream completion token, every resident PLIF applies one beta step and commits in parallel without an addressed state fetch; retinotopic peers apply inhibition/adaptation atomically.
    - Retain membrane and enabled adaptation state in the PLIF population and emit the resulting spike bitmap through fixed downstream synapses.
    - Accumulate signed final class current across prediction_window_bins and emit argmax when the window 
      completes; default is ten bins / 50 ms.
    state_persistence: 
      PLIF_and_adaptation_state_persists_across_bins_and_predictions_reset_only_at_sequence_or_gap_boundaries
    resident_state_last_bin_tag_bits: 0
    realtime:
      hard_condition: U = C_bin/(f_clk*0.005) <= 1.0
      target_condition: U <= 0.8
      headroom_definition: H = 1/U = hard_cycle_budget/C_bin
      hard_headroom_minimum: 1.0
      target_headroom_minimum: 1.25
      hard_cycle_budget_formula: floor(f_clk * 0.005)
      target_cycle_budget_formula: floor(0.8 * hard_cycle_budget)
      example_cycle_budgets:
        100MHz:
          hard: 500000
          target_80pct: 400000
        150MHz:
          hard: 750000
          target_80pct: 600000
        200MHz:
          hard: 1000000
          target_80pct: 800000
      deadline_measurement: cycles_from_bin_accept_until_final_readout_update_for_that_bin
    forbidden:
    - threshold_or_reset_after_each_individual_signed_raw_event_contribution
    - retiring_or_overwriting_a_bin_before_its_full_forward_pass_completes
    - record_major_layer0_t0_to_t9_then_layer1_t0_to_t9_hardware_schedule
    - collapsing_the_default_50ms_prediction_window_into_one_PLIF_step
    - thresholding_a_PLIF_after_each_individual_signed_kernel_contribution
    - allocating_one_membrane_copy_per_kernel_tap


runtime_batching_decision:
  decision: autonomous_static_actor_DAG_with_ordered_5ms_completion_tokens
  rationale: This preserves the fixed 5 ms training time grid and continuously resident PLIF state while accepting
    raw events sequentially without dense bin loading. The 5 ms marker is a semantic commit boundary, not an
    instruction to preload or sweep a bin. It avoids the superseded 50 ms layer-major schedule.
  bin_structure:
    bin_us: 5000
    required_bin_rate_hz: 200
  prediction_window:
    default_bins: 10
    default_us: 50000
    default_rate_hz: 20
    configurable: true
  graph_order: events_and_completion_tokens_follow_explicit_static_DAG_edges; actor_list_is_topological_export_order_only
  state_rule: every_logical_PLIF_owns_resident_current_membrane_and_enabled_adaptation_elements; all_destinations_commit_once_per_bin
  decay: one_learned_beta_step_per_resident_PLIF_per_5ms_completion_without_last_bin_tag
  double_buffering: optional_ingress_FIFO_or_pingpong_capture_may_overlap_bin_k_plus_1_with_graph_processing_of_bin_k
  realtime_utilization:
    U: C_bin/(f_clk*5ms)
    hard_max: 1.0
    target_max: 0.8
    H: 1/U
    hard_min: 1.0
    target_min: 1.25
  asynchronous_claim: true
  asynchronous_scope: logical_event_driven_ready_valid_actor_dataflow_without_a_global_actor_scheduler
  electrically_clockless_QDI_claim: false
  sparsity_claim: event_driven_synaptic_zero_skipping_with_dense_parallel_resident_PLIF_commit_each_5ms
neuron:
  name: HardwareLIF
  equation: V[t] = V[t-1] - V[t-1] / 2^q + I[t]
  beta_equivalent: beta = 1 - 2^(-q)
  default_beta_shift_q: 4
  default_beta: 0.9375
  threshold_default: 0.5
  reset: subtractive
  surrogate_gradient: ATan
  inference_surrogate_effect: none
  bias_policy:
    convolution_bias: false_preferred
    reason: A free bias injects current where no event/spike evidence exists and weakens sparse execution.
  state_reset:
    between_independent_samples: true
    between_batches: true
    within_sample_timesteps: false
  operation_order_must_match:
  - leak_previous_membrane
  - add_current
  - form_effective_threshold
  - compute_candidate_spikes
  - apply_peer_inhibition_if_enabled
  - subtract_threshold_for_emitted_spikes
  - optionally_decrement_competing_membranes
  - update_threshold_adaptation

custom_spiking_dynamics:
  terminology:
    rule: descriptive_names_are_used_in_all_active_software_RTL_and_export_interfaces
    literature_aliases:
      instantaneous_inhibition_factor: peer_membrane_inhibition_or_historical_winner_peer_competition
      long_threshold_factor: triangular_threshold_adaptation
      threshold_time_constant: adaptation_duration
    compatibility: 
      literature_aliases_may_appear_only_in_citations_historical_experiment_IDs_and_legacy_checkpoint_readers
  peer_membrane_inhibition:
    concept: instantaneous cross-channel membrane inhibition at the same spatial coordinate
    lineage: Event-Based Trajectory Prediction Using Spiking Neural Networks, 2021
    rule:
    - Determine whether any neuron spikes at a retinotopic location.
    - Compute the local RMS membrane energy across peer feature channels.
    - Subtract a learned fraction of that energy from non-spiking peer membranes.
    - Keep simultaneous spikes; winner-only suppression is a historical ablation, not the canonical rule.
    current_scope: stem_only
    current_kind: peer_membrane
  triangular_threshold_adaptation:
    concept: local inverted-V threshold adaptation after a neuron spike
    lineage: Event-Based Trajectory Prediction Using Spiking Neural Networks, 2021
    scope: per_enabled_logical_neuron_with_retinotopic_cross_channel_sum
    persistent_state: [adaptation_age, adaptation_amplitude]
    learned_parameters: [threshold_adaptation_strength_per_channel, adaptation_duration_per_channel]
    effective_threshold: theta[channel,y,x] = theta_base[channel] + summed_triangular_penalty[y,x]
    current_defaults:
      enabled_in_canonical_model: true
      enabled_scope: encoder_context
    expected_effects:
    - Temporarily raise the local threshold after spiking.
    - Reduce repeated dominance while retaining spatially local evidence.
    limitation: The age and amplitude maps are material resident ASIC state elements and are not negligible.

architecture_family:
  implementation_model: EventSpikeSeg140k
  non_target_comparison_model: EventSpikeSegXL
  design_principles:
  - Binary-spiking learned feature path with continuous final class-current accumulation
  - Native 440x640 input with learned stride-2 semantic stem
  - Three-scale 32_64_128 semantic encoder plus persistent 8-channel native detail path
  - Serial dilation-2 semantic context without QKV attention or parallel context
  - Additive encoder skips and late semantic_detail concatenation
  - Nearest-neighbor upsampling rather than transposed convolution where possible
  - Depthwise spatial filtering plus pointwise event fan-out/channel mixing
  - Per-channel affine scaling folded into exported fixed-point parameters
  - Training-only auxiliary head omitted from inference
  - No bounding-box, attention-centroid, classification-only, or tracking head in the active model
  implementation_channel_schedule: [32, 64, 128]
  detail_channels: 8
  attention: none
  output:
    class_current_shape_dsec: [N, 6, 440, 640]
    accumulated_activity: continuous_weighted_current_mean_over_T
    decoded_semantic_map: argmax_over_class_current
    ignore_index: 255
  common_encoder_decoder:
    conceptual_stages:
    - six_channel_spiking_stem
    - high_resolution_encoder_stage
    - downsampled_encoder_stage
    - low_resolution_semantic_context_stage
    - lightweight_upsampling_decoder
    - one_or_two_additive_encoder_skips
    - per_pixel_six_class_spiking_head
    exact_channels_and_shapes: configuration_and_input_resolution_dependent

architecture_search:
  fairness_contract:
  - Same training and validation records
  - Same deterministic seed
  - Same initialization procedure
  - Same optimizer, learning-rate schedule, macro class-balancing rule, resolution, and timesteps
  - Same maximum sample counts
  - No architecture-specific manual tuning during the first ranking
  presets:
    v01_std_unet_light:
      purpose: standard_convolution_reference
      depthwise: false
      context: none
      normalization: none
      residual: false
      adaptive_threshold: false
      auxiliary_head: false
    v02_dw_light:
      purpose: depthwise_pointwise_minimal_baseline
      depthwise: true
      context: none
      normalization: none
      residual: false
      adaptive_threshold: false
    v03_dw_dilated:
      purpose: single_dilated_context_ablation
      depthwise: true
      context: dilation_2
      normalization: none
      residual: true
      adaptive_threshold: false
    v04_dw_multiscale:
      purpose: parallel_multi_scale_context_without_normalization
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: none
      residual: true
      adaptive_threshold: false
    v05_dw_multiscale_affine:
      purpose: preferred_foldable_channel_calibration
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: per_channel_gain
      residual: true
      adaptive_threshold: false
    v06_dw_multiscale_bn:
      purpose: batch_normalization_accuracy_ablation
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: BatchNorm2d
      deployment_rule: Fold frozen BN into preceding convolution before quantization.
      residual: true
      adaptive_threshold: false
    v07_dw_multiscale_gap:
      purpose: SLTNet_style_channel_attention_ablation
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: per_channel_gain
      gap_sigmoid_channel_gate: true
      residual: true
      adaptive_threshold: false
      hardware_warning: Requires global accumulation, nonlinear gate approximation, and channel 
        multiplication.
    v08_dw_multiscale_aux:
      purpose: auxiliary_supervision_ablation
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: per_channel_gain
      residual: true
      auxiliary_head: true
      inference_rule: Auxiliary head may be removed after training.
    v09_dw_single_skip:
      purpose: lower_memory_decoder_ablation
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: per_channel_gain
      residual: true
      skip_count: 1
      adaptive_threshold: true
    v10_fpga_hybrid:
      purpose: combined_hardware_oriented_candidate
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: per_channel_gain
      residual: true
      skip_count: 2
      adaptive_threshold: true
      auxiliary_head: true
  default_architecture_before_selection: v10_fpga_hybrid
  winner_selection:
    primary_metric: validation_mIoU
    tie_window_mIoU_percentage_points: 0.5
    tie_breaker_order:
    - lower_parameter_count
    - lower_output_spike_rate
    - lower_estimated_synaptic_additions
    minimum_confirmation_seeds: [17, 101, 2026]
    promotion_rule: >-
      Do not delete the nine losing presets until the leading architecture has completed
      the staged benchmark, higher-fidelity confirmation, and multi-seed validation.
      After promotion, preserve the ablation table and preset definitions in experiment
      records even if the runtime model is simplified to one canonical architecture.

training:
  task: supervised_semantic_segmentation
  dsec_augmentation:
    scope: training_only
    horizontal_flip_probability: 0.5
    translation_pixels_xy: [-6, 6]
    event_dropout_fraction: [0.0, 0.05]
    spatial_transform_sampling: fixed_per_recording_sequence_for_the_complete_run
    dropout_sampling: deterministic_per_epoch_and_50ms_record
    temporal_rule: identical_spatial_transform_for_all_ten_5ms_updates_and_target_mask
    exposed_mask_pixels: ignore_index_255
    validation: disabled
  dsec_input_pipeline:
    preprocessing_device: CPU
    worker_processes_default: 4
    prefetch_records_per_worker: 2
    prefetched_storage: pinned_host_RAM_when_CUDA_is_active
    gpu_transfer: non_blocking
    chronological_delivery: preserved
    compose_worker_processes: 4
    docker_shared_memory_limit_mib: 512
    shared_memory_reason: four_workers_times_two_prefetched_native_records_fit_within_512MiB
    note: preprocessing_prefetch_does_not_allocate_additional_VRAM_beyond_the_active_GPU_record
  optimizer:
    name: AdamW
    default_learning_rate: 0.001
    default_weight_decay: 0.0001
    resume_lr_semantics: replace_initial_group_rates_and_cosine_horizon_then_evaluate_completed_epoch
    epoch_74_experimental_resume_lr: 0.001
  scheduler: cosine_annealing
  loss:
    primary: balanced_pixel_and_target_present_class_cross_entropy
    ignore_index: 255
    class_balancing: no_static_class_weights_for_final_suite
    focal_balancing: macro_average_over_target_present_classes_where_focal_is_enabled
    final_pixel_cross_entropy_weight: 0.5
    final_macro_cross_entropy_weight: 0.5
    final_dice_weight: 0.4
    final_same_class_neighbor_consistency_weight: 0.0
    region_consistency: disabled_for_final_suite
    final_auxiliary_pixel_ce_weight: 0.1
    final_boundary_weight: 0.01
    backbone_refinement:
      joint_training_fraction: [0.0, 0.9]
      decoder_detail_only_fraction: [0.9, 1.0]
    absent_class_behavior: no_positive_class_term_but_logits_remain_in_every_present_class_softmax_denominator
    optional_future_regularizers:
      spike_rate: 0.001
      channel_utilization_balance: 0.001
  no_custom_mechanism_ablation:
    source_checkpoint: artifacts/checkpointsV4/dsec_6class/EventSpikeSeg140k_seed17_epoch080.pt
    service: train-dsec-no-custom-mechanisms
    fine_tune_epochs: 1
    optimizer: fresh_AdamW
    initial_learning_rate: 0.00001
    disabled_runtime_mechanisms:
    - peer_membrane_inhibition
    - triangular_threshold_adaptation
    structural_layers_removed: false
    structural_reason: preserve_checkpoint_tensor_shapes_and_isolate_neuron_mechanism_effect
    output_directory: artifacts/checkpointsV4/dsec_6class/no_custom_mechanisms
  deterministic_seed_default: 17
  default_full_search:
    epochs: 10
    internal_timesteps: 20
    resolution_hw: [64, 64]
    max_train_samples: 2048
    max_validation_samples: configuration_dependent
    batch_size: 1
    note: Accurate but slow on CPU and not required for the first ranking pass.
  recommended_staged_search:
    stage_1_all_ten:
      purpose: coarse_architecture_ranking
      epochs: 3
      internal_timesteps: 4
      resolution_hw: [48, 48]
      max_train_samples: 512
      max_validation_samples: 128
      batch_size_cpu: 1_or_4_after_measurement
      seed: 17
    stage_2_top_three:
      epochs: 8_to_10
      internal_timesteps: 8
      resolution_hw: [64, 64]
      max_train_samples: 2048
      max_validation_samples: 512
      seed: 17
    stage_3_winner:
      internal_timestep_sweep: [1, 2, 4, 8, 16, 20]
      resolution_progression:
      - [64, 64]
      - [112, 176]
      - [224, 352]
      seeds: [17, 101, 2026]
      dataset_scope: full_available_training_split_when_practical
  runtime_optimization_rules:
    approximate_cost_proportional_to:
    - number_of_samples
    - epochs
    - internal_timesteps
    - image_height_times_width
    - architecture_synaptic_cost
    GPU:
      use_when_available: true
      batch_size_sweep: [4, 8, 16]
    CPU:
      avoid_assuming_more_threads_is_faster: true
      measure_before_changing_torch_thread_count: true
      preferred_first_speed_reductions:
      - fewer_internal_timesteps
      - fewer_samples
      - lower_resolution
      - staged_architecture_elimination
  checkpoint_contract:
    required_fields:
    - architecture_name_and_config
    - model_state
    - optimizer_or_training_metadata
    - seed
    - class_mapping
    - validation_split_indices_or_record_identifiers
    - input_resolution
    - internal_timesteps
    - normalization_mode
    - dataset_representation_version

normalization_and_scaling:
  none:
    benefit: cleanest hardware interpretation
    risk: dead or saturated channels and greater seed sensitivity
  per_channel_affine:
    selected_preferred_method: true
    equation: current[c] = gain[c] * convolution_current[c]
    bias_default: false
    reason_no_bias: Preserve zero current in inactive regions.
    deployment: Fold gain into output-channel convolution weights.
  BatchNorm:
    role: training_ablation
    training_behavior: Normalize per output channel using batch and spatial statistics, then apply learned 
      gamma and beta.
    inference_behavior: Use frozen running statistics.
    deployment: Fold BN into convolution weights and bias before quantization.
    warning: BatchNorm effects must never simply disappear at inference.
  GAP_channel_gate:
    role: accuracy_ablation_inspired_by_SLTNet
    pipeline:
    - global_average_pool_each_channel
    - learned_channel_score
    - sigmoid_or_approximation
    - channelwise_scaling
    ASIC_costs:
    - whole_feature_map_reduction
    - gate_storage
    - multiplication_or_shift_approximation
    - global synchronization

operation_rationale:
  standard_convolution:
    benefit: strongest direct spatial_and_channel mixing
    cost: weights_and_MACs_scale_as_Kh_times_Kw_times_Cin_times_Cout
  depthwise_convolution:
    benefit: cheap_per_channel_spatial_filtering
    cost: weak_cross_channel_interaction
  pointwise_convolution:
    benefit: mixes_channels_after_depthwise_filtering_and_controls_channel_width
    cost: can_dominate_weight_count_at_high_channel_width
  dilated_convolution:
    benefit: larger_receptive_field_without_downsampling_or_more_kernel_weights
    cost: irregular_addressing_and_possible_gridding_artifacts
  multiscale_context:
    benefit: combines_local_medium_and_broad_context_for_objects_of_different_sizes
    cost: branch_buffers_and_more_synaptic_operations
  additive_skip:
    benefit: recovers_high_resolution_boundaries_without_doubling_channels
    cost: requires_shape_and_channel_alignment
  nearest_neighbor_upsampling:
    benefit: deterministic_no_weight_low_control_cost
    cost: relies_on_following_convolution_for_refinement
  residual_membrane_or_feature_path:
    benefit: preserves_subthreshold_information_and_gradient_flow
    cost: extra_buffer_or_read_port
  auxiliary_head:
    benefit: improves_gradient_delivery_to_intermediate_decoder_features
    cost: training_only_compute_and_loss_memory
  adaptive_threshold:
    benefit: dynamic_firing_rate_control_and_channel_balance
    cost: one_small_state_value_per_channel

metrics:
  primary_segmentation:
  - mean_IoU
  - per_class_IoU
  - pixel_accuracy
  - mean_class_accuracy
  - confusion_matrix
  model_efficiency:
  - parameter_count
  - checkpoint_size
  - dense_operation_estimate
  - estimated_synaptic_additions
  - peak_training_memory
  - samples_per_second
  SNN:
  - spike_rate_per_layer
  - output_spike_rate
  - silent_channel_fraction
  - dominant_channel_fraction
  - channel_utilization
  - membrane_saturation_fraction
  - internal_timestep_accuracy_curve
  robustness:
  - mean_and_standard_deviation_across_seeds
  - minimum_seed_mIoU
  - class_specific_seed_variance
  ASIC_future:
  - standard_cell_area
  - SRAM_macro_area
  - routing_area
  - maximum_clock_frequency
  - latency_per_input_interval
  - sustained_events_per_second
  - 99th_percentile_FIFO_occupancy
  - dynamic_power
  - energy_per_event
  - energy_per_semantic_output
  reporting_rule: Only measured values may be placed in RESULTS.md; estimates must be labeled explicitly as 
    estimates.

quantization:
  objective: Match the addition, multiplication, comparison, saturation, and address-generation ASIC datapath.
  initial_formats:
    weights: signed_int8_Q1_6
    membrane: signed_int16_Q5_10
    current_accumulator: signed_int24_Q13_10
    beta: unsigned_int16_UQ1_15
    base_threshold: signed_int16_Q5_10
    adaptive_threshold: signed_int16_Q5_10
    spike: 1_bit
    pixel_class: unsigned_3_bit_for_6_classes
    coordinate_x: unsigned_width_dependent
    coordinate_y: unsigned_height_dependent
    timestamp_us: unsigned_int32
  mandatory_rules:
  - Prefer bias-free convolutions.
  - Preserve learned per-channel beta with the exported UQ1.15 coefficient.
  - Fold per-channel affine and BatchNorm before hardware export.
  - Use deterministic rounding and saturating arithmetic.
  - Freeze clipping and overflow behavior.
  - Quantize after architecture and timestep selection.
  experiments:
    weight_bits: [4, 6, 8]
    membrane_bits: [12, 16, 20]
    accumulator_guard_bits: sweep
    process:
    - floating_point_baseline
    - post_training_quantization
    - quantization_aware_fine_tuning
    - bit_exact_integer_export
    - layerwise_equivalence_replay

