document:
  title: Digital Neuromorphic FPGA Event-Camera Spiking Neural Network for Semantic Segmentation
  short_name: EventSpikeSeg-FPGA
  version: 1.2.0
  status: canonical_140k_promoted_fpga_mapping_defined
  created_date: '2026-08-06'
  supersedes:
    - EventSCNN-FPGA region-proposal, classification, and tracking specification v0.2
    - minimal semantic-segmentation project_spec.yaml created during repository cleanup
  intended_uses:
    - Executable software and digital-neuromorphic FPGA implementation specification
    - Source of truth for architecture search and experiment tracking
    - Interface contract between SpikingJelly/PyTorch training and custom VHDL/FPGA deployment
    - Foundation for an article on lightweight event-based SNN semantic segmentation with sparse digital FPGA inference
  central_interpretation: >-
    One dataset item is one 50 ms Ev-SegNet interval, never a stack of adjacent files.
    Histogram channels carry polarity activity; per-polarity normalized timestamp mean
    and standard deviation schedule weighted synaptic arrivals at the model input. The
    PLIF network executes ten 5 ms hardware-clock updates inside that physical interval
    and retains neuron state into the next consecutive record. It resets at sequence or
    frame-index gaps. The manifest is authoritative for stream order. New checkpoints
    use ddd17-timestamp-v3 and fingerprint the manifest, split, representation, physical
    interval, and event-clock contract. DDD17 requires no HDF5 input. The DSEC
    extension instead slices exact raw events from each sequence HDF5 file using
    the semantic timestamp text and supplied rectification map, then sends binary
    polarity clocks directly to the same learned feature architecture.
  preservation_policy:
    retained_from_previous_specification:
      - Hardware-compatible LIF equations and power-of-two leakage
      - f_inst cross-channel competition
      - f_long/T_thresh feature-map homeostasis
      - Sparse shared-kernel event-address accumulation
      - Fixed-point formats, saturation, and bit-accurate equivalence requirements
      - Custom VHDL-2008 backend and ZCU104 as the primary deployment target
      - SpikingJelly surrogate-gradient training strategy
      - Synthetic fixtures, golden vectors, and staged hardware verification
      - Synthesis-guided BRAM/LUTRAM/register memory mapping
      - Measured-only reporting policy
      - Spiker+ as related work and implementation inspiration, not a dependency
    replaced_by_current_project:
      - Region proposal head
      - Global vehicle/background classification head
      - Bounding-box spread decoder
      - Attention-centroid tracking
      - MEVDT as the active training dataset
      - FE108 and DSEC-MOT as active milestones
    historical_material_location: legacy_tracking_context

project_goal:
  primary_goal: >-
    Design, train, compare, quantize, and eventually deploy a lightweight fully spiking
    semantic-segmentation network for event-camera data, with an architecture chosen for
    sparse digital neuromorphic FPGA inference rather than GPU efficiency alone.
  primary_research_question: >-
    Which combination of lightweight convolution, multi-scale context, normalization,
    skip fusion, recurrent spiking dynamics, and auxiliary supervision provides the best
    DDD17/DSEC semantic-segmentation accuracy while retaining a clear mapping to fixed-point PLIF state and event-driven synaptic updates?
  hardware_research_question: >-
    Can the selected PLIF model be mapped to a custom VHDL FPGA accelerator where learned membrane retention, thresholds, and shared synaptic weights are realized as fixed-point digital state and event-driven arithmetic while preserving semantic accuracy and low energy/latency?
  secondary_questions:
    - How many internal SNN timesteps are necessary before mIoU saturates?
    - Does depthwise-pointwise convolution preserve accuracy while reducing parameters and synaptic additions?
    - Does multi-scale dilation justify its addressing and buffering cost?
    - Does a foldable per-channel affine gain provide most of BatchNorm's benefit without batch-statistic dependence?
    - Does GAP/sigmoid channel gating improve accuracy enough to justify non-spiking global reduction and multiplication?
    - Do adaptive thresholds improve firing balance and multi-seed stability?
    - Is one encoder skip sufficient, or are two additive skips required for boundaries and small classes?
    - What accuracy is lost after weight, membrane, threshold, and accumulator quantization?
    - Which operations dominate BRAM/URAM state, LUT/DSP usage, event routing, memory bandwidth, and energy on FPGA?
    - Which non-local operations require dedicated reduction/control logic or a hardware-aware replacement?
  working_hypotheses:
    - Depthwise-pointwise blocks greatly reduce parameters and weight memory but require pointwise channel mixing.
    - Additive skips recover spatial detail with less memory and bandwidth than concatenation.
    - A shallow decoder is sufficient for sparse event statistics and is preferable to a symmetric U-Net.
    - Per-channel affine scaling will be more robust and hardware-friendly than inference-time BatchNorm.
    - Four to eight internal timesteps may preserve most accuracy while reducing temporal compute versus twenty steps.
    - Adaptive feature-map thresholds can reduce dominant channels with very small state overhead.
    - Sparse hardware cost will correlate more strongly with measured spike rate than with dense FLOP counts.

framework:
  training_stack:
    language: Python
    tensor_library: PyTorch
    snn_framework: SpikingJelly_activation_based
    use_in_current_code:
      - SpikingJelly ATan surrogate gradient when installed
      - Custom HardwareLIF for exact leak, threshold, reset, f_inst, and f_long behavior
      - SpikingJelly activation_based Conv2d as the active spike-driven synaptic kernel
      - PyTorch nearest-neighbor interpolation for non-learned decoder routing
    requirement: SpikingJelly is mandatory for model construction; there is no conventional Conv2d fallback.
  custom_framework_decision:
    decision: Do not build a custom autograd or training framework.
    reason: PyTorch and SpikingJelly already provide optimization, surrogate gradients, temporal execution, and data loading.
  hardware_backend:
    primary_type: custom_VHDL_2008_digital_neuromorphic_FPGA
    primary_target: Xilinx_ZCU104
    primary_goal: >-
      Execute the trained spike-native graph as a digital event-driven accelerator:
      shared convolutional weights generate sparse synaptic additions, PLIF membrane/
      adaptation state is stored in fixed-point memory, and only emitted spikes are
      routed between learned stages. Avoid dense ANN-style feature processing where
      event sparsity can be exploited.
    software_reference: SpikingJelly_float_plus_bit_exact_integer_reference
    implementation_flow: [integer_reference, VHDL_RTL, RTL_simulation, synthesis, place_and_route, post_implementation_timing, activity_based_power, optional_ZCU104_measurement]
  spiker_plus:
    implementation_status: literature_and_design_inspiration_only
    retained_takeaways:
      - Fixed-point LIF arithmetic
      - Power-of-two leakage
      - Parameterized VHDL generation concepts
      - Structured software/RTL verification
      - Resource-aware accelerator design
    prohibited_claim: The project must not claim to use, extend, or depend on Spiker+ unless that decision is later implemented and documented.

active_dataset:
  name: DDD17_semantic_segmentation_Ev-SegNet_codification
  source_project: Ev-SegNet
  source_url: https://github.com/Shathe/Ev-SegNet
  task: six_class_semantic_segmentation
  root_inside_container: /datasets/DDD17
  expected_modality_first_layout:
    events:
      train: /datasets/DDD17/events/train
      test: /datasets/DDD17/events/test
    labels:
      train: /datasets/DDD17/labels/train
      test: /datasets/DDD17/labels/test
    ignored_visualization_data:
      - event_images
      - images
  accepted_alternate_layout:
    - /datasets/DDD17/train/events
    - /datasets/DDD17/train/labels
    - /datasets/DDD17/test/events
    - /datasets/DDD17/test/labels
  stored_sample:
    expected_shape: [6, H, W]
    batched_shape: [N, 6, H, W]
    dtype: floating_point_or_numeric_npy
    channels:
      - polarity_0_histogram
      - polarity_1_histogram
      - polarity_0_normalized_timestamp_mean
      - polarity_0_normalized_timestamp_standard_deviation
      - polarity_1_normalized_timestamp_mean
      - polarity_1_normalized_timestamp_standard_deviation
    warning: >-
      These channels are summary statistics of an event interval. They must not be
      reinterpreted as three chronological two-polarity timesteps.
  labels:
    ignore_index: 255
    class_count: 6
    class_mapping:
      0: flat
      1: construction_and_sky
      2: object
      3: nature
      4: human
      5: vehicle
  split_policy:
    provided_splits: [train, test]
    validation: sequence_disjoint_or_single_sequence_contiguous_holdout
    default_validation_fraction: 0.1
    seed_controls_split: true
    official_test_policy: Reserve the provided test records for final reporting after architecture selection.
    leakage_prevention: >-
      Hold out complete sequence_id groups when more than one exists. With one sequence,
      hold out one contiguous block. The resulting frame gap is a mandatory PLIF reset.
  discovery_requirements:
    - Do not recursively enumerate unrelated folders such as event_images.
    - Use bounded directory checks and os.scandir for large Windows bind mounts.
    - Pair event and label lists deterministically using the dataset's established sorted ordering.
    - Report event count, label count, selected folders, and mismatch errors explicitly.
    - Training must fail clearly when events/train exists without labels/train.
  current_input_limitation: >-
    The installed archive contains per-pixel histogram count plus timestamp mean and
    standard deviation, not every original event tuple. Exact individual arrival times
    cannot be recovered. The input scheduler therefore uses a deterministic three-arrival
    moment approximation at mean and mean plus/minus standard deviation while conserving
    each pixel/polarity histogram activity.

future_datasets:
  raw_event_segmentation:
    status: dsec_semantic_implemented_pending_accuracy_measurement
    objective: Validate chronological event clocks and truly sparse event-address inference.
    candidates:
      - DDD17 raw recordings aligned with semantic labels where accessible
      - DSEC-Semantic (implemented as dsec-raw-events-v1)
    required_fields: [timestamp, x, y, polarity, semantic_label_alignment]
    role: final_algorithm_and_hardware_validation
    dsec_contract:
      classes: 11
      label_frequency_hz: 20
      interval_us: 50000
      spatial_alignment: rectify_map_then_bottom_40_row_crop
      input: binary_ON_OFF_event_occupancy_per_hardware_clock
      full_recording_preload: false
      validation_split:
        sequence_count:
          train_fraction_through_0_5: 1
          train_fraction_above_0_5: 2
        selection: complete_sequence_subset_closest_to_active_scaled_validation_target
        split_seed: 17
        fixed_for_run: true
        installed_at_train_0_5: [zurich_city_02_a]
        installed_at_train_0_7: [zurich_city_01_a, zurich_city_02_a]
      fractional_epoch_sampling:
        scope: independently_per_training_sequence
        selection: one_contiguous_window_per_sequence_per_epoch
        shuffle: false
  legacy_mevdt:
    role: optional_future_detection_and_tracking_extension
    status: inactive_for_current_semantic_segmentation_project
    preserved_reason: Native DAVIS240C 240x180 raw events remain useful for FPGA throughput and tracking experiments.

input_and_time:
  loader_interface:
    item_shape: [6, H, W]
    batch_shape: [1, 6, H, W]
    deployment_batch: 1
    record_duration_us: 50000
    shuffle: false
    state_policy: retain_across_consecutive_records_reset_at_sequence_or_frame_gap
    fraction_policy:
      ddd17: deterministic_contiguous_stream_segment_per_epoch
      dsec: deterministic_contiguous_segment_from_every_training_sequence_per_epoch
  decoded_channel_contract:
    - polarity_0_activity
    - polarity_1_activity
    - polarity_0_normalized_timestamp_mean
    - polarity_1_normalized_timestamp_mean
    - polarity_0_normalized_timestamp_standard_deviation
    - polarity_1_normalized_timestamp_standard_deviation
  input_scheduler:
    default_internal_updates: 10
    default_event_clock_us: 5000
    configurability: internal_updates_must_divide_50000_us_exactly
    arrival_approximation:
      - {offset: mean, activity_fraction: 0.50}
      - {offset: mean_minus_std, activity_fraction: 0.25}
      - {offset: mean_plus_std, activity_fraction: 0.25}
    invariant: scheduled_synaptic_activity_equals_histogram_activity
    note: clock_updates_are_hardware_time_within_one_record_not_stacked_dataset_files
  training_state:
    truncated_bptt_boundary: one_50ms_record
    after_backward: detach_autograd_history_but_retain_numeric_neuron_state
    dsec_sequential_chunks:
      cli_default: 1
      compose_8gb_profile: 5
      behavior: backward_each_equal_chronological_chunk_then_detach_state_history
      invariant: preserve_numeric_plif_state_and_all_internal_event_clocks
    reset_conditions: [epoch_start, validation_start, sequence_change, frame_index_gap]
  forbidden:
    - repeated_static_samples
    - stacking_adjacent_numpy_records_as_one_model_input
    - shuffled_stream_records
    - state_carry_across_sequence_boundaries_or_frame_gaps
    - treating_timestamp_statistics_as_independent_image_channels_in_the_stem
  checkpoint_contract:
    version: ddd17-timestamp-v3
    fingerprint_fields:
      - manifest_digest
      - exact_record_membership
      - input_mode
      - integration_window_us
      - internal_updates
      - event_clock_us
      - stateful_stream
    legacy_policy: reject_all_older_input_protocol_checkpoints
  clock_execution:
    timestep_barrier:
      - Deliver scheduled polarity/address synaptic activity for hardware clock k
      - Complete each layer's synaptic-current updates
      - Apply leak and membrane update
      - Compare adaptive thresholds
      - Apply f_inst competition
      - Emit spikes and perform subtractive reset
      - Update f_long state
      - Advance to hardware clock k+1

neuron:
  name: HardwareLIF
  equation: V[t] = V[t-1] - V[t-1] / 2^q + I[t]
  beta_equivalent: beta = 1 - 2^(-q)
  default_beta_shift_q: 4
  default_beta: 0.9375
  threshold_default: 0.5
  reset: subtractive
  surrogate_gradient: ATan
  inference_surrogate_effect: none
  bias_policy:
    convolution_bias: false_preferred
    reason: A free bias injects current where no event/spike evidence exists and weakens sparse execution.
  state_reset:
    between_independent_samples: true
    between_batches: true
    within_sample_timesteps: false
  operation_order_must_match:
    - leak_previous_membrane
    - add_current
    - form_effective_threshold
    - compute_candidate_spikes
    - apply_f_inst_if_enabled
    - subtract_threshold_for_emitted_spikes
    - optionally_decrement_competing_membranes
    - update_f_long_adaptation

custom_spiking_dynamics:
  f_inst:
    concept: instantaneous cross-channel competition at the same spatial coordinate
    lineage: Event-Based Trajectory Prediction Using Spiking Neural Networks, 2021
    rule:
      - Determine channels above their effective threshold.
      - Select the channel with the highest candidate membrane.
      - Allow only that channel to emit a spike.
      - Optionally decrement other above-threshold membranes.
    current_default_enabled: false_for_most_architecture_presets
    reason_for_ablation: It may improve feature diversity and sparsity but can harm dense semantic recall.
    sweep:
      enabled: [false, true]
      competitor_decrement_relative_to_threshold: [0.0, 0.125, 0.25, 0.5]
  f_long_T_thresh:
    concept: slow channel-level homeostatic threshold adaptation
    lineage: Event-Based Trajectory Prediction Using Spiking Neural Networks, 2021
    scope: per_output_feature_map
    state: adaptation[channel]
    effective_threshold: theta[channel] = theta_base + adaptation[channel]
    current_defaults:
      enabled_in_adaptive_presets: true
      adaptation_increment: 0.015625
      adaptation_decay: 0.0078125
    expected_effects:
      - Reduce permanently dominant channels
      - Improve channel utilization
      - Control firing rate under changing input density
      - Add negligible state compared with spatial membrane maps
    limitation: It does not replace activation normalization during training.

architecture_family:
  model_class: EventSpikeSeg140k
  design_principles:
    - Fully spiking learned feature and class-map path
    - Shallow encoder-decoder rather than full symmetric U-Net
    - Additive skips rather than concatenation
    - Nearest-neighbor upsampling rather than transposed convolution where possible
    - Depthwise spatial filtering plus pointwise channel mixing for lightweight variants
    - Per-channel affine scaling as the preferred foldable normalization
    - GAP/sigmoid attention only as an ablation because it introduces global reduction and multiplication
    - Auxiliary heads used for training may be removed from inference
    - No bounding-box, attention-centroid, classification-only, or tracking head in the active model
  default_base_channels: 24
  output:
    temporal_spikes_shape: [T, N, 6, H, W]
    accumulated_activity: sum_or_rate_over_T
    decoded_semantic_map: argmax_over_class_activity
    ignore_index: 255
  common_encoder_decoder:
    conceptual_stages:
      - six_channel_spiking_stem
      - high_resolution_encoder_stage
      - downsampled_encoder_stage
      - low_resolution_semantic_context_stage
      - lightweight_upsampling_decoder
      - one_or_two_additive_encoder_skips
      - per_pixel_six_class_spiking_head
    exact_channels_and_shapes: configuration_and_input_resolution_dependent

architecture_search:
  fairness_contract:
    - Same training and validation records
    - Same deterministic seed
    - Same initialization procedure
    - Same optimizer, learning-rate schedule, loss, class weights, resolution, and timesteps
    - Same maximum sample counts
    - No architecture-specific manual tuning during the first ranking
  presets:
    v01_std_unet_light:
      purpose: standard_convolution_reference
      depthwise: false
      context: none
      normalization: none
      residual: false
      adaptive_threshold: false
      auxiliary_head: false
    v02_dw_light:
      purpose: depthwise_pointwise_minimal_baseline
      depthwise: true
      context: none
      normalization: none
      residual: false
      adaptive_threshold: false
    v03_dw_dilated:
      purpose: single_dilated_context_ablation
      depthwise: true
      context: dilation_2
      normalization: none
      residual: true
      adaptive_threshold: false
    v04_dw_multiscale:
      purpose: parallel_multi_scale_context_without_normalization
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: none
      residual: true
      adaptive_threshold: false
    v05_dw_multiscale_affine:
      purpose: preferred_foldable_channel_calibration
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: per_channel_gain
      residual: true
      adaptive_threshold: false
    v06_dw_multiscale_bn:
      purpose: batch_normalization_accuracy_ablation
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: BatchNorm2d
      deployment_rule: Fold frozen BN into preceding convolution before quantization.
      residual: true
      adaptive_threshold: false
    v07_dw_multiscale_gap:
      purpose: SLTNet_style_channel_attention_ablation
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: per_channel_gain
      gap_sigmoid_channel_gate: true
      residual: true
      adaptive_threshold: false
      hardware_warning: Requires global accumulation, nonlinear gate approximation, and channel multiplication.
    v08_dw_multiscale_aux:
      purpose: auxiliary_supervision_ablation
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: per_channel_gain
      residual: true
      auxiliary_head: true
      inference_rule: Auxiliary head may be removed after training.
    v09_dw_single_skip:
      purpose: lower_memory_decoder_ablation
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: per_channel_gain
      residual: true
      skip_count: 1
      adaptive_threshold: true
    v10_fpga_hybrid:
      purpose: combined_hardware_oriented_candidate
      depthwise: true
      context_dilations: [1, 2, 4]
      normalization: per_channel_gain
      residual: true
      skip_count: 2
      adaptive_threshold: true
      auxiliary_head: true
  default_architecture_before_selection: v10_fpga_hybrid
  winner_selection:
    primary_metric: validation_mIoU
    tie_window_mIoU_percentage_points: 0.5
    tie_breaker_order:
      - lower_parameter_count
      - lower_output_spike_rate
      - lower_estimated_synaptic_additions
    minimum_confirmation_seeds: [17, 101, 2026]
    promotion_rule: >-
      Do not delete the nine losing presets until the leading architecture has completed
      the staged benchmark, higher-fidelity confirmation, and multi-seed validation.
      After promotion, preserve the ablation table and preset definitions in experiment
      records even if the runtime model is simplified to one canonical architecture.

training:
  task: supervised_semantic_segmentation
  optimizer:
    name: AdamW
    default_learning_rate: 0.001
    default_weight_decay: 0.0001
  scheduler: cosine_annealing
  loss:
    primary: pixelwise_cross_entropy_on_temporally_accumulated_class_activity
    ignore_index: 255
    class_balancing: training_split_class_weights
    auxiliary_head_weight: configuration_dependent
    optional_future_regularizers:
      spike_rate: 0.001
      channel_utilization_balance: 0.001
  deterministic_seed_default: 17
  default_full_search:
    epochs: 10
    internal_timesteps: 20
    resolution_hw: [64, 64]
    max_train_samples: 2048
    max_validation_samples: configuration_dependent
    batch_size: 1
    note: Accurate but slow on CPU and not required for the first ranking pass.
  recommended_staged_search:
    stage_1_all_ten:
      purpose: coarse_architecture_ranking
      epochs: 3
      internal_timesteps: 4
      resolution_hw: [48, 48]
      max_train_samples: 512
      max_validation_samples: 128
      batch_size_cpu: 1_or_4_after_measurement
      seed: 17
    stage_2_top_three:
      epochs: 8_to_10
      internal_timesteps: 8
      resolution_hw: [64, 64]
      max_train_samples: 2048
      max_validation_samples: 512
      seed: 17
    stage_3_winner:
      internal_timestep_sweep: [1, 2, 4, 8, 16, 20]
      resolution_progression:
        - [64, 64]
        - [112, 176]
        - [224, 352]
      seeds: [17, 101, 2026]
      dataset_scope: full_available_training_split_when_practical
  runtime_optimization_rules:
    approximate_cost_proportional_to:
      - number_of_samples
      - epochs
      - internal_timesteps
      - image_height_times_width
      - architecture_synaptic_cost
    GPU:
      use_when_available: true
      batch_size_sweep: [4, 8, 16]
    CPU:
      avoid_assuming_more_threads_is_faster: true
      measure_before_changing_torch_thread_count: true
      preferred_first_speed_reductions:
        - fewer_internal_timesteps
        - fewer_samples
        - lower_resolution
        - staged_architecture_elimination
  checkpoint_contract:
    required_fields:
      - architecture_name_and_config
      - model_state
      - optimizer_or_training_metadata
      - seed
      - class_mapping
      - validation_split_indices_or_record_identifiers
      - input_resolution
      - internal_timesteps
      - normalization_mode
      - dataset_representation_version

normalization_and_scaling:
  none:
    benefit: cleanest hardware interpretation
    risk: dead or saturated channels and greater seed sensitivity
  per_channel_affine:
    selected_preferred_method: true
    equation: current[c] = gain[c] * convolution_current[c]
    bias_default: false
    reason_no_bias: Preserve zero current in inactive regions.
    deployment: Fold gain into output-channel convolution weights.
  BatchNorm:
    role: training_ablation
    training_behavior: Normalize per output channel using batch and spatial statistics, then apply learned gamma and beta.
    inference_behavior: Use frozen running statistics.
    deployment: Fold BN into convolution weights and bias before quantization.
    warning: BatchNorm effects must never simply disappear at inference.
  GAP_channel_gate:
    role: accuracy_ablation_inspired_by_SLTNet
    pipeline:
      - global_average_pool_each_channel
      - learned_channel_score
      - sigmoid_or_approximation
      - channelwise_scaling
    FPGA_costs:
      - whole_feature_map_reduction
      - gate_storage
      - multiplication_or_shift_approximation
      - global synchronization

operation_rationale:
  standard_convolution:
    benefit: strongest direct spatial_and_channel mixing
    cost: weights_and_MACs_scale_as_Kh_times_Kw_times_Cin_times_Cout
  depthwise_convolution:
    benefit: cheap_per_channel_spatial_filtering
    cost: weak_cross_channel_interaction
  pointwise_convolution:
    benefit: mixes_channels_after_depthwise_filtering_and_controls_channel_width
    cost: can_dominate_weight_count_at_high_channel_width
  dilated_convolution:
    benefit: larger_receptive_field_without_downsampling_or_more_kernel_weights
    cost: irregular_addressing_and_possible_gridding_artifacts
  multiscale_context:
    benefit: combines_local_medium_and_broad_context_for_objects_of_different_sizes
    cost: branch_buffers_and_more_synaptic_operations
  additive_skip:
    benefit: recovers_high_resolution_boundaries_without_doubling_channels
    cost: requires_shape_and_channel_alignment
  nearest_neighbor_upsampling:
    benefit: deterministic_no_weight_low_control_cost
    cost: relies_on_following_convolution_for_refinement
  residual_membrane_or_feature_path:
    benefit: preserves_subthreshold_information_and_gradient_flow
    cost: extra_buffer_or_read_port
  auxiliary_head:
    benefit: improves_gradient_delivery_to_intermediate_decoder_features
    cost: training_only_compute_and_loss_memory
  adaptive_threshold:
    benefit: dynamic_firing_rate_control_and_channel_balance
    cost: one_small_state_value_per_channel

metrics:
  primary_segmentation:
    - mean_IoU
    - per_class_IoU
    - pixel_accuracy
    - mean_class_accuracy
    - confusion_matrix
  model_efficiency:
    - parameter_count
    - checkpoint_size
    - dense_operation_estimate
    - estimated_synaptic_additions
    - peak_training_memory
    - samples_per_second
  SNN:
    - spike_rate_per_layer
    - output_spike_rate
    - silent_channel_fraction
    - dominant_channel_fraction
    - channel_utilization
    - membrane_saturation_fraction
    - internal_timestep_accuracy_curve
  robustness:
    - mean_and_standard_deviation_across_seeds
    - minimum_seed_mIoU
    - class_specific_seed_variance
  FPGA_future:
    - LUT
    - FF
    - BRAM
    - URAM
    - distributed_LUTRAM
    - DSP
    - maximum_clock_frequency
    - latency_per_input_interval
    - sustained_events_per_second
    - 99th_percentile_FIFO_occupancy
    - dynamic_power
    - energy_per_event
    - energy_per_semantic_output
  reporting_rule: Only measured values may be placed in RESULTS.md; estimates must be labeled explicitly as estimates.

quantization:
  objective: Match an addition, shift, comparison, saturation, and address-generation FPGA datapath.
  initial_formats:
    weights: signed_int8
    membrane: signed_int16
    current_accumulator: signed_int24
    base_threshold: signed_int16
    adaptive_threshold: unsigned_int16
    spike: 1_bit
    pixel_class: unsigned_3_bit
    coordinate_x: unsigned_width_dependent
    coordinate_y: unsigned_height_dependent
    timestep: unsigned_int16_or_int32
  mandatory_rules:
    - Prefer bias-free convolutions.
    - Use power-of-two-compatible leak.
    - Fold per-channel affine and BatchNorm before hardware export.
    - Use deterministic rounding and saturating arithmetic.
    - Freeze clipping and overflow behavior.
    - Quantize after architecture and timestep selection.
  experiments:
    weight_bits: [4, 6, 8]
    membrane_bits: [12, 16, 20]
    accumulator_guard_bits: sweep
    process:
      - floating_point_baseline
      - post_training_quantization
      - quantization_aware_fine_tuning
      - bit_exact_integer_export
      - layerwise_equivalence_replay

fpga_execution:
  algorithmic_model: discrete_time_spiking_semantic_segmentation_network
  physical_model: clocked_sparse_event_or_spike_address_processing
  first_software_reference: dense_PyTorch_convolution
  future_sparse_reference:
    synaptic_rule: For each active presynaptic event/spike, add the corresponding shared-kernel weight to every affected output accumulator.
    hidden_spike_multiplication: not_required_for_binary_spikes
    first_layer_statistics_mode: six_channel_values_require_quantized_current_multiplication_or_preencoded_events
    raw_event_mode: repeated_event_addresses_cause_repeated_weight_additions
  semantic_output_options:
    - accumulate_class_spikes_in_memory_then_argmax
    - stream_class_spikes_and_maintain_per_pixel_counts
    - expose_low_resolution_class_map_and_upsample_on_processing_system
  exactness_requirement: Dense software, sparse software, integer reference, RTL simulation, and FPGA output must match under the exported fixed-point contract.
  memory_mapping_policy:
    BRAM_or_URAM:
      - large_spatial_membrane_maps
      - large_current_accumulator_maps
      - deep_feature_buffers
    distributed_LUTRAM_candidates:
      - small_weight_tables
      - short_event_FIFOs
      - touched_address_queues
      - small_line_buffers
      - shallow_high_access_feature_maps
    registers:
      - per_channel_adaptation
      - thresholds_and_scales
      - class_counters
      - pipeline_control
      - small_address_state
    rule: Final placement must be frozen only after synthesis and port/timing analysis.
  exact_stateful_layer_execution:
    purpose: reproduce_trained_SpikingJelly_timestep_semantics_without_dense_sliding_window_convolution
    logical_event_address: [timestep, channel, y, x]
    state_address_example: linear_index = ((channel * H_layer) + y) * W_layer + x
    procedure:
      - Receive only emitted presynaptic spike/event addresses for the current SNN timestep.
      - Use the fixed layer connectivity, including kernel offset, groups/depthwise mapping, stride, padding, and dilation, to generate only valid postsynaptic destination addresses.
      - For each valid destination, add the corresponding shared/hardwired synaptic weight to that destination's temporary current accumulator; binary spikes require no spike-times-weight multiplier.
      - Preserve a timestep barrier: accumulate all presynaptic contributions for the layer/timestep before applying PLIF threshold/reset. Do not threshold/reset after each individual presynaptic spike because that would change the trained model semantics.
      - For each logical postsynaptic neuron address, read its own persistent membrane V, apply V_next = beta[channel] * V + I_accum, apply dynamic threshold/fInst/fLong/reset in the trained order, then write the updated V back to the same logical address.
      - Emit only addresses of neurons that fired into the next layer's event FIFO.
      - Clear/reuse the temporary current accumulator for the completed layer/timestep, but retain membrane and enabled fLong state into the next timestep and consecutive stream record.
      - Reset persistent state only at the same sequence/frame-gap boundaries used by the software reference.
    baseline_exactness: >-
      The first RTL version may sweep all logical postsynaptic addresses at the PLIF-update
      phase even when no current arrived, because beta decay still applies once per trained
      timestep. Lazy decay or touched-neuron-only updates are later optimizations and require
      a mathematically and bit-exactly validated treatment of elapsed timesteps, reset, fInst,
      and fLong.
    physical_vs_logical_neurons: >-
      There is no requirement to instantiate 52,524,272 physical PLIF circuits for the
      212x282 DDD17 case. A small PE array may be reused, provided state memory preserves
      every logical (layer, channel, y, x) membrane/adaptation value independently.
  state_memory_design:
    persistent_state:
      membrane: one_value_per_executed_PLIF_output_element
      fLong: age_and_amplitude_per_enabled_PLIF_output_element
    static_shared_parameters:
      weights: shared_by_convolution_and_may_be_ROM_or_compile_time_constants
      beta_threshold: shared_per_output_channel
    temporary_state:
      current_accumulator: per_destination_for_current_layer_and_timestep_only
      spike_events: sparse_FIFO_addresses_between_stages
    implementation_options:
      - banked_BRAM
      - distributed_LUTRAM_for_small_banks
      - external_memory_only_if_on_chip_state_capacity_or_bandwidth_requires_it
    banking_goal: allow_parallel_PE_reads_and_writes_without_colliding_on_the_same_memory_port
    important_distinction: weights_are_small_and_shared_but_logical_membrane_state_scales_with_feature_map_area
  active_state_strategies:
    baseline: full_or_tiled_state_sweep_for_exactness
    optimization_candidates:
      - active_neuron_list
      - touched_address_list
      - lazy_decay_with_last_update_timestamp
    warning: Do not adopt lazy decay until bit-exact equivalence and overflow behavior are defined.
  parallelism_sweep:
    processing_elements: [1, 4, 8, 16]
    strategies:
      - parallel_output_channels
      - parallel_kernel_offsets
      - banked_state_memory
      - ping_pong_event_and_spike_FIFOs
  deadline_rule: processing_cycles_per_input_interval_must_not_exceed_available_cycles_without_bounded_FIFO_backlog

fpga_target:
  board: Xilinx_ZCU104
  RTL_language: VHDL_2008
  initial_clock_target_mhz: 100
  reasons:
    - Existing user experience with ZCU104
    - Suitable BRAM, URAM, and programmable-logic capacity
    - ARM processing system supports replay, logging, and staged software post-processing
  interfaces:
    offline_first: DDR_or_host_stream
    live_later: event_camera_AER_or_USB_bridge_to_AXI_Stream
    control: AXI_Lite
    output: AXI_Stream_or_memory_mapped_semantic_map
  priorities:
    - state_memory_capacity_and_banking
    - memory_port_conflicts
    - event_address_generation
    - LUT_adders_comparators_and_control
    - bounded_FIFO_capacity
    - low_DSP_usage_for_binary_spiking_layers
    - clock_enable_during_inactivity

