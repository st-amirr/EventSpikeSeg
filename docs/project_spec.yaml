  architecture:
    synapse: Presynaptic spike triggers signed analog charge contribution through pulse-duration/injection circuitry;
      weight does not set presynaptic firing frequency.
    model_bin_ms: 5
    plif_update: candidate = beta * previous_post_reset_state + summed_current; apply beta once per model update,
      with model-defined threshold, subtractive reset, inhibition and adaptation.
    storage: Resident analog 3T plus native MIM cells, arranged as 8x8 banks with shared column bias and hierarchical
      page access.
    membrane_mim_nominal_fF: 50
    membrane_mim_plate_um:
    - 5
    - 5
    bank_states: 64
    shared_service: Share bank/page readers, analog compute/update, adaptation/readout interfaces and categorical
      dispatch/control across resident states. Do not replicate shared service power per logical membrane.
    page_reader_states: 1024
    class_readout: Six continuous signed class-current accumulators with shared readout; no class PLIF state.
    external_research_interfaces:
    - analog contribution magnitude/sign
    - native clocks and service phases
    - reference and programming ports as documented in module benches
    trained_checkpoint_weight_loading_required: false
