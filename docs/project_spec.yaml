normalization_and_scaling:





  none:





    benefit: cleanest hardware interpretation





    risk: dead or saturated channels and greater seed sensitivity





  per_channel_affine:





    selected_preferred_method: true





    equation: current[c] = gain[c] * convolution_current[c]





    bias_default: false





    reason_no_bias: Preserve zero current in inactive regions.





    deployment: Fold gain into output-channel convolution weights.





  BatchNorm:





    role: training_ablation





    training_behavior: Normalize per output channel using batch and spatial statistics, then apply learned 





      gamma and beta.





    inference_behavior: Use frozen running statistics.





    deployment: Fold BN into convolution weights and bias before quantization.





    warning: BatchNorm effects must never simply disappear at inference.





  GAP_channel_gate:





    role: accuracy_ablation_inspired_by_SLTNet





    pipeline:





    - global_average_pool_each_channel





    - learned_channel_score





    - sigmoid_or_approximation





    - channelwise_scaling





