    - {rank: 5, architecture: f03_early5x5_multiscale, mIoU: 0.1482063681, pixel_accuracy: 0.6718883514, parameters: 49111, spike_rate: 0.0670325544}
  key_findings:
    - The 16/32/64 single-dilation contender was the best overall and by far the most parameter-efficient, so raw capacity is not the primary accuracy bottleneck.
    - The 32/64/128 contender produced the best object IoU in this round, so moderate width can improve feature diversity.
    - The four-stage contender produced the strongest aggregate rare-class coverage, especially nature and vehicle, indicating useful deep semantic information that the existing decoder does not preserve well.
    - Early 5x5 spatial kernels reduced accuracy and are excluded from the next round.
    - Parallel multi-dilation branch averaging underperformed single dilation; the next round preserves branch identity by concatenating sparse branch outputs before learned spiking fusion.
    - None of these models displaced the historical 0.3130307198 mIoU v10_fpga_hybrid incumbent.
  rare_class_evidence:
    f02_wide32_multiscale: {object_iou: 0.0141224666, nature_iou: 0.0389757492, human_iou: 0.0, vehicle_iou: 0.0}
    f04_deep4_dilated: {object_iou: 0.0048840051, nature_iou: 0.0712307617, human_iou: 0.0059523811, vehicle_iou: 0.1229809299}
    f05_compact16_dilated: {object_iou: 0.0001719099, nature_iou: 0.0346265808, human_iou: 0.0180736408, vehicle_iou: 0.0756903067}

active_top_three_accuracy_search:
  status: implemented_pending_real_ddd17_measurement
  definitions: src/eventscnn/top_three_models.py::TOP_THREE_PRESETS
  output_directory: artifacts/ablation/top_three
  protocol:
    seed: 17
    epochs: 8
    train_samples: 2048
    held_out_samples: 512
    resolution_hw: [64, 64]
    internal_timesteps: 15
    batch_size: 14
    learning_rate: 0.002
  design_rules:
    - Preserve binary spike transmission between learned stages.
    - Keep 3x3 spatial kernels; obtain larger receptive fields with dilation instead of early 5x5 kernels.
    - Prefer depthwise spatial convolution and 1x1 pointwise/channel mixing for FPGA efficiency.
    - Do not average parallel multi-scale spike branches; concatenate them and let a following spiking 1x1 layer learn the mixture.
    - Use binary channel gates or low-resolution binary coincidence masks rather than dense softmax attention.
    - Preserve shallow spatial detail separately when testing deeper semantic paths.
    - Keep auxiliary semantic supervision and residual/skip paths.
    - Do not use hidden winner-peer competition.
  contenders:
    t01_spike_pyramid_concat:
      hypothesis: Multi-receptive-field sparse evidence is being destroyed by branch averaging and additive skip fusion.
      encoder_channels: [24, 48, 96]
      context:
        bottleneck_channels: 48
        depthwise_dilations: [1, 2, 4]
        merge: channel_concatenation
        selection: binary_spike_count_channel_attention
        fusion: spiking_1x1
      decoder_merge: concatenation_then_depthwise_pointwise_spiking_fusion
      parameter_count: 63147
    t02_dualpath_detail:
      hypothesis: Rare and small classes are lost during downsampling, so a narrow high-resolution spike path should preserve boundaries and small semantic regions.
      semantic_encoder_channels: [16, 32, 64]
      semantic_context: depthwise_dilation_2
      high_resolution_detail_channels: 16
      final_merge: semantic_plus_shallow_plus_detail_concatenation
      selection: binary_spike_count_channel_attention
      parameter_count: 24211
    t03_deep_attention_fpn:
      hypothesis: The four-stage encoder contains useful rare-class semantics, but needs an FPN decoder and low-resolution global spike interaction to retain them.
      encoder_channels: [24, 48, 96, 128]
      context: depthwise_dilation_2
      attention:
        kind: low_resolution_spike_driven_binary_mask
        attention_channels: 32
        heads: 4
        operation: q_k_binary_coincidence_plus_channel_accumulation_then_v_mask
        dense_spatial_softmax: false
      decoder: concatenative_fpn
      parameter_count: 108781
  literature_basis:
    - SLTNet shows that multi-branch depthwise/dilated event features benefit from explicit channel interaction rather than isolated depthwise processing.
    - SLTNet also demonstrates spike-driven masked attention and multi-level encoder-to-decoder feature restoration; the project adapts these ideas into smaller FPGA-oriented ablations rather than copying the complete network.
  promotion_gate:
    incumbent_miou: 0.3130307197570801
    primary_metric: mean_iou
    inspect_per_class_iou: true
    inspect_predicted_pixel_counts: true
    inspect_layer_spike_rates: true
    prefer_fewer_parameters_when_accuracy_is_equivalent: true
    larger_budget_rerun_required: true
    required_seeds: [17, 101, 2026]
    canonical_model_file_unchanged_until_pass: true


fpga_deployment_2026_08_19:
  priority: primary_hardware_goal
  target: Xilinx_ZCU104
  rtl_language: VHDL_2008
  implementation_character: digital_neuromorphic_event_driven
  canonical_model:
    public_name: EventSpikeSeg140k
    expanded_comparison_name: EventSpikeSegXL
    ddd17_registered_parameters: 140089
    ddd17_executed_training_forward_parameters: 135033
    ddd17_executed_inference_forward_parameters: 134637
    dead_registered_module:
      name: refine2
      parameters: 5056
      spiking_stage_populations: 2
      deployment_rule: omit_not_in_forward_graph
    training_only_auxiliary_head_parameters: 396
    executed_inference_spiking_stage_populations: 37
    logical_runtime_state_accounting:
      rule: >-
        Parameter count and logical neuron-state count are different quantities. Convolution
        weights are shared across spatial positions, but every executed PLIF output element
        at (channel, y, x) owns an independent persistent membrane value. The hardware may
        time-multiplex a small number of physical PLIF processing elements, but it must preserve
        the distinct logical state of every neuron address between visits and timesteps.
      dimensions:
        H2: ceil(H / 2)
        W2: ceil(W / 2)
        H4: ceil(H2 / 2)
        W4: ceil(W2 / 2)
      membrane_state_formula_general: N_mem = (672 + Nclass) * H * W + 480 * H2 * W2 + 1280 * H4 * W4
      membrane_state_formula_ddd17_6class: N_mem = 678 * H * W + 480 * H2 * W2 + 1280 * H4 * W4
      scale_channel_sums:
        full_resolution: 672_plus_Nclass
        half_resolution: 480
        quarter_resolution: 1280
      ddd17_212x282_example:
        H: 212
        W: 282
        H2: 106
        W2: 141
        H4: 53
        W4: 71
        total_logical_membrane_states: 52524272
        membrane_only_raw_storage:
          int8_MiB: 50.0910
          int12_MiB: 75.1366
          int16_MiB: 100.1821
          int20_MiB: 125.2276
      fLong_enabled_state:
        enabled_scopes: [down2, enc2, enc2_extra, down3, enc3, enc3_extra, context1, context2]
        logical_neuron_formula: N_flong = 352 * H2 * W2 + 1216 * H4 * W4
        ddd17_212x282_logical_neurons: 9836800
        persistent_values_per_enabled_neuron: [adaptation_age, adaptation_amplitude]
        ddd17_212x282_auxiliary_state_values: 19673600
        note: dynamic_threshold_is_derived_from_base_threshold_and_adaptation_state_and_need_not_be_stored_as_a_third_full_map
      state_ownership:
        per_logical_neuron_address:
          - membrane_V
          - fLong_adaptation_age_when_enabled
          - fLong_adaptation_amplitude_when_enabled
        shared_per_output_channel:
          - beta
          - base_threshold
        shared_per_synaptic_projection:
          - convolution_kernel_weights
          - folded_ChannelAffine_scale_when_used
        transient_per_timestep_or_layer:
          - synaptic_current_accumulator
          - emitted_spike_event_FIFO
          - selector_seen_spike_flags
          - semantic_spike_counters_as_required_by_readout
  model_semantics:
    SpikingStage: synaptic_Conv2d_bias_false_then_optional_affine_current_gain_then_PLIF
    convolution_interpretation: learned_shared_synaptic_weight_and_connectivity_projection
    feature_map_interpretation: logical_spatial_PLIF_neuron_population
    depthwise_pointwise_rule: two_distinct_synaptic_projection_plus_PLIF_populations
    deployed_softmax: false
    deployed_batchnorm: false
    deployed_relu_gelu: false
    output: independent_spiking_class_populations_then_temporal_spike_count_argmax
  plif_digital_mapping:
    initial_beta: 0.9375
    beta: learnable_per_output_channel
    reciprocal_tau_in_spikingjelly: one_minus_beta
    initial_threshold: 0.5
    threshold: learnable_per_output_channel
    threshold_bounds: [0.15, 1.25]
    hard_binary_forward_spikes: true
    interpretation_rule: >-
      Training membrane, synaptic-current, beta, and threshold values are numerical SNN
      state, not literal volts or amperes. FPGA inference preserves the same discrete
      PLIF equation using deterministic fixed-point arithmetic. The baseline export keeps
      a quantized per-channel beta coefficient; shift-only or power-of-two leak
      approximations are optional optimizations and require bit/accuracy revalidation.
    baseline_equation: V_next = beta_q * V + I_q
    baseline_formats_ref: quantization.initial_formats
    spatial_state: one_logical_membrane_state_per_channel_y_x
    state_storage: BRAM_URAM_or_banked_distributed_memory
    channel_shared_parameters: [beta, base_threshold]
  natural_fpga_mapping:
    convolution_weights: signed_shared_fixed_point_weight_tables
    hidden_binary_spikes: event_addresses_trigger_weight_additions_no_spike_multiply
    ChannelAffine: fold_into_quantized_synaptic_weight_or_scale
    PLIF_membrane: signed_fixed_point_state_memory
    PLIF_leak: per_channel_quantized_beta_multiply_or_verified_shift_approximation
    PLIF_threshold: quantized_per_channel_threshold_compare
    concat: channel_address_remap
    nearest_upsample: event_address_fanout
    residual_add_clamp: event_merge_or_binary_OR_dedup_equivalent
    temporal_spike_sum_argmax: integer_class_counters_and_comparator
  scalable_execution_strategy:
    preferred: coarse_grained_time_multiplexed_digital_tiles
    processing_tile: synaptic_accumulator_plus_PLIF_update_processing_elements
    convolution_weight_sharing: preserve_shared_kernels_and_reuse_across_spatial_locations
    reuse: schedule_same_processing_elements_across_spatial_tiles_channels_and_network_stages
    persistent_state: logical_PLIF_membrane_and_adaptation_state_remains_in_banked_memory_between_visits
    baseline_state_policy: exact_full_or_tiled_state_update
    sparse_optimizations_after_equivalence:
      - touched_address_queue
      - active_neuron_list
      - lazy_decay_with_last_update_timestamp
      - clock_enable_or_local_clock_suppression_when_idle
    principal_tradeoff: processing_element_parallelism_vs_latency_memory_bandwidth_and_logic_area
  fidelity_risks:
    peer_membrane_fInst:
      scope: stem_only
      issue: uses_retinotopic_cross_channel_membrane_energy_and_peer_decrement
      rule: implement_fixed_point_exactly_first; any cheaper approximation_requires_revalidation
    triangular_fLong_TThresh:
      scope: [down2, enc2, enc2_extra, down3, enc3, enc3_extra, context1, context2]
      issue: dynamic_threshold_uses_adaptation_age_amplitude_and_retinotopic_sum
      rule: store_integer_adaptation_state_and_reproduce_time_course_bit_exactly
    final_selector_global_gate:
      synaptic_part: 1x1_96_to_96_plus_PLIF
      nonlocal_part: spatial_amax_binary_channel_enable
      FPGA_rule: implement_as_per_channel_any_spike_flag_or_OR_reduction_over_emitted_events
  input_priority:
    DSEC: preferred_direct_raw_event_stream_path
    DDD17: supported_with_50ms_moment_based_timed_delivery_scheduler
  target_definition: >-
    Digital neuromorphic FPGA means the substrate is fully digital, but the runtime
    preserves SNN semantics: persistent PLIF state, binary spike communication, sparse
    event-address-triggered synaptic accumulation, shared convolution kernels, and
    inactivity-aware scheduling. Membrane and current are fixed-point numerical states,
    not physical analog voltages or currents.
  verification_chain:
    - SpikingJelly_float_golden
    - bit_exact_fixed_point_integer_reference
    - VHDL_unit_and_full_RTL_simulation
    - Vivado_synthesis_and_place_route
    - post_implementation_timing_simulation
    - representative_event_activity_SAIF_or_VCD_power_analysis
    - optional_ZCU104_board_measurement
  publishable_metrics:
    - semantic_accuracy_after_quantization
    - LUT_FF_BRAM_URAM_DSP_utilization
    - achieved_clock_frequency
    - cycle_count_and_post_route_latency
    - sustained_event_throughput
    - estimated_dynamic_static_total_power_with_activity_source_disclosed
    - estimated_energy_per_semantic_output
    - measured_power_latency_energy_if_board_available
    - spike_activity_and_event_traffic
  reporting_rule: >-
    Vivado post-implementation timing and power results are estimates and must be labeled
    as such. Only board-instrumented values may be called measured FPGA power/latency.
